               : 'A recipe was taken off, or its servings changed, so this would be a new '
                 + 'list — everything ticked on this one is cleared. The list it replaces '
                 + 'is kept until this page is closed, so it can be put back.',
             action: s.keepsTicks ? 'Update the list' : 'Make a new list' };
  }
  /* v23.8: nothing to say. Silence is the in-step state — a permanent line above the
     trolley on a screen people stare at for 45 minutes earns nothing when the news is
     good, and it dilutes the cases that matter.

     A phone that shares with nobody used to get its own line here. It is not out of step
     with anybody, and syncAlertState's `unlinked` says it on every tab in the strongest
     terms the app has. Two places saying the same thing is what this function was written
     to end. */
  return null;
}

/* Coarse on purpose. A line that says "8 seconds ago" is wrong four seconds later and is
   repainted only when something else happens. */
function agoText(ms){
  const secs = Math.max(0, Math.round(ms / 1000));
  if(secs < 45) return 'just now';
  const mins = Math.round(secs / 60);
  if(mins < 60) return mins + ' minute' + (mins === 1 ? '' : 's') + ' ago';
  const hrs = Math.round(mins / 60);
  if(hrs < 48) return hrs + ' hour' + (hrs === 1 ? '' : 's') + ' ago';
  return Math.round(hrs / 24) + ' days ago';
}

/* Pure. shoppingSeenRemoteAt advances only when a remote copy is actually read, so this
   line cannot flatter a device that has never managed it. "never" is the word that makes
   somebody stop. */
function lastContactText(seenRemoteAt, now){
  const t = tsOf(seenRemoteAt);
  if(!t) return 'Last reached the family folder: never.';
  const mins = Math.round(((now || Date.now()) - t) / 60000);
  if(mins < 1)  return 'Last reached the family folder: moments ago.';
  if(mins < 60) return 'Last reached the family folder: ' + mins + ' minute' + (mins===1?'':'s') + ' ago.';
  const hrs = Math.round(mins / 60);
  if(hrs < 48)  return 'Last reached the family folder: ' + hrs + ' hour' + (hrs===1?'':'s') + ' ago.';
  const days = Math.round(hrs / 24);
  return 'Last reached the family folder: ' + days + ' day' + (days===1?'':'s') + ' ago.';
}

function renderSyncAlert(){
  const box = document.getElementById('syncAlert');
  if(!box) return;
  const st = syncAlertState({
    backend: syncBackend(),
    signedIn: !!msalAccount,
    lastWriteError: lastWriteError,
    pendingSince: syncPendingSince,
    seenRemoteAt: shoppingSeenRemoteAt,
    startedAt: appStartedAt,
    tripConflict: tripDisagreement,
    now: Date.now()
  });
  // A write failure is never silenced. Everything else can be put aside for the session:
  // local-only use is legitimate, but the mute is never persisted, so a family phone that
  // waved this away today is told again tomorrow.
  if(!st || (st.kind !== 'error' && syncAlertMuted === st.kind)){ box.hidden = true; return; }

  let head = st.head, hint = st.hint;
  if(st.kind === 'error'){
    const m = writeErrorMessage(st.writeError.status, st.writeError.name);
    head = m[0]; hint = m[1];
  }
  box.className = 'sync-alert no-print ' + (st.kind === 'pending' ? 'pending' : 'err');
  box.innerHTML = '';
  box.appendChild(el('strong',{},[head]));
  box.appendChild(el('span',{class:'hint'},[hint]));
  if(st.last) box.appendChild(el('span',{class:'hint last'},[st.last]));
  if(st.action){
    const actions = el('div',{class:'alert-actions'});
    const go = el('button',{class:'alert-btn'},[st.action]);
    // The fix, where the complaint is. For a trip disagreement that is the Review tab,
    // where both lists are described and either can be settled — not the sync modal.
    go.addEventListener('click', ()=>{
      if(st.actionKind === 'review') goToTab('review'); else showSyncModal();
    });
    actions.appendChild(go);
    const later = el('button',{class:'alert-btn quiet'},['Not now']);
    later.addEventListener('click', ()=>{ syncAlertMuted = st.kind; renderSyncAlert(); });
    actions.appendChild(later);
    box.appendChild(actions);
  }
  box.hidden = false;
}

function markSyncPending(){
  if(!syncPendingSince) syncPendingSince = Date.now();
  renderSyncAlert();
}

function markSyncOk(){
  lastWriteError = null;
  syncPendingSince = null;
  lastSyncOkAt = Date.now();
  renderSyncAlert();
}

function markSyncFailed(status, name){
  lastWriteError = { status: status, name: name };
  renderSyncAlert();
}

// Re-evaluate once a minute so a stall becomes visible without needing another edit.
if(!syncAlertTimer) syncAlertTimer = setInterval(renderSyncAlert, 60000);

/* ---------------- File System Access API (Chrome/Edge) ---------------- */

function fsaSupported(){ return 'showDirectoryPicker' in window; }

async function connectFolder(){
  if(!fsaSupported()){
    alert('Your browser can’t link directly to a folder. Use "Export data" to save files into your shared drive folder manually, and "Import data" on other devices to load them.');
    return;
  }
  try{
    dirHandle = await window.showDirectoryPicker({id:'family-menu', mode:'readwrite'});
    await idbSaveHandle(dirHandle);
    localStorage.setItem(LS_HANDLE_FLAG, '1');
    await loadFromFolderOrSeed();
    setStatus('Connected to shared folder. Saving changes there automatically.', 'ok');
  }catch(err){
    console.warn('Folder connect cancelled/failed', err);
  }
}

async function tryReconnectFolder(){
  if(!fsaSupported()) return;
  if(localStorage.getItem(LS_HANDLE_FLAG) !== '1') return;
  try{
    const handle = await idbGetHandle();
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      dirHandle = handle;
      await loadFromFolderOrSeed();
      setStatus('Reconnected to shared folder.', 'ok');
    } else {
      setStatus('Shared folder was connected before — open "Sync options" to reconnect.', 'warn');
    }
  }catch(e){ console.warn(e); }
}

async function loadFromFolderOrSeed(){
  if(!dirHandle) return;
  try{
    let recipesChanged = false;
    const rFile = await getFileText(dirHandle, 'recipes-data.json');
    if(rFile){
      const before = JSON.stringify(recipesData);
      const incoming = migrateIngredientsIfStale(JSON.parse(rFile), window.__fmaSeedRecipes);
      if(JSON.stringify(incoming) !== before){
        recipesData = incoming;
        saveRecipesLocal();
        recipesChanged = true;
      }
      await writeFileToFolder('recipes-data.json', JSON.stringify(recipesData));
    }
    else { await writeFileToFolder('recipes-data.json', JSON.stringify(recipesData)); }
    const sFile = await getFileText(dirHandle, 'shopping-list.json');
    // v21.2: merge, don't replace. This path used to assign the folder's copy straight
    // over shoppingData — the same tick-destroying bug v21.0 fixed on the OneDrive side,
    // left live here. Going through applyMergedShopping also repaints, so the rendered
    // rows can't be left pointing at the discarded object graph.
    if(sFile){ mergeRemoteShopping(JSON.parse(sFile)); }
    else { await writeFileToFolder('shopping-list.json', JSON.stringify(shoppingData)); }
    if(recipesChanged) repaintWhenSafe();
    fetchTripHistory();
  }catch(e){
    console.error(e);
    setStatus('Could not read the shared folder: ' + e.message, 'warn');
  }
}

async function getFileText(dir, name){
  try{
    const fh = await dir.getFileHandle(name, {create:false});
    const file = await fh.getFile();
    return await file.text();
  }catch(e){ return null; }
}

async function writeFileToFolder(name, text){
  if(!dirHandle) return;
  try{
    const fh = await dirHandle.getFileHandle(name, {create:true});
    const writable = await fh.createWritable();
    await writable.write(text);
    await writable.close();
  }catch(e){ console.error('write failed', name, e); setStatus('Could not save to shared folder (' + name + '): ' + e.message, 'warn'); }
}

let saveTimer = null;
let folderDirtyRecipes = false, folderDirtyShopping = false;
function autoSaveToFolder(which){
  if(which !== 'shopping') folderDirtyRecipes = true;
  if(which !== 'recipes') folderDirtyShopping = true;
  if(!dirHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    // Same reason as the OneDrive path: don't rewrite the ~1MB recipe file because
    // somebody ticked a tomato off the list.
    const doR = folderDirtyRecipes, doS = folderDirtyShopping;
    folderDirtyRecipes = false; folderDirtyShopping = false;
    if(doR) await writeFileToFolder('recipes-data.json', JSON.stringify(recipesData));
    if(doS) await writeFileToFolder('shopping-list.json', JSON.stringify(shoppingData));
    setStatus('Saved to shared folder — ' + new Date().toLocaleTimeString(), 'ok');
  }, 600);
}

/* tiny indexedDB helper to persist the directory handle across reloads */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('fma-db', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSaveHandle(handle){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'dir');
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetHandle(){
  const db = await idbOpen();
  return new Promise((resolve)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get('dir');
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>resolve(null);
  });
}

/* ---------------- OneDrive sync (Microsoft Graph, via MSAL.js) ----------------
   Works on any device with a browser and internet connection, including Android —
   unlike the File System Access folder link above, which is desktop Chrome/Edge only.
   Sign-in uses a full-page redirect (not a popup) for reliability on mobile browsers.
   Same "last save wins" model as the folder sync: no automatic merge. */

function oneDriveSupported(){ return typeof msal !== 'undefined'; }

async function initMsal(){
  if(!oneDriveSupported()){
    console.warn('MSAL.js did not load (offline, or CDN blocked) — OneDrive sign-in unavailable this session.');
    return;
  }
  try{
    msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
    const resp = await msalInstance.handleRedirectPromise();
    if(resp && resp.account){
      msalAccount = resp.account;
    } else {
      const accounts = msalInstance.getAllAccounts();
      if(accounts.length) msalAccount = accounts[0];
    }
    if(msalAccount && localStorage.getItem(LS_ONEDRIVE_FLAG) === '1'){
      await loadFromOneDriveOrSeed();
      setStatus('Reconnected to OneDrive (' + (msalAccount.username||'') + ').', 'ok');
      startOneDrivePolling();
    }
  }catch(e){
    console.error('MSAL init failed', e);
  }
}

async function signInOneDrive(){
  if(!oneDriveSupported()){
    alert('The Microsoft sign-in library did not load. Check your internet connection and try again — OneDrive sync needs to be online.');
    return;
  }
  try{
    localStorage.setItem(LS_ONEDRIVE_FLAG, '1');
    await msalInstance.loginRedirect({ scopes: GRAPH_SCOPES, prompt: 'select_account' }); // always show the account picker — needed so a device signed into a personal Microsoft account can choose the shared FridgeList account instead
    // Page navigates away here; flow continues in initMsal() after the redirect back.
  }catch(e){
    console.error('OneDrive sign-in failed', e);
    setStatus('OneDrive sign-in failed: ' + e.message, 'warn');
  }
}

function signOutOneDrive(){
  stopOneDrivePolling();
  localStorage.removeItem(LS_ONEDRIVE_FLAG);
  oneDriveFolderRef = null;
  oneDriveLastModified = {};
  const account = msalAccount;
  msalAccount = null;
  if(msalInstance && account){
    msalInstance.logoutRedirect({ account }); // navigates away
  } else {
    setStatus('Signed out of OneDrive.', 'ok');
    render();
  }
}

async function getGraphToken(){
  if(!msalInstance || !msalAccount) return null;
  try{
    const res = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: msalAccount });
    return res.accessToken;
  }catch(e){
    console.warn('Silent token acquisition failed, falling back to interactive', e);
    try{
      localStorage.setItem(LS_ONEDRIVE_FLAG, '1');
      await msalInstance.acquireTokenRedirect({ scopes: GRAPH_SCOPES, account: msalAccount });
    }catch(e2){ console.error(e2); }
    return null;
  }
}

async function graphFetch(path, token, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  return fetch('https://graph.microsoft.com/v1.0' + path, Object.assign({}, opts, { headers }));
}

// Resolves a "FridgeList" folder to sync through.
//
// Family members who don't own the folder should add a SHORTCUT to it in their own
// OneDrive first (onedrive.com -> Shared -> FridgeList -> "Add shortcut to My files").
// A shortcut shows up as a normal item at the root of their own drive, so the first
// check below finds it directly and reliably.
//
// We deliberately do NOT rely on the /me/drive/sharedWithMe endpoint as the primary
// mechanism any more: Microsoft has throttled it (sometimes returning only a single
// result) ahead of fully retiring it in November 2026. It's kept as a best-effort
// fallback only — something that might help, never something we depend on.
//
// A brand-new folder is only ever created after the human confirms it via
// confirmCreateNewFridgeListFolder() — see resolveOrCreateFridgeListFolder() below —
// so a family member can never silently end up with their own disconnected copy.
async function resolveFridgeListFolder(token){
  let res = await graphFetch('/me/drive/root:/FridgeList', token);
  if(res.status === 200){
    const j = await res.json();
    if(j.remoteItem) return { driveId: j.remoteItem.parentReference.driveId, itemId: j.remoteItem.id }; // shortcut to a shared folder
    return { driveId: j.parentReference.driveId, itemId: j.id }; // folder we own outright
  }

  // Best-effort only — known unreliable, see comment above.
  res = await graphFetch('/me/drive/sharedWithMe', token);
  if(res.status === 200){
    const j = await res.json();
    const match = (j.value || []).find(it => it.name === 'FridgeList' && it.folder && it.remoteItem);
    if(match) return { driveId: match.remoteItem.parentReference.driveId, itemId: match.remoteItem.id };
  }

  return null; // not found anywhere — caller decides whether to offer creating a new one
}

async function createFridgeListFolder(token){
  const res = await graphFetch('/me/drive/root/children', token, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: 'FridgeList', folder: {}, '@microsoft.graph.conflictBehavior': 'fail' })
  });
  if(res.status === 201){
    const j = await res.json();
    return { driveId: j.parentReference.driveId, itemId: j.id };
  }
  return null;
}

// Wraps resolveFridgeListFolder() with a human checkpoint: if no existing folder is
// found (owned or shortcut), ask before creating a new one, rather than silently
// spinning up a disconnected copy for whoever forgot the shortcut step.
async function resolveOrCreateFridgeListFolder(token){
  const found = await resolveFridgeListFolder(token);
  if(found) return found;
  const proceed = confirm('No "FridgeList" folder was found in your OneDrive.\n\nIf someone in your family already set this up, you probably need to add a shortcut to their shared folder first (onedrive.com -> Shared -> FridgeList -> "Add shortcut to My files"), then try again.\n\nOtherwise, click OK to create a new, empty FridgeList folder in your own OneDrive.');
  if(!proceed) return null;
  return createFridgeListFolder(token);
}

async function getOneDriveFileText(driveId, folderItemId, name, token){
  const res = await graphFetch('/drives/' + driveId + '/items/' + folderItemId + ':/' + encodeURIComponent(name) + ':/content', token);
  if(res.status === 200) return res.text();
  return null; // 404 = not created yet; anything else logged by caller
}

async function writeOneDriveFile(driveId, folderItemId, name, text){
  const token = await getGraphToken();
  if(!token){ lastWriteError = { status: 401, name: name }; return false; }
  try{
    const res = await graphFetch('/drives/' + driveId + '/items/' + folderItemId + ':/' + encodeURIComponent(name) + ':/content', token, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: text
    });
    if(res.status === 200 || res.status === 201) return true;
    // v20: keep the status. "Could not save" is not actionable; "the drive is full" is.
    console.warn('OneDrive write failed', name, res.status);
    lastWriteError = { status: res.status, name: name };
    return false;
  }catch(e){
    console.error('OneDrive write failed', name, e);
    lastWriteError = { status: 0, name: name };
    return false;
  }
}

async function loadFromOneDriveOrSeed(){
  const token = await getGraphToken();
  if(!token){ setStatus('Could not get a OneDrive sign-in token — try "Sync options" to sign in again.', 'warn'); return; }
  try{
    oneDriveFolderRef = await resolveOrCreateFridgeListFolder(token);
    if(!oneDriveFolderRef){
      setStatus('No "FridgeList" folder connected — open Sync options to try again.', 'warn');
      return;
    }
    const { driveId, itemId } = oneDriveFolderRef;
    // v21.5: only repaint if something actually came back different. Most opens change
    // nothing at all, and every one of those repaints used to be pure interruption.
    let changed = false;
    const rText = await getOneDriveFileText(driveId, itemId, 'recipes-data.json', token);
    if(rText){
      const before = JSON.stringify(recipesData);
      const incoming = migrateIngredientsIfStale(JSON.parse(rText), window.__fmaSeedRecipes);
      if(JSON.stringify(incoming) !== before){
        recipesData = incoming;
        saveRecipesLocal();
        changed = true;
      }
    } else {
      await writeOneDriveFile(driveId, itemId, 'recipes-data.json', JSON.stringify(recipesData));
    }
    const sText = await getOneDriveFileText(driveId, itemId, 'shopping-list.json', token);
    if(sText){
      // Merge rather than replace, so ticks made on this device while offline/only-local
      // survive reconnection instead of being wiped by the remote copy. applyMergedShopping
      // repaints by itself when the shopping data moved, so only a recipes change is
      // still owed one here.
      // The folder poll has just restamped this file, so that mtime is what we merged.
      mergeRemoteShopping(JSON.parse(sText), oneDriveLastModified['shopping-list.json']);
    } else {
      await writeOneDriveFile(driveId, itemId, 'shopping-list.json', JSON.stringify(shoppingData));
    }
    if(changed) repaintWhenSafe();
    // Deliberately last, and not awaited by anything the user is waiting on: the trip
    // archive is never on the critical path to seeing this week's list.
    fetchTripHistory();
  }catch(e){
    console.error(e);
    setStatus('Could not sync with OneDrive: ' + e.message, 'warn');
  }
}

/* v21.2: recipes used to be PUT with no concurrency guard at all, so a device holding
   a stale copy would overwrite good data — and because every shopping tick pushed the
   file too (see persist), that could happen repeatedly without anyone editing a recipe.
   Recipes have no per-item merge, so the honest behaviour on a genuine conflict is to
   refuse to clobber and say so, rather than silently picking a winner.
   One retry first: a benign race (our own earlier write, a stale ETag) clears on the
   second attempt without troubling anyone. */
let recipesETag = null;

async function fetchRecipesMeta(token){
  if(!oneDriveFolderRef) return null;
  const { driveId, itemId } = oneDriveFolderRef;
  const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + ':/recipes-data.json', token);
  if(res.status !== 200) return null; // 404 = not created yet
  const meta = await res.json();
  return { etag: meta.eTag };
}

async function writeRecipesGuarded(token){
  const { driveId, itemId } = oneDriveFolderRef;
  const body = JSON.stringify(recipesData);
  for(let attempt = 0; attempt < 2; attempt++){
    if(!recipesETag){
      const meta = await fetchRecipesMeta(token);
      recipesETag = meta && meta.etag;   // still null if the file doesn't exist yet
    }
    const headers = { 'Content-Type': 'application/json' };
    if(recipesETag) headers['If-Match'] = recipesETag;
    const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + ':/recipes-data.json:/content', token, {
      method: 'PUT', headers, body
    });
    if(res.status === 200 || res.status === 201){
      try{
        const wrote = await res.json();
        recipesETag = (wrote && wrote.eTag) || null;
      }catch(e){ recipesETag = null; }
      return true;
    }
    if(res.status === 412){ recipesETag = null; continue; } // refetch and retry once
    console.warn('recipes write failed', res.status);
    lastWriteError = { status: res.status, name: 'recipes-data.json' };
    return false;
  }
  // Still conflicting: another device really is editing recipes right now. Leave both
  // copies alone — the local edit stays saved on this device and owed to OneDrive.
  console.warn('recipes write conflicted twice; not overwriting');
  lastWriteError = { status: 412, name: 'recipes-data.json' };
  return false;
}

let oneDriveSaveTimer = null;
// Which files a debounced save still owes. Accumulated across calls, because several
// persist()s can coalesce into one timer and each may have dirtied a different file.
let pendingSaveRecipes = false;
let pendingSaveShopping = false;

function autoSaveToOneDrive(which){
  if(which !== 'shopping') pendingSaveRecipes = true;
  if(which !== 'recipes') pendingSaveShopping = true;
  if(!msalAccount || localStorage.getItem(LS_ONEDRIVE_FLAG) !== '1') return;
  clearTimeout(oneDriveSaveTimer);
  oneDriveSaveTimer = setTimeout(async ()=>{
    if(!oneDriveFolderRef){
      // Background autosave never prompts — only a user-initiated sign-in/sync does.
      // If nothing's resolved yet, skip this save; it'll go through next time the
      // folder is properly connected via Sync options.
      const token = await getGraphToken();
      if(!token) return;
      oneDriveFolderRef = await resolveFridgeListFolder(token);
      if(!oneDriveFolderRef) return;
    }
    // Claim the pending work up front: anything dirtied while these writes are in
    // flight re-sets the flags and schedules another pass rather than being lost.
    const doRecipes = pendingSaveRecipes, doShopping = pendingSaveShopping;
    pendingSaveRecipes = false; pendingSaveShopping = false;
    if(!doRecipes && !doShopping) return;
    lastWriteError = null;
    let okR = true, okS = true;
    if(doRecipes){
      const tokenR = await getGraphToken();
      if(!tokenR){ lastWriteError = { status: 401, name: 'recipes-data.json' }; okR = false; }
      else okR = await writeRecipesGuarded(tokenR);
      if(!okR) pendingSaveRecipes = true;   // keep it owed so a later save retries
    }
    if(doShopping){
      const tokenS = await getGraphToken();
      if(!tokenS){ lastWriteError = { status: 401, name: 'shopping-list.json' }; okS = false; }
      else okS = await writeShoppingMerged(tokenS);
      if(!okS) pendingSaveShopping = true;
    }
    if(okR && okS){
      markSyncOk();
      setStatus('Saved to OneDrive — ' + new Date().toLocaleTimeString(), 'ok');
    } else {
      const err = lastWriteError || { status: 0, name: doShopping ? 'shopping-list.json' : 'recipes-data.json' };
      markSyncFailed(err.status, err.name);
      setStatus(writeErrorMessage(err.status, err.name)[0], 'warn');
    }
    // Stamp our own write so the next poll doesn't immediately re-download what we just sent.
    stampOneDriveTimestamps();
  }, 600);
}

// Lightweight near-live sync: every 20s, check the FridgeList folder's file
// timestamps (one small metadata call) and only download+redraw if something
// actually changed on another device. Skipped while the tab is hidden, a modal
// is open, or the user is mid-typing — same guard the daily auto-reload uses.
const ONEDRIVE_POLL_MS = 20000;

function startOneDrivePolling(){
  stopOneDrivePolling();
  if(!msalAccount || localStorage.getItem(LS_ONEDRIVE_FLAG) !== '1') return;
  stampOneDriveTimestamps(); // baseline, so the first poll doesn't false-trigger
  oneDrivePollTimer = setInterval(pollOneDriveForChanges, ONEDRIVE_POLL_MS);
  startShoppingFastPoll();
}

function stopOneDrivePolling(){
  if(oneDrivePollTimer){ clearInterval(oneDrivePollTimer); oneDrivePollTimer = null; }
  stopShoppingFastPoll();
}

async function stampOneDriveTimestamps(){
  if(!oneDriveFolderRef) return;
  const token = await getGraphToken();
  if(!token) return;
  try{
    const { driveId, itemId } = oneDriveFolderRef;
    const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + '/children?$select=name,lastModifiedDateTime', token);
    if(res.status !== 200) return;
    const j = await res.json();
    (j.value || []).forEach(item => {
      if(item.name === 'recipes-data.json' || item.name === 'shopping-list.json'){
        oneDriveLastModified[item.name] = item.lastModifiedDateTime;
      }
    });
  }catch(e){ /* best-effort; a missed stamp just means one extra poll-triggered pull later */ }
}

async function pollOneDriveForChanges(){
  if(document.hidden) return; // tab not visible — save the battery/data, catch up on return
  if(document.getElementById('modalRoot').innerHTML !== '') return; // never interrupt an open modal
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')) return; // never interrupt typing
  if(!oneDriveFolderRef || !msalAccount) return;
  // Shared with the 5s shopping poll — both merge into shoppingData, and interleaving
  // them let the slower one write a result computed from state the faster one had
  // already moved on from, dropping a merge.
  if(syncInFlight) return;
  syncInFlight = true;
  try{
    const token = await getGraphToken();
    if(!token) return;
    const { driveId, itemId } = oneDriveFolderRef;
    const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + '/children?$select=name,lastModifiedDateTime', token);
    if(res.status !== 200){ noteRemoteCheckFailed(); return; }
    const j = await res.json();
    let changed = false;
    (j.value || []).forEach(item => {
      if(item.name === 'recipes-data.json' || item.name === 'shopping-list.json'){
        const prev = oneDriveLastModified[item.name];
        if(prev && prev !== item.lastModifiedDateTime) changed = true;
        oneDriveLastModified[item.name] = item.lastModifiedDateTime;
        if(item.name === 'shopping-list.json') noteRemoteShoppingStamp(item.lastModifiedDateTime, null);
      }
    });
    if(changed){
      await loadFromOneDriveOrSeed();
      setStatus('Updated from OneDrive — ' + new Date().toLocaleTimeString(), 'ok');
    }
  }catch(e){ noteRemoteCheckFailed(); console.warn('OneDrive poll failed', e); }
  finally{ syncInFlight = false; }
}

/* ---------------- concurrent-shopping merge (v15) ----------------
   Two people ticking off the same list in different parts of the supermarket used
   to race: each device wrote the WHOLE shopping file, so the second save wiped the
   first one's ticks. Shopping saves now merge per item instead of overwriting:
   fetch remote, resolve each line by latest per-item timestamp (a tick beats an
   untick when neither is stamped), then write back guarded by the file's ETag —
   if someone else wrote in between, the write is refused and we re-merge and retry.
   Scope: shopping list + wait-list done flags only. Recipes stay last-save-wins. */

function lineMergeKey(l){
  return l.source === 'needed' ? ('needed:' + l.neededId) : ('ing:' + (l.ingredientName||'').trim().toLowerCase());
}

function tsOf(v){ return v ? (Date.parse(v) || 0) : 0; }

/* The identity of a shopping trip. Explicit from v21 on; derived from generatedAt for
   files written by older builds, so both devices independently agree on the same id
   for the same list without needing a migration write. */
function tripIdOf(sd){
  const wp = sd && sd.weekPlan;
  if(!wp) return null;
  return wp.tripId || (wp.generatedAt ? 'gen:' + wp.generatedAt : null);
}

/* ---- v23.6: a trip id somebody can read out ----

   Two lists generated from the same picks are identical on screen and are two different
   trips. That is the fork the family could not see, and it is the reason a whole release
   went into explaining a symptom that a four-character code would have made obvious. The
   code is derived from the WHOLE id, so it changes exactly when the trip does — and
   nothing ever parses it back, so it is a label and not an identifier.

   Pure, and it must stay that way: the device id is passed in, the way
   tripRecordFromShopping already takes it, rather than reached for. */
function tripParts(tripId){
  if(!tripId) return { at: null, device: null };
  // The id is 'trip:<iso>:<device>' and an ISO timestamp contains colons of its own, so
  // the device is what follows the LAST one. 'gen:<iso>', from a pre-v21 file, has none.
  if(tripId.indexOf('gen:') === 0) return { at: tripId.slice(4), device: null };
  if(tripId.indexOf('trip:') === 0){
    const rest = tripId.slice(5);
    const cut = rest.lastIndexOf(':');
    return cut < 0 ? { at: rest, device: null }
                   : { at: rest.slice(0, cut), device: rest.slice(cut + 1) };
  }
  return { at: null, device: null };
}

function tripCode(tripId){
  if(!tripId) return '----';
  let h = 5381;
  for(let i = 0; i < tripId.length; i++) h = (((h << 5) + h) ^ tripId.charCodeAt(i)) >>> 0;
  return h.toString(36).toUpperCase().slice(-4).padStart(4, '0');
}

function tripLabel(sd, myDeviceId){
  const id = tripIdOf(sd);
  if(!id) return 'No shopping list has been made on this phone yet.';
  const p = tripParts(id);
  const at = tsOf(p.at) || tsOf(sd && sd.weekPlan && sd.weekPlan.generatedAt);
  const when = at ? new Date(at) : null;
  return 'List ' + tripCode(id)
    + (when ? ' \u2014 made ' + when.toLocaleDateString() + ' '
              + when.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '')
    + (p.device ? (p.device === myDeviceId ? ', on this phone' : ', on another phone') : '');
}

/* ---- v21.8: is anyone actually shopping from this list? ----
   Ticks are the only honest signal available. A list with recent ticks on it is a
   trolley somewhere in a supermarket, and nothing generated elsewhere gets to replace
   it. Recency counts as much as the count does: last week's list, ticked and never
   marked done, must not block this week's new one for ever. All three read only what
   is already in the file — no new fields — so they judge copies written by older
   builds exactly as well as new ones. */
const TRIP_LIVE_WINDOW_MS = 6 * 60 * 60 * 1000;

function tripProgress(sd){
  const lines = (sd && sd.shoppingList) || [];
  let ticks = 0, newestAt = 0;
  lines.forEach(l=>{
    if(!l.checked || l.removed) return;   // "in the trolley", same sense as the progress bar
    ticks++;
    const t = tsOf(l.checkedAt || l.changedAt);   // changedAt: ticks from pre-v21 builds
    if(t > newestAt) newestAt = t;
  });
  return { ticks: ticks, newestAt: newestAt };
}

/* v23.3: everything that protects a shopper's work used to ask tripProgress, and
   tripProgress counts TICKS. But a family does two different things with a list: they
   prune it at the kitchen table — "we have olive oil", "not chorizo this week" — and then
   they tick it off in the aisle. Only the second was visible, so a carefully pruned list
   looked untouched to the freeze, to the auto-refresh, to the undo and to the merge, and
   adding one recipe threw the whole lot away. That was the bug behind v23.3.
   A stamped removal or "at home" counts here; an unstamped one does not, because the
   pantry rule sets atHome without a stamp and a default is not a decision — the same
   distinction atHomeAt exists to make. */
function tripDecisions(sd){
  const lines = (sd && sd.shoppingList) || [];
  let decisions = 0, newestAt = 0;
  lines.forEach(l=>{
    if(!((l.checked && !l.removed) || l.removedAt || l.atHomeAt)) return;
    decisions++;
    const t = Math.max(tsOf(l.checkedAt), tsOf(l.removedAt), tsOf(l.atHomeAt), tsOf(l.changedAt));
    if(t > newestAt) newestAt = t;
  });
  return { decisions: decisions, newestAt: newestAt };
}

// "Is there work here worth keeping?" — an undo is owed for pruning just as much as for
// a half-filled trolley.
function tripHasProgress(sd){
  if(!sd || !sd.weekPlan || sd.weekPlan.shoppingDoneAt) return false;
  return tripDecisions(sd).decisions > 0;
}

/* "Is somebody in a shop right now?" — a DIFFERENT question, and it is still ticks only.
   This one freezes the week's recipes, and pruning must not do that: people prune at home
   and then carry on planning, which is exactly what the family was doing when this broke.
   Deliberately separate from tripHasProgress above. Do not fold the two back together.
   A trip nobody has ticked in six hours is not a trip anybody is still shopping.
   Ticks with no stamp at all are treated as live: the cost of being wrong is one
   visible "start a new list anyway" tap, and the cost the other way is a wiped trolley. */
function tripIsLive(sd, now){
  if(!sd || !sd.weekPlan || sd.weekPlan.shoppingDoneAt) return false;
  const p = tripProgress(sd);
  if(!p.ticks) return false;
  if(!p.newestAt) return true;
  return ((now || Date.now()) - p.newestAt) <= TRIP_LIVE_WINDOW_MS;
}

// The same six-hour test against decisions rather than ticks, for the one place that has
// to weigh two copies of a list against each other rather than lock a tab.
function tripIsWorkedOn(sd, now){
  if(!tripHasProgress(sd)) return false;
  const d = tripDecisions(sd);
  if(!d.newestAt) return true;
  return ((now || Date.now()) - d.newestAt) <= TRIP_LIVE_WINDOW_MS;
}

/* ---- v21.8: which of two DIFFERENT trips is the real one ----

   Until now this was "whichever was generated later, wholesale", and that one line
   cost a family a shopping trip: a phone that had not caught up regenerated from last
   week's picks, its trip was newer by the clock, and a half-ticked trolley was thrown
   away. "Later" cannot tell a deliberate replacement from a list built in ignorance,
   so trips now carry enough to tell the difference:

     weekPlan.supersedes — the trip this one was generated on top of. Present only when
                           the generating device could actually see that trip.
     weekPlan.basedOn    — how caught-up that device was, as the lastUpdated of the
                           newest shared copy it had read.

   Both are additive and optional: a copy from an older build simply has neither, and
   is judged on progress alone, which is the safe side to be on. */
function chooseTripWinner(a, b, aGen, bGen, primary, now){
  const aTrip = tripIdOf(a), bTrip = tripIdOf(b);
  const aWp = a.weekPlan || {}, bWp = b.weekPlan || {};

  // 1. Deliberate replacement. One of them was generated by someone looking at the
  //    other, which is a person deciding this list is finished with — and on this
  //    build that decision came with a warning naming the ticks it would cost.
  const aReplacesB = !!bTrip && aWp.supersedes === bTrip;
  const bReplacesA = !!aTrip && bWp.supersedes === aTrip;
  if(aReplacesB !== bReplacesA) return aReplacesB ? a : b;

  // 2. Neither knew the other, so this is a fork rather than a replacement. A list
  //    nobody has touched never replaces one somebody has worked on — v23.3 widened
  //    "worked on" from ticks to any deliberate decision, because a phone that had
  //    merely regenerated could otherwise discard another phone's whole pruning.
  const aLive = tripIsWorkedOn(a, now), bLive = tripIsWorkedOn(b, now);
  if(aLive !== bLive) return aLive ? a : b;

  // 3. Two forks, neither being shopped: the one generated from fresher shared data
  //    wins. This is the stale device losing on the only ground that distinguishes it.
  const aBased = tsOf(aWp.basedOn), bBased = tsOf(bWp.basedOn);
  if(aBased !== bBased) return aBased > bBased ? a : b;

  // 4. Nothing to tell them apart — both from builds that recorded none of this.
  //    The old rule, which is still right when there is no better information.
  return aGen === bGen ? primary : (aGen > bGen ? a : b);
}

/* v23.6. Two phones on two trips is a disagreement, and the app used to settle it in
   silence: chooseTripWinner picked one, somebody's walk round a shop went with the loser,
   and the WINNING phone was never told there had been an argument at all. That is the
   half nobody could act on — the family reported the symptom from the losing side and had
   no way to connect it to anything.

   This names the disagreement, and names it by asking chooseTripWinner, so the card can
   never claim an outcome the merge did not reach. The primary/aGen/bGen it computes are
   the same three mergeShoppingData computes, deliberately: if those ever drift the two
   would disagree, which is the bug this function exists to prevent. Pure. */
function tripConflict(local, remote, now){
  const mine = tripIdOf(local), theirs = tripIdOf(remote);
  if(!mine || !theirs || mine === theirs) return null;
  const aGen = tsOf(local.weekPlan && local.weekPlan.generatedAt);
  const bGen = tsOf(remote.weekPlan && remote.weekPlan.generatedAt);
  const primary = tsOf(local.lastUpdated) >= tsOf(remote.lastUpdated) ? local : remote;
  const winner = chooseTripWinner(local, remote, aGen, bGen, primary, now);
  const iWon = winner === local;
  return { mineTrip: mine, theirsTrip: theirs, iWon: iWon, loser: iWon ? remote : local };
}

/* Resolve one boolean across two copies of the same line.
   Each flag now carries its own stamp (checkedAt / removedAt / atHomeAt) instead of
   sharing one `changedAt`. Sharing a single stamp meant that one shopper marking an
   item "at home" also overwrote the other shopper's tick on that item, because all
   three flags were copied across as a block.
   `tickBias` makes ticks additive inside the clock-skew window: two phones are rarely
   perfectly in sync, and losing a tick is far more damaging than briefly keeping one. */
function mergeFlag(aVal, aAt, bVal, bAt, fallback, tickBias){
  const at = tsOf(aAt), bt = tsOf(bAt);
  if(at && bt){
    if(tickBias && Math.abs(at - bt) <= TICK_TIE_WINDOW_MS && (aVal || bVal)){
      return { val: true, at: at >= bt ? aAt : bAt };
    }
    return at >= bt ? { val: !!aVal, at: aAt } : { val: !!bVal, at: bAt };
  }
  // Only one side stamped: it wins, unless that would drop a tick the other side holds.
  if(at) return (tickBias && bVal && !aVal) ? { val: true, at: aAt } : { val: !!aVal, at: aAt };
  if(bt) return (tickBias && aVal && !bVal) ? { val: true, at: bAt } : { val: !!bVal, at: bAt };
  return { val: fallback(!!aVal, !!bVal), at: null };
}

// Back-compat: a pre-v21 line has one `changedAt` covering all three flags.
function flagStamp(line, field){
  if(line[field + 'At']) return line[field + 'At'];
  return line[field] ? (line.changedAt || null) : null;
}

function mergeShoppingLine(x, y){
  // Composition (name, aisle, quantities, sources) comes from the more recently
  // touched copy; only the three shopper flags are resolved field by field.
  const xNewer = tsOf(x.changedAt) >= tsOf(y.changedAt);
  const out = Object.assign({}, xNewer ? y : x, xNewer ? x : y);
  const c = mergeFlag(x.checked, flagStamp(x,'checked'), y.checked, flagStamp(y,'checked'),
                      (p,q)=> p || q, true);
  const r = mergeFlag(x.removed, flagStamp(x,'removed'), y.removed, flagStamp(y,'removed'),
                      (p,q)=> p || q, false);
  // atHome resolves the other way: if EITHER side says "we need it", it stays on the
  // active list — never silently hide something someone opted to buy.
  const h = mergeFlag(x.atHome, flagStamp(x,'atHome'), y.atHome, flagStamp(y,'atHome'),
                      (p,q)=> p && q, false);
  out.checked = c.val; if(c.at) out.checkedAt = c.at; else delete out.checkedAt;
  out.removed = r.val; if(r.at) out.removedAt = r.at; else delete out.removedAt;
  out.atHome  = h.val; if(h.at) out.atHomeAt  = h.at; else delete out.atHomeAt;
  out.changedAt = [c.at, r.at, h.at, x.changedAt, y.changedAt]
    .reduce((best, v)=> tsOf(v) > tsOf(best) ? v : best, null);
  return out;
}

/* v21 merge. Pure — it builds a new object rather than mutating either input, so a
   caller can never be left holding a half-merged copy.
   Composition rule: when both sides are working on the SAME trip, the line set is the
   UNION of both. The old version iterated the "newer" file's lines only, which meant a
   line the other shopper had added (a manual extra, say) was silently dropped if your
   save happened to land second. Across different trips the newer trip wins outright —
   its list is the real one, and last trip's ticks must not leak into it. */
/* ================= the one rule for authored collections =================

   v23.0. Nine releases had attacked sync, each adding a rule rather than changing the
   model, and the app ended up with a different answer for every kind of edit: shopping
   lines were unioned, the week's picks were taken wholesale from whichever file was
   newer, and the Wait List followed the newer file's membership. Two of those three
   silently threw away things people had added, and nobody could predict which applied to
   what they had just tapped.

   The rule now, once, for every collection a person AUTHORS:

     union by id; each field resolved by its own stamp; an item on only one side is KEPT
     unless the other side demonstrably saw it and no longer has it.

   "Demonstrably saw it" is the part that was impossible before seenRemoteAt was
   persisted. An item added at T is one the other device can only have deleted if that
   device had read the shared copy past T. Without that fact, "you added it while I was
   away" and "I deleted it while you were away" are the same picture, which is what every
   previous tiebreaker was guessing at.

   Shopping list LINES deliberately do not come through here. They are derived — regenerated
   from the picks, the staples and the Wait List — and the authored part of a line is its
   flags, which mergeShoppingLine already resolves by per-flag stamp. That is the one piece
   of the merge nobody has ever lost work to, and it is the same rule specialised, not an
   exception to it. */

const MERGE_GRACE_MS = 90*1000;   // covers the 600ms write debounce and modest clock skew

/* Pure. Did `theirHorizon` prove that side had read past this item's creation? Only then
   can its absence be read as a deletion. No horizon, or a horizon inside the grace window,
   is treated as "not seen yet", so the item survives. Erring toward keeping is deliberate:
   a Wait List entry that comes back is a nuisance, one that vanishes means nobody buys the
   shampoo.

   `fileAt` is the lastUpdated of the file the item came in, and it is what makes items
   written by builds older than v23.0 tractable. They carry no addedAt, and with no
   creation time at all they could never be shown to have been seen — so they would be
   immortal, and clearing the week would silently stop working against any phone still on
   an older build. A file written at T proves everything in it existed by T at the latest,
   which is exactly the bound needed and never invents a time earlier than the truth. */
function effectiveAddedAt(item, fileAt){
  return tsOf(item && item.addedAt) || tsOf(fileAt);
}

function otherSideDropped(item, fileAt, theirHorizon, graceMs){
  const added = effectiveAddedAt(item, fileAt);
  const seen = tsOf(theirHorizon);
  if(!added || !seen) return false;
  return added < (seen - (graceMs === undefined ? MERGE_GRACE_MS : graceMs));
}

/* Pure. Resolve one item that both sides hold, field by field, each on its own stamp. */
function resolveAuthoredItem(x, y, fields){
  // Deterministic base: the side that was edited more recently supplies any key the field
  // rules do not name, so merge(a,b) and merge(b,a) agree.
  const stampOf = it => fields.reduce((best,f)=> Math.max(best, tsOf(it[f.stamp])), 0);
  const primary = stampOf(y) > stampOf(x) ? y : x;
  const other   = primary === x ? y : x;
  const m = Object.assign({}, other, primary);

  fields.forEach(f=>{
    const xs = tsOf(x[f.stamp]), ys = tsOf(y[f.stamp]);
    if(ys > xs){ m[f.name] = y[f.name]; m[f.stamp] = y[f.stamp]; }
    else if(xs > ys){ m[f.name] = x[f.name]; m[f.stamp] = x[f.stamp]; }
    else if(f.whenUnstamped) m[f.name] = f.whenUnstamped(x[f.name], y[f.name]);
  });

  // Creation is the earlier of the two: an item exists from when it was first made.
  const ax = tsOf(x.addedAt), ay = tsOf(y.addedAt);
  if(ax && ay) m.addedAt = ax <= ay ? x.addedAt : y.addedAt;
  else m.addedAt = x.addedAt || y.addedAt || m.addedAt;
  return m;
}

/* ---- v23.2: a deletion is recorded, not inferred ----

   v23.0 decided deletions by inference — an item on only one side was dropped only if its
   addedAt was comfortably older than this device's horizon. That was wrong twice over.

   Items written before v23.0 carry no addedAt, so effectiveAddedAt fell back to the file's
   lastUpdated — which saveShoppingLocal bumps on EVERY save. A pick made a week ago, in a
   file saved ten seconds ago, presented as ten seconds old and could never be shown to
   have been seen. It was permanently undeletable, and waiting did not help: the reported
   bug, where a week nobody had touched would not clear.

   And any removal within roughly 110 seconds of the addition failed the same test, on
   every deletion path, because the horizon trails the poll and the grace window is 90s.

   A removal now leaves a record. The merge honours it because it can see one, rather than
   guessing from timestamps — which also keeps the "keep when in doubt" bias, since an item
   is only ever dropped on positive evidence.

   Tombstones were declined in v21.x on three grounds: file shape, a purge window, and code
   in the delicate function. All three are cheaper now — the map is an additive sibling
   field that older builds ignore, mergeAuthored is a single chokepoint rather than three
   ad-hoc rules, and a pruned tombstone degrades to exactly the old behaviour, so pruning
   cannot regress anything. */

const TOMBSTONE_MAX_AGE_MS = 60*24*60*60*1000;   // a device offline longer is past helping
const TOMBSTONE_MAX = 500;

// Pure. The moment an item was last authored. Legacy items have neither stamp and so read
// as 0, which is the point: any recorded removal outranks them.
function lastAuthoredAt(item){
  return tsOf(item && item.changedAt) || tsOf(item && item.addedAt) || 0;
}

// Pure. Stamp a removal against each id, keeping any later stamp already there.
function noteRemoved(map, ids, now){
  const out = Object.assign({}, map || {});
  (ids || []).forEach(id=>{
    if(id == null) return;
    if(tsOf(now) >= tsOf(out[id])) out[id] = now;
  });
  return out;
}

// Pure. Union of two tombstone maps, later stamp winning, then pruned.
function mergeTombstones(a, b, now){
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(id=>{
    if(tsOf(b[id]) > tsOf(out[id])) out[id] = b[id];
  });
  return pruneTombstones(out, now);
}

/* Pure. Drop what is too old to matter and cap the rest, newest kept. A tombstone that has
   been pruned simply stops being evidence, which returns that item to the pre-v23.2
   behaviour rather than doing anything worse. */
function pruneTombstones(map, now){
  const at = tsOf(now) || Date.now();
  const ids = Object.keys(map || {})
    .filter(id => (at - tsOf(map[id])) < TOMBSTONE_MAX_AGE_MS)
    .sort((p,q)=> tsOf(map[q]) - tsOf(map[p]))
    .slice(0, TOMBSTONE_MAX);
  const out = {};
  ids.sort().forEach(id=>{ out[id] = map[id]; });   // sorted keys so the merge is stable
  return out;
}

function mergeAuthored(mine, theirs, opts){
  const o = opts || {};
  const idOf = o.id || (x=> x && x.id);
  const fields = o.fields || [];
  const byId = list => { const m = {}; (list||[]).forEach(x=>{ const k = idOf(x); if(k != null) m[k] = x; }); return m; };
  const A = byId(mine), B = byId(theirs);
  // Both sides' records of what has been removed, seen as one.
  const tombs = mergeTombstones(o.myRemoved, o.theirRemoved, o.now);

  const out = [];
  const seen = {};
  (mine||[]).concat(theirs||[]).forEach(item=>{
    const k = idOf(item);
    if(k == null || seen[k]) return;
    seen[k] = true;
    const x = A[k], y = B[k];
    const merged = (x && y) ? resolveAuthoredItem(x, y, fields) : Object.assign({}, x || y);

    /* A record of removal beats everything else, unless the item has been authored again
       since — otherwise a recipe could never be picked a second time. This is checked
       before the inference below, and it does not consult addedAt, which is why it works
       for items written by builds that never stamped one. */
    if(tsOf(tombs[k]) > lastAuthoredAt(merged)) return;

    if(x && y) out.push(merged);
    // No record either way: fall back to inferring from the horizons, which is all a copy
    // from a build older than v23.2 can offer.
    else if(x){ if(!otherSideDropped(x, o.myFileAt,    o.theirHorizon, o.graceMs)) out.push(merged); }
    else       { if(!otherSideDropped(y, o.theirFileAt, o.myHorizon,    o.graceMs)) out.push(merged); }
  });

  // Stable, order-independent: oldest first, ties broken by id.
  return out.sort((p,q)=> (tsOf(p.addedAt) - tsOf(q.addedAt))
                       || String(idOf(p)).localeCompare(String(idOf(q))));
}

// Both authored collections travel in the same file, so they share its horizons.
function authoredHorizons(a, b){
  return { myHorizon: a && a.seenRemoteAt, theirHorizon: b && b.seenRemoteAt,
           myFileAt:  a && a.lastUpdated,  theirFileAt:  b && b.lastUpdated };
}

// The two authored collections, described once so the call sites cannot drift apart.
const SELECTION_FIELDS = [
  { name:'cooked',   stamp:'cookedChangedAt', whenUnstamped:(a,b)=> !!(a || b) },
  { name:'servings', stamp:'changedAt' }
];
const WAITLIST_FIELDS = [
  { name:'done', stamp:'changedAt', whenUnstamped:(a,b)=> !!(a || b) },
  /* v23.5. `done` alone cannot say whether somebody bought the thing or merely decided
     they did not need it, and the two have different lifetimes — see doneCountsHere. The
     trip a tick belonged to has to travel with the tick, or the receiving phone is back to
     guessing. Resolved on the same stamp as `done` so the pair can never be separated.
     Undefined rather than null when neither side has one, so an entry authored before
     v23.5 does not gain a key it never had. (No semicolons in here: test/run-tests.js
     extracts this constant by reading up to the first one.) */
  { name:'doneTripId', stamp:'changedAt', whenUnstamped:(a,b)=> a || b || undefined },
  { name:'text', stamp:'changedAt' }
];

/* Pure. Give every authored item a fixed creation stamp, once.

   v23.2. Items written before v23.0 carry no addedAt, and effectiveAddedAt fell back to
   the file's lastUpdated — which saveShoppingLocal bumps on EVERY save. So a pick made a
   week ago, in a file saved ten seconds ago, presented to the merge as ten seconds old,
   and no amount of waiting would ever make it deletable. Stamping it once with the file's
   lastUpdated turns that moving upper bound into a fixed one: still an upper bound, still
   never earlier than the truth, but it stops sliding forward every time anything is saved.

   The tombstones make this unnecessary for anything actually removed through the app; this
   is here so the pre-v23 data is sane on every other path too. */
function backfillAuthoredStamps(sd){
  if(!sd) return sd;
  const at = sd.lastUpdated || null;
  if(!at) return sd;
  ((sd.weekPlan && sd.weekPlan.selections) || []).forEach(s=>{ if(s && !s.addedAt) s.addedAt = at; });
  (sd.neededList || []).forEach(n=>{ if(n && !n.addedAt) n.addedAt = at; });
  return sd;
}

function mergeShoppingData(a, b){
  if(!a) return b;
  if(!b) return a;

  const aTrip = tripIdOf(a), bTrip = tripIdOf(b);
  const sameTrip = !!aTrip && aTrip === bTrip;
  const aGen = tsOf(a.weekPlan && a.weekPlan.generatedAt);
  const bGen = tsOf(b.weekPlan && b.weekPlan.generatedAt);
  // Newer file by wall clock, used for everything that isn't resolved item by item.
  const primary = tsOf(a.lastUpdated) >= tsOf(b.lastUpdated) ? a : b;
  const secondary = primary === a ? b : a;

  const out = Object.assign({}, secondary, primary);
  out.weekPlan = Object.assign({}, secondary.weekPlan, primary.weekPlan);
  /* seenRemoteAt is per-DEVICE state, not a field the newer file wins. Object.assign would
     otherwise hand back whichever side is `primary` — normally the remote copy, since that
     is usually why a merge is happening — and that value is the OTHER device's record of
     how far IT had read, which is always behind what this device has just read. The
     horizon would then silently regress on the most common path in the app, and this
     device would go on to under-claim what it had seen, so its deletions would not be
     honoured by anyone else. `a` is the local side at the only call site; the value is
     owned by mergeRemoteShopping, which sets it again after this returns. */
  out.seenRemoteAt = (a && a.seenRemoteAt) || null;

  if(!sameTrip){
    // Different trips: one of them is authoritative, wholesale. Which one is no
    // longer a matter of whose clock ran fastest — see chooseTripWinner.
    const winner = chooseTripWinner(a, b, aGen, bGen, primary);
    out.shoppingList = (winner.shoppingList || []).map(l=> Object.assign({}, l));
    out.weekPlan = Object.assign({}, winner.weekPlan);
  } else {
    const byKey = new Map();
    const order = [];
    const take = l=>{
      const k = lineMergeKey(l);
      if(byKey.has(k)) byKey.set(k, mergeShoppingLine(byKey.get(k), l));
      else { byKey.set(k, Object.assign({}, l)); order.push(k); }
    };
    (primary.shoppingList || []).forEach(take);
    (secondary.shoppingList || []).forEach(take);
    out.shoppingList = order.map(k=> byKey.get(k));

    /* "Shopping is done" empties the list on purpose. Under a union that would be
       undone the moment the other phone — still holding a full list — synced, so a
       finish recorded on either device ends the trip for both. */
    const doneAt = [a.weekPlan && a.weekPlan.shoppingDoneAt, b.weekPlan && b.weekPlan.shoppingDoneAt]
      .reduce((best, v)=> tsOf(v) > tsOf(best) ? v : best, null);
    if(doneAt){
      out.weekPlan = Object.assign({}, out.weekPlan, { shoppingDoneAt: doneAt });
      out.shoppingList = [];
    }
    out.weekPlan.tripId = aTrip;
  }

  /* The week's picks and the Wait List go through the same rule, and deliberately do NOT
     follow the trip winner. Which shopping LIST won says nothing about whose recipes are
     right: coupling them is how a superseding clear could delete picks made on a phone
     that had not caught up. chooseTripWinner governs shoppingList, which is what it was
     always for. */
  const horizons = authoredHorizons(a, b);
  const now = [a.lastUpdated, b.lastUpdated].reduce((best,v)=> tsOf(v) > tsOf(best) ? v : best, null);

  /* The records of what has been removed are merged in their own right and travel with the
     result — a removal that only survived one merge would work exactly once. */
  const selRemoved = mergeTombstones(a.weekPlan && a.weekPlan.selectionsRemoved,
                                     b.weekPlan && b.weekPlan.selectionsRemoved, now);
  const needRemoved = mergeTombstones(a.neededRemoved, b.neededRemoved, now);

  out.weekPlan.selections = mergeAuthored(
    (a.weekPlan && a.weekPlan.selections) || [],
    (b.weekPlan && b.weekPlan.selections) || [],
    Object.assign({ id: s=> s && s.recipeId, fields: SELECTION_FIELDS, now: now,
                    myRemoved: a.weekPlan && a.weekPlan.selectionsRemoved,
                    theirRemoved: b.weekPlan && b.weekPlan.selectionsRemoved }, horizons));
  /* Only carry the map when there is something in it. An empty one still counts as a
     difference to applyMergedShopping's stringify-compare, which would make every identical
     sync look like a change — swapping the object graph and repainting over whoever is
     typing, which is the v21.0/v21.5 bug. */
  if(Object.keys(selRemoved).length) out.weekPlan.selectionsRemoved = selRemoved;
  else delete out.weekPlan.selectionsRemoved;

  out.neededList = mergeAuthored(a.neededList || [], b.neededList || [],
    Object.assign({ id: n=> n && n.id, fields: WAITLIST_FIELDS, now: now,
                    myRemoved: a.neededRemoved, theirRemoved: b.neededRemoved }, horizons));
  if(Object.keys(needRemoved).length) out.neededRemoved = needRemoved;
  else delete out.neededRemoved;

  return out;
}

/* ---- v21: one way in and out of shoppingData ----
   Every rendered shopping row closes over its line object. A merge can hand back a
   different object graph (it always does now that the merge is pure), so swapping
   shoppingData without repainting left every checkbox on screen wired to an orphaned
   line: the tick appeared to register, the row struck through, and then persist()
   serialised the NEW state where the tick had never happened. That is what made ticks
   "come back" only after a refresh. State swaps and repaints now happen together. */
/* ---- v21.5: no background repaint may interrupt what someone is doing ----
   render() tears the tab down and rebuilds it, so a field being typed into is destroyed
   and comes back empty. The OneDrive load that runs on every open finished with an
   unconditional render(), landing a few seconds in — right when you have opened the app,
   tapped a box and started typing. The 20s poll had guarded against exactly this since
   v20; the startup path never did.
   Everything that repaints in the background now goes through here. A repaint that
   would be rude is remembered, not dropped, and runs as soon as the moment passes. */
let deferredRepaint = false;

function safeToRepaint(){
  if(document.getElementById('modalRoot').innerHTML !== '') return false;
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return false;
  // Safari captures the page well after window.print() returns; repainting inside that
  // window redraws the page out from under the printer.
  if(isPrinting()) return false;
  return true;
}

// Repaint now if it is not disruptive, otherwise owe one. Returns whether it happened.
function repaintWhenSafe(){
  if(!safeToRepaint()){ deferredRepaint = true; return false; }
  deferredRepaint = false;
  rerenderPreservingScroll();
  return true;
}

function flushDeferredRepaint(){
  if(!deferredRepaint || !safeToRepaint()) return;
  deferredRepaint = false;
  rerenderPreservingScroll();
}

/* Leaving a field is the moment a held-back repaint becomes safe. focusout fires before
   focus lands anywhere else, so let it settle first — otherwise moving between two boxes
   looks momentarily like "nothing is focused" and repaints mid-edit after all. */
document.addEventListener('focusout', ()=> setTimeout(flushDeferredRepaint, 0));

/* Every remote copy of the shopping file comes in through here, so that "how caught-up
   is this device" is recorded in exactly one place rather than at each merge site. */
/* ---- v23.0: say what a sync actually did ----

   The point of one merge rule is that the outcome is predictable; the point of saying it
   out loud is that nobody has to take that on trust. A phone that has been out of contact
   and comes back now reports what changed, rather than silently rearranging the week while
   somebody is looking at it. Pure, so the sentences are testable without a browser. */
function describeMerge(before, after){
  const idsOf = (list, f) => { const s = {}; (list||[]).forEach(x=>{ const k=f(x); if(k!=null) s[k]=true; }); return s; };
  const sel = d => (d && d.weekPlan && d.weekPlan.selections) || [];
  const ticks = d => ((d && d.shoppingList) || []).filter(l=> l.checked && !l.removed).length;
  const count = (from, to) => Object.keys(to).filter(k=> !from[k]).length;

  const bSel = idsOf(sel(before), s=> s && s.recipeId), aSel = idsOf(sel(after), s=> s && s.recipeId);
  const bNeed = idsOf(before && before.neededList, n=> n && n.id);
  const aNeed = idsOf(after && after.neededList, n=> n && n.id);

  const d = {
    picksArrived: count(bSel, aSel),   picksRemoved: count(aSel, bSel),
    waitArrived:  count(bNeed, aNeed), waitRemoved:  count(aNeed, bNeed),
    ticksArrived: Math.max(0, ticks(after) - ticks(before))
  };
  /* v23.5. Two phones that each generated a list from the same picks hold two lists that
     look identical and are two different trips, and nothing on screen ever showed the
     difference. chooseTripWinner then discards one of them wholesale on every poll, which
     is a person's walk round a shop going quietly missing. It is the one merge outcome
     worth interrupting somebody for, so it gets its own sentence rather than being folded
     into the tally below. */
  const bTrip = tripIdOf(before), aTrip = tripIdOf(after);
  d.tripReplaced = !!(bTrip && aTrip && bTrip !== aTrip);
  d.ticksLost = d.tripReplaced ? Math.max(0, ticks(before) - ticks(after)) : 0;
  d.changed = !!(d.picksArrived || d.picksRemoved || d.waitArrived || d.waitRemoved
                 || d.ticksArrived || d.tripReplaced);
  return d;
}

// Pure. One plain sentence, or null when nothing happened worth interrupting anyone for.
function mergeReport(d){
  if(!d || !d.changed) return null;
  const n = (count, one, many) => count + ' ' + (count === 1 ? one : (many || one + 's'));
  // A replaced list is not "catching up" and must not read like it. Say what happened to
  // the ticks, and point at the undo that already exists.
  if(d.tripReplaced){
    return 'Another phone\u2019s shopping list replaced the one on this device'
      + (d.ticksLost ? ' \u2014 ' + n(d.ticksLost, 'item') + ' ticked off here '
                       + (d.ticksLost === 1 ? 'is' : 'are') + ' not on it' : '')
      + '. Use \u201cPut back the list that was replaced\u201d if that was wrong.';
  }
  const bits = [];
  if(d.picksArrived) bits.push(n(d.picksArrived, 'recipe') + ' added to the week');
  if(d.picksRemoved) bits.push(n(d.picksRemoved, 'recipe') + ' taken off the week');
  if(d.waitArrived)  bits.push(n(d.waitArrived, 'Wait List item') + ' added');
  if(d.waitRemoved)  bits.push(n(d.waitRemoved, 'Wait List item') + ' cleared');
  if(d.ticksArrived) bits.push(n(d.ticksArrived, 'item') + ' ticked off');
  return 'Caught up with the family list — ' + bits.join(', ') + '.';
}

function mergeRemoteShopping(remote, modifiedAt){
  /* Reading a copy written at T proves this device has now seen the shared state up to T.
     Work the new horizon out first, merge without touching the inputs, then stamp it onto
     the result — rather than mutating shoppingData on the way into an otherwise pure
     merge, which is what let the value be overwritten by the other side's. */
  const advanced = (remote && remote.lastUpdated && tsOf(remote.lastUpdated) > tsOf(shoppingSeenRemoteAt))
    ? remote.lastUpdated : shoppingSeenRemoteAt;
  // Stamp the incoming copy's legacy items against ITS lastUpdated, not ours — the bound
  // has to come from the file the item actually arrived in.
  backfillAuthoredStamps(remote);
  /* v23.6: before merging, while both copies still exist, work out whether this is a
     disagreement and keep whichever list is about to be thrown away. applyMergedShopping
     already stashes when THIS device's trip is the one being replaced; when it WINS, the
     copy about to be discarded is the remote one and until now nothing kept it, so the
     winning phone had nothing to offer and nothing to say. Gated on the loser actually
     having work on it: a fork where neither side has done anything self-heals in silence
     and is not worth interrupting a shop for. */
  const conflict = tripConflict(shoppingData, remote);
  if(conflict && tripHasProgress(conflict.loser)){
    tripDisagreement = { iWon: conflict.iWon, at: new Date().toISOString() };
    if(conflict.iWon) stashReplacedTrip(remote);
  } else if(!conflict){
    tripDisagreement = null;
  }
  const merged = mergeShoppingData(shoppingData, remote);
  shoppingSeenRemoteAt = advanced;
  if(merged) merged.seenRemoteAt = advanced || null;
  const what = describeMerge(shoppingData, merged);
  const applied = applyMergedShopping(merged);
  /* v23.7: this copy is now merged, so the folder's mtime for it is what this phone is
     caught up to. One chokepoint rather than three call sites, for the same reason
     seenRemoteAt is owned here. */
  if(modifiedAt) noteRemoteShoppingStamp(modifiedAt, modifiedAt);
  // Only speak when the merge actually moved something, and only after it landed.
  if(applied){ const line = mergeReport(what); if(line) setStatus(line, 'ok'); }
  return applied;
}

/* v21.8: the list someone was shopping from, kept aside when something replaced it.
   A trip being superseded is a destructive act — it discards ticks that a person
   walked round a shop to make — and this app's rule is that destructive acts are
   recoverable rather than merely confirmed. In-session only, like the bulk-delete
   undo: it covers the minutes in which anyone would notice, and it costs nothing in
   the synced file. */
let replacedTrip = null;

/* v23.6: set while this device knows of two live trips, cleared the moment they agree, so
   the banner cannot outlive the problem it is reporting. In-session only, like the stash
   it travels with — a fork that nobody is losing work to is not worth a word, and one
   that is gets settled in the minutes anybody would notice. */
let tripDisagreement = null;

function stashReplacedTrip(sd){
  if(!tripHasProgress(sd)) return;
  replacedTrip = {
    weekPlan: JSON.parse(JSON.stringify(sd.weekPlan)),
    shoppingList: JSON.parse(JSON.stringify(sd.shoppingList || [])),
    tripId: tripIdOf(sd),
    ticks: tripProgress(sd).ticks,
    // v23.3: a list can now be stashed with nothing ticked — an evening's pruning is
    // work too — so the card has to be able to say what was actually on it.
    decisions: tripDecisions(sd).decisions,
    at: new Date().toISOString()
  };
}

/* Returns whether anything actually changed. Callers use that to decide whether the
   change is worth telling the user about. */
function applyMergedShopping(merged){
  // Identical content: keep the object already in hand. Swapping in an equivalent copy
  // would detach every rendered row's event handler for no gain — the v21.0 bug — and
  // repainting over it would be pure disruption.
  if(JSON.stringify(merged) === JSON.stringify(shoppingData)) return false;
  // Adopting a different trip from another device: keep what we were holding if
  // anyone had shopped from it, so it can be put back with one tap.
  const wasTrip = tripIdOf(shoppingData), nowTrip = tripIdOf(merged);
  if(wasTrip && nowTrip && wasTrip !== nowTrip) stashReplacedTrip(shoppingData);
  shoppingData = merged;
  try{ localStorage.setItem(LS_SHOPPING, JSON.stringify(shoppingData)); }
  catch(e){ storageBlockedReason = 'Could not save locally (' + ((e && e.message) || e) + ').'; }
  // 'start' shows the week's recipe picks, which live in shoppingData too.
  if(currentTab === 'review' || currentTab === 'needed'
     || currentTab === 'menu' || currentTab === 'start') repaintWhenSafe();
  return true;
}

// Look a line up by its merge key at the moment of the tap, rather than trusting the
// object the row was drawn from — see applyMergedShopping.
function findShoppingLine(key){
  return (shoppingData.shoppingList || []).find(l=> lineMergeKey(l) === key) || null;
}

/* Stamp one flag with its own timestamp. `changedAt` is still written so that a device
   left on v20 keeps resolving these lines exactly as it did before. */
function stampLine(line, field){
  const now = new Date().toISOString();
  line[field + 'At'] = now;
  line.changedAt = now;
  line.changedBy = deviceId();
}

// Fetch the remote shopping file's content AND its ETag (via item metadata, since the
// content endpoint's redirect loses reliable access to the item's ETag header).
async function fetchRemoteShopping(token){
  if(!oneDriveFolderRef) return null;
  const { driveId, itemId } = oneDriveFolderRef;
  const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + ':/shopping-list.json', token);
  if(res.status !== 200) return null; // 404 = not created yet
  const meta = await res.json();
  let data = null;
  try{
    const dl = meta['@microsoft.graph.downloadUrl'];
    if(dl){ const r = await fetch(dl); if(r.ok) data = await r.json(); }
  }catch(e){ console.warn('shopping download failed', e); }
  return { etag: meta.eTag, modified: meta.lastModifiedDateTime, data };
}

// Merge-then-write with optimistic concurrency. On HTTP 412 (someone else wrote
// between our read and our write) refetch, re-merge, retry.
async function writeShoppingMerged(token){
  const { driveId, itemId } = oneDriveFolderRef;
  // v21.2: five attempts, and no unguarded fallback write at the end. This used to
  // give up after three conflicts and PUT without an If-Match, which silently threw
  // away whatever the other shopper had just saved — the one place the sync was
  // otherwise careful. Every attempt re-merges the remote copy first, so retrying is
  // always safe; exhausting them is reported as pending instead of resolved.
  for(let attempt = 0; attempt < 5; attempt++){
    const remote = await fetchRemoteShopping(token);
    if(remote && remote.data){
      // Must go through applyMergedShopping: this runs on every tick, and when the
      // other shopper has saved in the meantime the merge returns a fresh object.
      mergeRemoteShopping(remote.data, remote.modified);
    }
    const headers = { 'Content-Type': 'application/json' };
    if(remote && remote.etag) headers['If-Match'] = remote.etag;
    const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + ':/shopping-list.json:/content', token, {
      method: 'PUT', headers, body: JSON.stringify(shoppingData)
    });
    if(res.status === 200 || res.status === 201){
      if(remote) oneDriveLastModified['shopping-list.json'] = null; // force next poll to restamp
      // Adopt our own write's timestamp so the fast poll doesn't immediately download
      // and re-merge the file we just sent — that echo was one more chance to swap the
      // state object out from under a list somebody is actively ticking.
      try{
        const wrote = await res.json();
        if(wrote && wrote.lastModifiedDateTime) shoppingFastPollStamp = wrote.lastModifiedDateTime;
      }catch(e){ /* body already consumed or not JSON — harmless */ }
      return true;
    }
    if(res.status !== 412){
      console.warn('shopping write failed', res.status);
      lastWriteError = { status: res.status, name: 'shopping-list.json' };
      return false;
    }
    // 412 → loop: someone saved between our fetch and our write; merge their copy in and retry
  }
  console.warn('shopping write conflicted 5 times; leaving it pending rather than overwriting');
  lastWriteError = { status: 412, name: 'shopping-list.json' };
  return false;
}

// Near-live tick sharing: while the Review Shopping List tab is open, check just the
// shopping file every 5 seconds and merge in any remote ticks. Cheap (one metadata
// call; content only fetched when the file actually changed).
const SHOPPING_FAST_POLL_MS = 5000;
let shoppingFastPollTimer = null;
let shoppingFastPollStamp = null;

async function pollShoppingNow(force){
  if(currentTab !== 'review') return;
  if(document.hidden) return;
  if(document.getElementById('modalRoot').innerHTML !== '') return;
  if(!msalAccount || !oneDriveFolderRef || localStorage.getItem(LS_ONEDRIVE_FLAG) !== '1') return;
  // A poll can be triggered by the timer, by waking the screen, or by the 20s folder
  // poll; overlapping runs would merge the same remote copy twice and repaint mid-tap.
  if(syncInFlight) return;
  syncInFlight = true;
  try{
    const token = await getGraphToken();
    if(!token) return;
    const { driveId, itemId } = oneDriveFolderRef;
    const res = await graphFetch('/drives/' + driveId + '/items/' + itemId + ':/shopping-list.json?$select=lastModifiedDateTime', token);
    if(res.status !== 200){ noteRemoteCheckFailed(); return; }
    const meta = await res.json();
    /* v23.7: record what the folder says BEFORE the unchanged-stamp return. A poll that
       finds nothing new is exactly the poll that proves this phone is in step, and
       returning first threw that fact away. */
    noteRemoteShoppingStamp(meta.lastModifiedDateTime, null);
    if(!force && shoppingFastPollStamp === meta.lastModifiedDateTime){ updateListFreshness(); return; }
    shoppingFastPollStamp = meta.lastModifiedDateTime;
    const remote = await fetchRemoteShopping(token);
    if(remote && remote.data){
      // applyMergedShopping does the comparison and reports whether anything moved.
      if(mergeRemoteShopping(remote.data, remote.modified)){
        setStatus('Shopping list updated from the other shopper — ' + new Date().toLocaleTimeString(), 'ok');
      }
    }
  }catch(e){ noteRemoteCheckFailed(); console.warn('fast poll failed', e); }
  finally{ syncInFlight = false; }
}

function startShoppingFastPoll(){
  stopShoppingFastPoll();
  shoppingFastPollTimer = setInterval(pollShoppingNow, SHOPPING_FAST_POLL_MS);
}
function stopShoppingFastPoll(){
  if(shoppingFastPollTimer){ clearInterval(shoppingFastPollTimer); shoppingFastPollTimer = null; }
}

/* Phones blank the screen constantly in a shop, and a hidden tab skips its polls.
   Waking up should show the other shopper's ticks immediately rather than after
   another full interval. */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) pollShoppingNow();
});

/* ================= trip history: what the app remembers =================

   Until v22.0 The Fridge List had no memory beyond the current week. "Shopping is done"
   set shoppingList = [], and with it went every checkedAt (the order the shop is actually
   walked), every atHome decision (the real pantry), and every record of what the week's
   picks turned into. That is the paper menu sheet inherited literally: a sheet is
   something you throw away.

   trip-history.json is a third file beside recipes-data.json and shopping-list.json,
   appended to once per shop and never rewritten. Design notes worth keeping:

   - A trip is a CLOSED record, written once by the device that finished it. So the merge
     is a union keyed by tripId and cannot conflict — mergeShoppingData, the most delicate
     function in the app, is not touched by any of this.
   - It is never read at startup. The localStorage mirror is what every feature reads, so
     launch time is unchanged; the remote copy is folded in on sign-in, on "Sync now", and
     right after this device archives a trip of its own.
   - It is written once a week, never on a tick. Same reasoning as v21.2 and the 992 KB
     recipe file: nothing large goes up over supermarket mobile data.
   - It does not go through persist(). persist()'s `which` is 'recipes' | 'shopping' |
     both, and squeezing a third value into that test is exactly how a tick would start
     re-uploading something it should not. This file has its own writer.
   - A phone still on v21.9 neither reads nor writes it. A shop finished on an old build
     is a gap in the history, not a corruption of it. */

const LS_TRIPS = 'fma_trips_v1';
const TRIPS_FILE = 'trip-history.json';
const TRIP_HISTORY_MAX = 52;   // about a year of weekly shops
let tripHistory = null;        // null = not read from localStorage yet
let pendingSaveTrips = false;

function defaultTripHistory(){ return { version: 1, trips: [] }; }

/* Pure. Reduces a finished trip to what the memory features actually read. Deliberately
   lean — no sources, no textQtyParts, no per-line stamps beyond checkedAt — because this
   file is the one thing in the app that grows without bound and 52 fat trips would undo
   the point of not re-uploading the recipe file. */
function tripRecordFromShopping(sd, byDevice){
  if(!sd || !sd.weekPlan || !sd.weekPlan.tripId) return null;
  const wp = sd.weekPlan;
  return {
    tripId: wp.tripId,
    generatedAt: wp.generatedAt || null,
    doneAt: wp.shoppingDoneAt || new Date().toISOString(),
    doneBy: byDevice || '',
    selections: (wp.selections || []).map(s=>({
      recipeId: s.recipeId, servings: s.servings || null, cooked: !!s.cooked
    })),
    lines: (sd.shoppingList || []).map(l=>({
      name: l.ingredientName,
      aisle: l.aisle || '',
      category: l.shoppingCategory || '',
      qty: (l.hasNumeric && typeof l.totalQty === 'number') ? l.totalQty : null,
      unit: l.unit || '',
      source: l.source || 'recipe',
      checked: !!l.checked,
      checkedAt: l.checkedAt || null,
      atHome: !!l.atHome,
      // The stamp, not just the flag: pantryAtHome sets atHome from a category rule and
      // never stamps it, so its presence is what tells a deliberate "we have this" from
      // an automatic one. atHomeStreaks would be meaningless without the difference.
      atHomeAt: l.atHomeAt || null,
      removed: !!l.removed
    }))
  };
}

/* Pure. Union keyed by tripId, oldest first. Two files can only ever disagree about a
   trip if one of them saw a shorter version of it — the archiving device wrote it once
   and never came back — so the fuller record wins. Trips are never merged line by line:
   a closed record that later grows is a record nobody can trust. */
function mergeTripHistory(a, b){
  const byId = {};
  const take = h => ((h && Array.isArray(h.trips)) ? h.trips : []).forEach(t=>{
    if(!t || !t.tripId) return;
    const prev = byId[t.tripId];
    if(!prev || ((t.lines || []).length > (prev.lines || []).length)) byId[t.tripId] = t;
  });
  take(a); take(b);
  const trips = Object.keys(byId).map(k=>byId[k]).sort((x,y)=> tsOf(x.doneAt) - tsOf(y.doneAt));
  return pruneTripHistory({ version: 1, trips: trips }, TRIP_HISTORY_MAX);
}

// Pure. Keeps the newest `max` trips and nothing else.
function pruneTripHistory(h, max){
  const trips = (h && Array.isArray(h.trips)) ? h.trips.slice() : [];
  const keep = (max && max > 0) ? max : TRIP_HISTORY_MAX;
  return { version: 1, trips: trips.slice(Math.max(0, trips.length - keep)) };
}

function loadTripHistoryLocal(){
  if(tripHistory) return tripHistory;
  try{
    const raw = localStorage.getItem(LS_TRIPS);
    tripHistory = raw ? JSON.parse(raw) : defaultTripHistory();
  }catch(e){ tripHistory = defaultTripHistory(); }
  if(!tripHistory || !Array.isArray(tripHistory.trips)) tripHistory = defaultTripHistory();
  return tripHistory;
}

function saveTripHistoryLocal(){
  try{ localStorage.setItem(LS_TRIPS, JSON.stringify(tripHistory)); }
  catch(e){ console.warn('could not save trip history locally', e); }
}

// The newest `n` trips, oldest first. Every memory feature reads through this.
function recentTrips(n){
