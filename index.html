<script>
(function(){
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(!isIOS){
    var l = document.createElement('link');
    l.rel = 'manifest'; l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
  }

  /* v21.2 offline support. The app is used in a supermarket, where signal is often
     the worst it gets all week — before this, a bad connection meant the shopping
     list would not open at all, because every launch had to pull the whole page.
     sw.js is network-first for the page, so being cached can never hold a device
     back on an old build; see the comments there. Registration is deliberately
     best-effort: if it throws (file://, private mode, unsupported), the app carries
     on exactly as it did before. */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        // A worker sitting in "waiting" means a new build is downloaded but the old
        // one is still in charge. Tell it to take over, then reload once so the user
        // is running the new code rather than being silently a version behind.
        function promote(w){
          if(!w) return;
          w.postMessage('skip-waiting');
        }
        if(reg.waiting) promote(reg.waiting);
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state === 'installed' && navigator.serviceWorker.controller) promote(nw);
          });
        });
        // Check for a new build when the app is opened or brought back to the front.
        document.addEventListener('visibilitychange', function(){
          if(!document.hidden) reg.update().catch(function(){});
        });
      }).catch(function(e){ console.warn('Service worker registration failed', e); });

      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(reloading) return;
        reloading = true;
        // Guarded by the same rule as the other automatic reloads: never yank the page
        // out from under someone mid-shop or mid-edit. safeToReload() is defined in the
        // main script; if it hasn't loaded yet, the update simply lands on next launch.
        if(typeof window.__fridgeListSafeToReload === 'function'
           && !window.__fridgeListSafeToReload()){ return; }
        location.reload();
      });
    });
  }
})();
</script>

<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#2b2b2b; --muted:#767267; --accent:#5b7a4f;
  --accent-dark:#435c39; --border:#e2ddd2; --warn:#b3541e; --danger:#a23b3b;
  --chip:#eef1e9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);}
header{background:var(--accent-dark);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20;}
header .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
header h1{font-size:1.15rem;margin:0;font-weight:600;}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;}
nav button.active{background:#fff;color:var(--accent-dark);font-weight:600;}
main{max-width:960px;margin:0 auto;padding:16px;padding-bottom:80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.muted{color:var(--muted);font-size:.85rem;}
button{font-family:inherit;}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:#fff;color:var(--accent-dark);border:1px solid var(--accent);}
.btn.danger{background:var(--danger);}
.btn.small{padding:4px 9px;font-size:.78rem;border-radius:5px;}
input[type=text],input[type=number],input[type=search],select,textarea{
  font-family:inherit;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:#fff;color:var(--ink);
}
textarea{width:100%;resize:vertical;}
.tag{display:inline-block;background:var(--chip);color:var(--accent-dark);font-size:.72rem;padding:2px 8px;border-radius:20px;margin-right:4px;}
.section-title{font-size:1rem;font-weight:700;margin:0 0 10px;color:var(--accent-dark);}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.recipe-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:box-shadow .15s;}
.recipe-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.recipe-card h3{margin:0 0 4px;font-size:.98rem;}
.recipe-card img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;}
.badge{font-size:.68rem;padding:1px 7px;border-radius:20px;background:#efe6d8;color:var(--warn);}
.badge.linked{background:#e4efe0;color:var(--accent-dark);}
.badge.stale{background:#f3d9c4;color:#a05a2c;}
.ing-line{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--border);}
.ing-line:last-child{border-bottom:none;}
.aisle-group{margin-bottom:16px;}
.aisle-group h4{margin:0 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.checkbox-row input[type=checkbox]{width:18px;height:18px;}
.checkbox-row.removed label{text-decoration:line-through;color:var(--muted);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50;}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:20px;}
.modal h2{margin-top:0;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px;}
.field input,.field select,.field textarea{width:100%;}
.status-bar{font-size:.78rem;color:#d9d4c6;margin-top:4px;}
.status-bar.ok{color:#bfe3ae;}
.status-bar.warn{color:#f0c98a;}
footer.actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;}
.empty-state{text-align:center;color:var(--muted);padding:40px 10px;}
.needed-list li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);}
.needed-list li.done label{text-decoration:line-through;color:var(--muted);}
.print-only{display:none;}
.shop-title{font-size:1.3rem;font-weight:700;font-style:italic;margin:4px 0 10px;}
.shop-columns{column-count:1;column-gap:22px;}
.cat-block{break-inside:auto;margin-bottom:10px;}
.cat-header{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:.85rem;
  border-bottom:1.4px solid #333;padding-bottom:2px;margin-bottom:2px;break-after:avoid-column;break-inside:avoid;}
.cat-header .col-label{font-style:italic;font-weight:400;font-size:.68rem;color:var(--muted);}
.aisle-block{break-inside:avoid;margin-bottom:3px;}
.aisle-header{font-weight:700;font-size:.72rem;text-decoration:underline;margin-top:4px;margin-bottom:1px;}
.item-row{display:flex;font-size:.72rem;padding:1px 0;}
.item-name{flex:1;padding-right:6px;}
.item-qty{width:56px;text-align:right;padding-right:6px;white-space:nowrap;color:var(--muted);}
.item-count{width:22px;text-align:right;color:var(--muted);}
.shop-footer{font-size:.68rem;font-style:italic;margin-top:10px;color:var(--muted);}
.item-note{font-size:.64rem;color:var(--muted);padding-left:9px;margin-top:-1px;margin-bottom:2px;font-style:italic;}
.modal.wide{max-width:1080px;}
.recipe-view-cols{display:grid;grid-template-columns:minmax(230px,1fr) 1.7fr;gap:24px;align-items:start;}
.recipe-view-cols ol{margin:0;padding-left:20px;}
.recipe-view-cols li{margin-bottom:6px;}
@media(max-width:760px){.recipe-view-cols{grid-template-columns:1fr;}}
.import-cols{display:grid;grid-template-columns:1fr 2fr;gap:20px;align-items:start;}
@media(max-width:900px){.import-cols{grid-template-columns:1fr;}}
.import-table-row{display:grid;grid-template-columns:.85fr 1.35fr;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);align-items:start;}
.import-table-head{font-weight:700;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1.4px solid var(--border);padding:4px 0;}
.scraped-cell{font-size:.85rem;padding-top:7px;color:var(--ink);}
@media(max-width:640px){.import-table-row{grid-template-columns:1fr;gap:4px;}.scraped-cell{padding-top:0;font-style:italic;}}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px;}
.chip{background:var(--chip);color:var(--accent-dark);border:none;border-radius:20px;font-size:.72rem;padding:2px 9px;cursor:pointer;}
.chip:hover{background:#dfe6d6;}
.modal.xwide{max-width:1280px;}
@page{
  size: landscape;
  margin: 12mm;
}
@media print{
  /* column-fill:auto needs an explicit height, or browsers pour everything into
     column 1 and spill onto a needless extra page instead of using columns 2-4.
     A4 landscape (297x210mm) minus 12mm @page margins = 186mm usable height;
     165mm leaves room for the title above and the date footer below. */
  .shop-columns{column-count:4;column-fill:auto;height:165mm;}
  .item-name{font-style:italic;}
}
@media print{
  header,nav,footer.actions,.no-print{display:none !important;}
  body{background:#fff;}
  main{max-width:100%;padding:0;}
  .print-only{display:block;}
  .card{border:none;box-shadow:none;page-break-inside:avoid;}
  body.printing-shopping .print-menu-section{display:none !important;}
  body.printing-menu .print-shopping-section{display:none !important;}
}
.small-note{font-size:.78rem;color:var(--muted);margin-top:6px;}
.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.searchbar input[type=search]{flex:1;min-width:180px;}
.close-x{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);}
.modal{position:relative;}
.qty-input{width:70px;}
.unit-input{width:70px;}
.ingredient-section-row{display:flex;gap:6px;margin:12px 0 4px;align-items:center;}
.section-name-input{flex:1;font-weight:700;color:var(--accent-dark);}
.ing-section-head{font-weight:700;margin:10px 0 2px;font-size:.85rem;color:var(--accent-dark);}
.unit-select{width:84px;flex:0 0 auto;padding:7px 6px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:#fff;color:var(--ink);}
.ingredient-editor-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.ingredient-editor-row{flex-wrap:wrap;}
.ingredient-editor-row input{flex:1;}
.ing-name-input{flex:2 1 150px;min-width:120px;}
.desc-input{flex:1.4 1 150px;min-width:120px;}
.ing-descriptor{color:var(--muted);}
.locked-unit{background:#f0efe9;color:var(--muted);cursor:not-allowed;}

/* ===================== v20 additions ===================== */

/* --- persistent sync failure banner (v20) ---
   Read-only Graph calls keep succeeding when the drive is full or the share is
   read-only, so a transient "saved/updated" status line can paint straight over a
   write failure. This banner is sticky: only a SUCCESSFUL WRITE clears it. */
.sync-alert{position:sticky;top:0;z-index:19;margin:0;padding:11px 16px;font-size:.9rem;line-height:1.35;
  border-bottom:1px solid rgba(0,0,0,.12);}
.sync-alert[hidden]{display:none;}
.sync-alert.err{background:#7d2b2b;color:#fff;}
.sync-alert.pending{background:#f0c98a;color:#4a3208;}
.sync-alert strong{display:block;font-size:.95rem;margin-bottom:2px;}
.sync-alert .hint{opacity:.9;font-size:.82rem;}
.sync-alert .hint.last{display:block;margin-top:3px;opacity:1;font-weight:600;}
.sync-alert .alert-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
.sync-alert .alert-btn{font:inherit;font-size:.82rem;font-weight:600;padding:7px 13px;min-height:34px;
   border:none;border-radius:7px;cursor:pointer;background:#fff;color:#7d2b2b;}
.sync-alert .alert-btn.quiet{background:transparent;color:#fff;font-weight:500;border:1px solid rgba(255,255,255,.55);}
/* A card that is telling you something has happened, or is about to. */
.notice-card{border-left:4px solid var(--warn);}
/* v23.8: two weights on purpose. Amber says "there is an update available"; red says
   "what you are looking at is wrong". Red only ever appears for the two sync cases, so it
   stays rare enough to keep meaning something. */
.alert-card{border-left:4px solid var(--danger);}
.alert-card strong{color:var(--danger);}
/* Anything switched off has to LOOK switched off, or the app just seems broken —
   which is the whole complaint the frozen picks were meant to answer. */
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--border);
  color:var(--muted);border-color:var(--border);}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed;background:#f2f0ea;}

/* --- trolley screen (v20) ---
   Touch targets sized to the 44px/48dp platform minimum, and the item NAME is the
   primary target rather than an 18px checkbox. Destructive controls sit on the far
   side of the label so a mis-tap lands on text, not on delete. */
.shop-toolbar{position:sticky;top:0;z-index:12;padding:12px 14px;}
.shop-progress strong{font-size:1rem;}
.progress-track{height:8px;border-radius:6px;background:var(--chip);margin-top:7px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .2s;}
.shop-toggles{margin-top:10px;gap:18px;}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:.9rem;cursor:pointer;}
.toggle input[type=checkbox]{width:24px;height:24px;}

.shop-row{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);}
.shop-row:last-child{border-bottom:none;}
.shop-tap{display:flex;align-items:center;gap:12px;flex:1;min-height:52px;padding:8px 6px 8px 2px;
  cursor:pointer;-webkit-tap-highlight-color:rgba(91,122,79,.18);}
.shop-tap input[type=checkbox]{width:26px;height:26px;flex:0 0 auto;margin:0;}
.shop-name{font-size:.98rem;line-height:1.3;}
.shop-sources{display:block;font-size:.8rem;color:#5f5b52;margin-top:2px;}
.shop-row.ticked .shop-name{text-decoration:line-through;color:#5f5b52;}
.shop-acts{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-left:6px;}
.btn.tap{min-width:46px;min-height:46px;padding:6px 10px;font-size:.82rem;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;}
.btn.tap.danger{font-size:1.05rem;line-height:1;}

/* --- Start tab: pinned selection summary (v20) --- */
.picked-card{border-left:4px solid var(--accent);}
.picked-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 0;
  border-bottom:1px dashed var(--border);flex-wrap:wrap;}
.picked-row:last-child{border-bottom:none;}
.picked-name{flex:1 1 150px;font-size:.95rem;}

/* --- contrast: --muted fails 4.5:1 on the page background (4.40:1). This does not. --- */
.muted{color:#5f5b52;}
</style>
</head>
<body>

<script id="seed-recipes" type="application/json">{"recipes":[{"id":"mushroom-risotto","name":"Mushroom Risotto","category":"Vegetable","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Wine: white","quantity":500,"displayQty":"2","displayUnit":"cup"},{"ingredientName":"Rice: arborio","quantity":563,"displayQty":"2 ¼","displayUnit":"cup"},{"ingredientName":"Stock: vegetable","quantity":1500,"displayQty":"6","displayUnit":"cup"},{"ingredientName":"Leek","quantity":1},{"ingredientName":"Oil: olive","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Mushrooms","quantity":300},{"ingredientName":"Balsamic vinegar","quantity":1},{"ingredientName":"Cheese: Parmesan","quantity":188,"displayQty":"¾","displayUnit":"cup"},{"ingredientName":"Parsley","quantity":60,"displayQty":"3","displayUnit":"TBsp"},{"ingredientName":"Butter","quantity":20}],"method":["Heat oil and butter in a saucepan. Add leek and cook for 5 mins or until soft and golden","Add mushrooms and cook for 5 mins","Stir in Arborio rice until it is transparent.","Add ½ cup of stock/wine, stirring until absorbed. Continue adding stock ½ cup at a time until rice is tender and creamy.","Stir in parmesan and parsley and serve drizzled with balsamic vinegar"],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Mushroom Risotto","legacyDocLink":"Recipe Book pages\\mushroom risotto.doc#Recipe%20Book%20pages/mushroom%20risotto.doc#"},{"id":"balinese-lamb-curry","name":"Balinese Lamb Curry","category":"Meat (Red)","servings":8,"slowCooker":false,"inSeason":true,"ingredients":[{"quantity":1000,"unit":"g","ingredientName":"Lamb strips"},{"ingredientName":"Oil: olive","quantity":40,"unit":"mL","displayQty":"2","displayUnit":"TBsp"},{"quantity":"2","unit":"qty","ingredientName":"Tomatoes"},{"ingredientName":"Stock: chicken","quantity":375,"unit":"mL"},{"quantity":"1","unit":"qty","ingredientName":"Cinnamon stick"},{"quantity":"6","unit":"qty","ingredientName":"Cardamom pods"},{"quantity":"400","unit":"mL","ingredientName":"Coconut cream"},{"ingredientName":"Tamarind paste","quantity":10,"unit":"g","displayQty":"2","displayUnit":"tsp"},{"ingredientName":"Coriander (ground)","quantity":10,"unit":"g","displayQty":"2","displayUnit":"tsp","section":"Curry Paste"},{"ingredientName":"Cumin (ground)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp","section":"Curry Paste"},{"ingredientName":"Fennel (seeds)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp","section":"Curry Paste"},{"quantity":"5","unit":"qty","ingredientName":"Cloves","section":"Curry Paste"},{"ingredientName":"Pepper","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp","section":"Curry Paste"},{"quantity":"1","unit":"qty","ingredientName":"Onion","section":"Curry Paste"},{"quantity":"4","unit":"g","ingredientName":"Macadamia nuts","section":"Curry Paste"},{"ingredientName":"Ginger (crushed)","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp","section":"Curry Paste"},{"quantity":"2","unit":"qty","ingredientName":"Garlic","section":"Curry Paste"},{"quantity":"1","unit":"qty","ingredientName":"Chillies","section":"Curry Paste"},{"ingredientName":"Tumeric","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp","section":"Curry Paste"},{"ingredientName":"Nutmeg","quantity":1,"unit":"g","displayQty":"¼","displayUnit":"tsp","section":"Curry Paste"}],"method":["To make the spice paste, place coriander seeds, cumin seeds, fennel seeds, cloves and peppercorns in a small frying pan. Cook over medium heat, shaking the pan occasionally, for 3 minutes or until aromatic. Transfer to a food processor and process until smooth. Add the onion, macadamias, ginger, garlic, chilli, 3 tsp water, turmeric and nutmeg. Process until a smooth paste forms.","Heat oil in a wok or large saucepan over medium heat. Cook spice paste, stirring, for 3 minutes or until aromatic. Add lamb and cook, stirring, for 2 minutes or until browned. Stir in the tomato. Add the stock, cinnamon and cardamom. Reduce heat to low. Simmer, stirring occasionally, for 1 hour.","Add the coconut milk and cook for 1 1/2 hours or until lamb is tender. Stir in tamarind. Season with salt and pepper."],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Balinese Lamb Curry","legacyDocLink":"Recipe Book pages\\Balinese Lamb Curry.docx#Recipe%20Book%20pages\\Balinese%20Lamb%20Curry.docx#"},{"id":"carrot-cake","name":"Carrot Cake","category":"Morning Tea","servings":12,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Flour (Self Raising)","quantity":333,"unit":"g","displayQty":"1 ⅓","displayUnit":"cup"},{"ingredientName":"Baking soda","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Cinnamon (ground)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Nutmeg","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp"},{"quantity":500,"unit":"qty","ingredientName":"Carrot","displayQty":"2","displayUnit":"cup"},{"ingredientName":"Walnuts","quantity":250,"unit":"g","displayQty":"1","displayUnit":"cup"},{"ingredientName":"Oil: vegetable","quantity":167,"unit":"mL","displayQty":"⅔","displayUnit":"cup"},{"ingredientName":"Sugar (white)","quantity":250,"unit":"g","displayQty":"1","displayUnit":"cup"},{"ingredientName":"Vanilla essence","quantity":5,"unit":"mL","displayQty":"1","displayUnit":"tsp"},{"quantity":"3","unit":"qty","ingredientName":"Eggs (whole)"},{"quantity":"50","unit":"g","ingredientName":"Cheese: Cream","section":"Icing"},{"ingredientName":"Butter","quantity":40,"unit":"g","displayQty":"2","displayUnit":"TBsp","section":"Icing"},{"ingredientName":"Lemon juice","quantity":10,"unit":"mL","displayQty":"2","displayUnit":"tsp","section":"Icing"},{"ingredientName":"Sugar (icing)","quantity":500,"unit":"g","displayQty":"2","displayUnit":"cup","section":"Icing"}],"method":["Sift flour, bicarb soda and spices into a bowl.","Add carrots, walnuts, oil, sugar, vanilla and eggs and mix lightly.","Pour into greased and papered cake tin and bake at 180 C for 35 to 45 min.","Stand for a few minutes before turning out to cool.","Ice with lemon icing","— ICING","Combine all ingredients and beat until smooth"],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Carrot Cake","legacyDocLink":"Recipe Book pages\\carrot cake.docx#Recipe%20Book%20pages\\carrot%20cake.docx#"},{"id":"winter-vegetable-tagine","name":"Winter Vegetable Tagine","category":"Vegetable","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Oil: olive","quantity":20,"displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Onion","quantity":2},{"ingredientName":"Carrot","quantity":2},{"ingredientName":"Parsnips","quantity":1},{"ingredientName":"Pumpkin","quantity":300},{"ingredientName":"Sweet potato","quantity":300},{"ingredientName":"Tomato paste","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"cayenne pepper","quantity":3,"displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Ginger (ground)","quantity":5,"displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Tumeric","quantity":5},{"ingredientName":"Safron","quantity":1},{"ingredientName":"Cinnamon stick","quantity":2},{"ingredientName":"Stock: vegetable","quantity":1000},{"ingredientName":"Chickpeas (can)","quantity":400},{"ingredientName":"Apricots (dried)","quantity":167,"displayQty":"⅔","displayUnit":"cup"},{"ingredientName":"Dates","quantity":8},{"ingredientName":"Honey","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Parsley","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Almonds (flaked)","quantity":125,"displayQty":"½","displayUnit":"cup"},{"ingredientName":"Couscous (instant)","quantity":100}],"method":["Heat oil in a large flameproof casserole over medium heat. Add onion and cook, stirring, for 5 minutes or until softened.","Add carrot, parsnip, kumara, pumpkin, tomato paste, cayenne, saffron, ginger, turmeric and cinnamon quills. Pour in enough vegetable stock or water to just cover and bring to a gentle simmer. Cover and cook gently for 45 minutes.","Add the chickpeas, apricots, dates, and honey. Season, then simmer for a further 20 minutes or until vegetables are tender and the mixture is thick and soupy.","Scatter with herbs and almonds. Serve with harissa and couscous, if desired."],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Winter Vegetable Tagine","legacyDocLink":"Recipe Book pages\\winter vegetable tagine.doc#Recipe%20Book%20pages\\winter%20vegetable%20tagine.doc#"},{"id":"butter-chicken","name":"Butter Chicken","category":"Meat (White)","servings":4,"slowCooker":true,"inSeason":true,"ingredients":[{"ingredientName":"Oil: olive","quantity":20,"unit":"mL","displayQty":"1","displayUnit":"TBsp"},{"quantity":"1","unit":"qty","ingredientName":"Onion"},{"quantity":"3","unit":"qty","ingredientName":"Garlic"},{"ingredientName":"Ginger (crushed)","quantity":15,"unit":"g","displayQty":"3","displayUnit":"tsp"},{"quantity":"1","unit":"qty","ingredientName":"Cinnamon stick"},{"ingredientName":"Garam Marsala","quantity":10,"unit":"g","displayQty":"2","displayUnit":"tsp"},{"ingredientName":"Coriander (ground)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Paprika","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Cumin (ground)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Tumeric","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Chilli powder","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp"},{"quantity":"400","unit":"g","ingredientName":"Pumpkin"},{"quantity":"500","unit":"mL","ingredientName":"Stock: chicken"},{"ingredientName":"Tomato paste","quantity":70,"unit":"mL"},{"quantity":800,"unit":"g","ingredientName":"Chicken (boneless)"},{"ingredientName":"Yoghurt (natural)","quantity":125,"unit":"mL"},{"ingredientName":"Cornflour","quantity":8,"unit":"g","displayQty":"1 ½","displayUnit":"tsp"},{"quantity":"200","unit":"g","ingredientName":"Rice: white"},{"quantity":"8","unit":"qty","ingredientName":"pappadums"}],"method":["Heat oil in a saucepan over medium heat. Stir in onion, garlic and ginger for 4 minutes or until soft. Stir in cinnamon, garam masala, coriander, paprika, cumin, turmeric and chilli for 1 minute or until aromatic. Stir in pumpkin, stock and tomato paste. Bring to the boil. Reduce heat to low. Partially cover and simmer, stirring  ccasionally, for 8-10 minutes or until pumpkin is just tender. Stir in chicken for 7 minutes or until almost cooked through. Remove from heat.","Spoon 2 tablespoons of the sauce into a heatproof bowl. Whisk in yoghurt and cornflour until smooth and combined. Slowly stir into the chicken mixture. Stir over low heat for 3 minutes or until the sauce thickens slightly. Serve with rice."],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Butter Chicken","legacyDocLink":"Recipe Book pages\\butter chicken.pdf#Recipe%20Book%20pages\\butter%20chicken.pdf#"},{"id":"sticky-chinese-pork","name":"Sticky Chinese Pork","category":"Meat (White)","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"quantity":"1000","unit":"g","ingredientName":"Pork strips"},{"ingredientName":"Sugar (brown)","quantity":40,"unit":"g","displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Soy sauce","quantity":80,"unit":"mL","displayQty":"4","displayUnit":"TBsp"},{"quantity":"1","unit":"g","ingredientName":"Five Spice (ground)"},{"ingredientName":"Fish sauce","quantity":10,"unit":"mL","displayQty":"2","displayUnit":"tsp"},{"quantity":"200","unit":"g","ingredientName":"Noodles (rice)"},{"quantity":"30","unit":"mL","ingredientName":"Oil: vegetable"},{"quantity":"1","unit":"qty","ingredientName":"Red Onion"},{"quantity":"10","unit":"g","ingredientName":"Ginger (crushed)"},{"quantity":"4","unit":"qty","ingredientName":"Garlic"},{"quantity":"1","unit":"qty","ingredientName":"Capsicum (red)"},{"quantity":"1","unit":"qty","ingredientName":"Carrot"},{"quantity":"1","unit":"qty","ingredientName":"Bok choi (bunch)"},{"quantity":"250","unit":"g","ingredientName":"snowpeas"},{"ingredientName":"Stock: chicken","quantity":250,"unit":"mL","displayQty":"1","displayUnit":"cup"},{"ingredientName":"Oyster sauce","quantity":63,"unit":"mL","displayQty":"¼","displayUnit":"cup"},{"ingredientName":"Cashew nut (unsalted","quantity":63,"unit":"g","displayQty":"¼","displayUnit":"cup"},{"quantity":"1","unit":"qty","ingredientName":"Spring onion"},{"quantity":"1","unit":"qty","ingredientName":"Chillies"}],"method":["Place the pork, honey, soy sauce, garlic, rice wine and sugar in a large bowl and mix thoroughly. Cover and marinate for 4 hours","Place the pork with marinade mixture and stock into the slow cooker. Cover and cook on low for 6 hours. Serve with chives"],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Chinese Sticky Pork","legacyDocLink":"Recipe Book pages\\sticky chinese pork stir fry.pdf#Recipe%20Book%20pages\\sticky%20chinese%20pork%20stir%20fry.pdf#"},{"id":"vegetable-pakora-salad","name":"Vegetable Pakora Salad","category":"Side Dish","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"quantity":"5","unit":"g","ingredientName":"Salt"},{"quantity":"225","unit":"g","ingredientName":"Flour (Self Raising)"},{"quantity":"10","unit":"g","ingredientName":"Cumin (ground)"},{"quantity":"10","unit":"g","ingredientName":"Coriander (ground)"},{"quantity":"5","unit":"g","ingredientName":"Tumeric"},{"quantity":"1","unit":"g","ingredientName":"cayenne pepper"},{"quantity":"50","unit":"mL","ingredientName":"Oil: vegetable"},{"quantity":"260","unit":"mL","ingredientName":"Yoghurt (natural)"},{"quantity":"90","unit":"g","ingredientName":"Chutney"},{"quantity":"50","unit":"g","ingredientName":"Spinach leaves"},{"quantity":"1","unit":"qty","ingredientName":"Lemon (fresh)"},{"quantity":"100","unit":"g","ingredientName":"Potatoes"},{"quantity":"1","unit":"qty","ingredientName":"Onion"},{"quantity":"1","unit":"qty","ingredientName":"Carrot"},{"quantity":"1","unit":"qty","ingredientName":"Zucchini"}],"method":["Preheat oven to 160C/140C fan forced. Combine the sliced mixed vegetables in a bowl. Sprinkle with the salt and mix. Set aside for 5 minutes to allow vegetables to soften slightly.","Combine the yoghurt and chutney in a bowl.","Place the flour and combined ground spices in a bowl. Gradually whisk in 310ml (1 1/4 cups) of cold water until a thick batter forms. Add to the vegetable mixture and toss gently until the vegetables are well coated.","Add enough oil to a deep heavy-based frying pan until 2cm deep. Place over medium-high heat (when the oil is ready, a cube of bread will turn light golden in 30 seconds). Add 2 tbs of the vegetable mixture to the oil. Repeat to make 3 fritters. Cook for 2 minutes or until the base is golden. Turn and cook for a further 1-2 minutes. Transfer to a plate lined with paper towel to drain.","Repeat in 4 more batches with the remaining mixture. Place the vegetable pakoras on a baking tray and keep warm in the oven.","Divide the salad leaves and vegetable pakora among serving plates. Serve with the yoghurt dressing and lime or lemon wedges."],"notes":"","images":[],"source":"access_db","wikiTitle":null,"legacyDocLink":"Recipe Book pages\\vegetable pakora salad.pdf#Recipe%20Book%20pages\\vegetable%20pakora%20salad.pdf#"},{"id":"cauliflower-cottage-pie","name":"Cauliflower Cottage Pie","category":"Meat (Red)","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Almonds (ground)","quantity":500,"unit":"g","displayQty":"2","displayUnit":"cup","section":"Crust"},{"ingredientName":"Sesame seeds","quantity":125,"unit":"g","displayQty":"½","displayUnit":"cup","section":"Crust"},{"ingredientName":"Cheese: Parmesan","quantity":125,"unit":"g","displayQty":"½","displayUnit":"cup","section":"Crust"},{"quantity":"1","unit":"qty","ingredientName":"Eggs (whole)","section":"Crust"},{"quantity":"1","unit":"g","ingredientName":"Salt","section":"Crust"},{"quantity":"500","unit":"g","ingredientName":"Cauliflower","section":"Mash"},{"ingredientName":"Cheese: Parmesan","quantity":125,"unit":"g","displayQty":"½","displayUnit":"cup","section":"Mash"},{"ingredientName":"Dill","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp","section":"Mash"},{"ingredientName":"Garlic Powder","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp","section":"Mash"},{"quantity":"1","unit":"g","ingredientName":"Pepper","section":"Mash"},{"quantity":"1","unit":"g","ingredientName":"Salt","section":"Mash"},{"quantity":"500","unit":"g","ingredientName":"Mince: beef","section":"Filling"},{"quantity":"1","unit":"qty","ingredientName":"Onion","section":"Filling"},{"quantity":"2","unit":"qty","ingredientName":"Carrot","section":"Filling"},{"ingredientName":"Corn (frozen)","quantity":125,"unit":"g","displayQty":"½","displayUnit":"cup","section":"Filling"},{"ingredientName":"Peas (frozen)","quantity":125,"unit":"g","displayQty":"½","displayUnit":"cup","section":"Filling"},{"quantity":"1","unit":"qty","ingredientName":"Tinned tomato","section":"Filling"},{"ingredientName":"Tomato paste","quantity":20,"unit":"mL","displayQty":"1","displayUnit":"TBsp","section":"Filling"},{"ingredientName":"Worcestershire sauce","quantity":63,"unit":"mL","displayQty":"¼","displayUnit":"cup","section":"Filling"},{"ingredientName":"Stock: beef","quantity":5,"unit":"mL","displayQty":"1","displayUnit":"tsp","section":"Filling"},{"quantity":"1","unit":"qty","ingredientName":"Garlic","section":"Filling"}],"method":["Crust:","In a food processor add in almond meal, sesame seeds, parmesan cheese, egg and salt. Process until the mixture comes together nicely. Spoon crust mixture into a bowl. Start adding mixture into each tart tin using your fingers to make sure the mixture is spread evenly, use the back of a teaspoon to help you.","Place crusts into the oven for around 15 minutes or until golden brown.","Filling:","In a fry pan on medium heat add a splash of olive oil (not necessary if you have a non-stick pan) along with onions and garlic, sauté for a few minutes. Then crush the OXO cube and add in the mince. Stir with a wooden spoon until the mince browns.","Add in all other filling ingredients and mix until well combined. Turn heat down to low and simmer for 10 minutes.","Mash:","Cut up cauliflower into chunks and steam for around 10 minutes until tender.","Transfer into food processor along with parmesan cheese, dill, garlic powder, salt and pepper. Process until ingredients are smooth.","Once your crusts are cooked start filling each one with the mince mixture and top with the cauliflower mash and enjoy.","You will need 4 tart tins or feel free to make the pie in a quiche dish"],"notes":"","images":[],"source":"access_db","wikiTitle":null,"legacyDocLink":"Recipe Book pages\\Cauliflower Cottage Pie.pdf#Recipe%20Book%20pages\\Cauliflower%20Cottage%20Pie.pdf#"},{"id":"spicy-asian-prawns","name":"Spicy Asian Prawns","category":"Seafood","servings":2,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Tumeric","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Cinnamon (ground)","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Paprika","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Soy sauce","quantity":63,"unit":"mL","displayQty":"¼","displayUnit":"cup"},{"quantity":"200","unit":"g","ingredientName":"Prawns"},{"quantity":"20","unit":"mL","ingredientName":"Oil: olive"},{"quantity":"1","unit":"qty","ingredientName":"Onion"},{"quantity":"1","unit":"qty","ingredientName":"Garlic"},{"ingredientName":"Ginger (crushed)","quantity":3,"unit":"g","displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Coriander (ground)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp"},{"quantity":"2","unit":"qty","ingredientName":"Chillies"},{"quantity":"150","unit":"g","ingredientName":"snowpeas"},{"quantity":"0.5","unit":"qty","ingredientName":"Capsicum (red)"},{"quantity":"100","unit":"g","ingredientName":"Cabbage"},{"quantity":"1","unit":"qty","ingredientName":"Bok choi (bunch)"},{"ingredientName":"Lemon juice","quantity":20,"unit":"mL","displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Sesame seeds","quantity":63,"unit":"g","displayQty":"¼","displayUnit":"cup"},{"ingredientName":"Oyster sauce","quantity":20,"unit":"mL","displayQty":"1","displayUnit":"TBsp"}],"method":["In a bowl, combine turmeric, cinnamon, smoked paprika and tamari and mix well. Add the prawns and make sure they are coated. Cover the bowl with plastic wrap and stand in the fridge to marinate for at least 30 minutes.","Heat a splash of olive oil in a frying pan over medium heat, then add the onion, garlic, ginger, coriander and chilli. Stir-fry until onion is translucent. Add the snow peas, capsicum, choy sum, bok choy and oyster sauce and stir fry for 5 minutes. Add the prawns, season with salt and pepper, then add the lemon juice and sesame seeds. Cook for a further 5 minutes stirring frequently until prawns are cooked."],"notes":"","images":[],"source":"access_db","wikiTitle":"Spicy Asian Prawns","legacyDocLink":"Recipe Book pages\\Spicy Asian Prawns.pdf#Recipe%20Book%20pages\\Spicy%20Asian%20Prawns.pdf#"},{"id":"spiced-beef-with-sultana-rice","name":"Spiced beef with sultana rice","category":"Meat (Red)","servings":4,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Butter","quantity":25},{"ingredientName":"Ginger (crushed)","quantity":10,"displayQty":"2","displayUnit":"tsp"},{"ingredientName":"Garlic","quantity":4},{"ingredientName":"Sultanas","quantity":84,"displayQty":"⅓","displayUnit":"cup"},{"ingredientName":"Rice: white","quantity":375,"displayQty":"1 ½","displayUnit":"cup"},{"ingredientName":"Oil: olive","quantity":20,"displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Mince: beef","quantity":500},{"ingredientName":"Cumin (ground)","quantity":8,"displayQty":"1 ½","displayUnit":"tsp"},{"ingredientName":"Coriander (ground)","quantity":8,"displayQty":"1 ½","displayUnit":"tsp"},{"ingredientName":"Paprika","quantity":5,"displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Honey","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Spinach leaves","quantity":120},{"ingredientName":"Lemon juice","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Yoghurt (natural)","quantity":200},{"ingredientName":"Mint","quantity":5},{"ingredientName":"Parsley","quantity":5},{"ingredientName":"Lemon (fresh)","quantity":40,"displayQty":"2","displayUnit":"TBsp"}],"method":["Heat butter in a medium saucepan over medium-high heat. Add half each of the ginger and garlic, sultanas and rice, then cook, stirring, for 1 minute or until fragrant. Add 3 cups cold water and bring to the boil. Reduce heat to low and simmer, covered, for 12 minutes or until water evaporates and rice is almost tender. Remove from heat and stand, covered, for 5 minutes or until tender. Season to taste.","Meanwhile, heat oil in a large frying pan over high heat. Add mince and cook, stirring with a wooden spoon to break up lumps, for 5 minutes or until browned. Add remaining ginger and garlic, cumin, coriander and paprika and cook, stirring, for 1 minute or until fragrant. Add honey and cook, stirring, for 2 minutes to crisp up mince.","Stir spinach and lemon juice into beef mixture and cook for 1 minute or until spinach has wilted. Season.","Divide rice amongst serving bowls. To serve, top with beef, yoghurt, herbs and lemon.","— TIP","For an extra pop of colour and freshness, scatter pomegranate seeds over the top of this dish before serving."],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Spiced beef with sultana rice","legacyDocLink":""},{"id":"sausage-platter","name":"Sausage Platter","category":"Party","servings":8,"slowCooker":false,"inSeason":true,"ingredients":[{"quantity":"8","unit":"g","ingredientName":"Sausages"},{"quantity":"40","unit":"mL","ingredientName":"Oil: vegetable"},{"ingredientName":"cayenne pepper","quantity":20,"unit":"g","displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Curry powder","quantity":40,"unit":"g","displayQty":"2","displayUnit":"TBsp"},{"quantity":"800","unit":"g","ingredientName":"Potatoes"},{"quantity":"1","unit":"qty","ingredientName":"Onion","section":"Barbecue Sauce"},{"quantity":"2","unit":"qty","ingredientName":"Garlic","section":"Barbecue Sauce"},{"quantity":"20","unit":"mL","ingredientName":"Oil: vegetable","section":"Barbecue Sauce"},{"ingredientName":"Fennel (seeds)","quantity":5,"unit":"g","displayQty":"1","displayUnit":"tsp","section":"Barbecue Sauce"},{"quantity":"60","unit":"g","ingredientName":"Sugar (brown)","section":"Barbecue Sauce"},{"quantity":"75","unit":"mL","ingredientName":"Vinegar","section":"Barbecue Sauce"},{"ingredientName":"Celery Seed","quantity":20,"unit":"g","displayQty":"1","displayUnit":"TBsp","section":"Barbecue Sauce"},{"quantity":"10","unit":"g","ingredientName":"Salt","section":"Barbecue Sauce"},{"ingredientName":"cayenne pepper","quantity":20,"unit":"g","displayQty":"1","displayUnit":"TBsp","section":"Barbecue Sauce"},{"ingredientName":"Chilli powder","quantity":20,"unit":"g","displayQty":"1","displayUnit":"TBsp","section":"Barbecue Sauce"},{"ingredientName":"Worcestershire sauce","quantity":30,"unit":"mL","displayQty":"1 ½","displayUnit":"TBsp","section":"Barbecue Sauce"},{"quantity":"250","unit":"mL","ingredientName":"Tomato paste","section":"Barbecue Sauce"},{"quantity":"3","unit":"g","ingredientName":"Salt","section":"Barbecue Sauce"},{"quantity":"3","unit":"g","ingredientName":"Pepper","section":"Barbecue Sauce"},{"quantity":"50","unit":"mL","ingredientName":"Bourbon","section":"Barbecue Sauce"}],"method":["— IN THE KITCHEN","Cut each sausage into 5 pieces. Mix in a bowl the oil with the cayenne pepper and curry powder. Then add the sausage pieces and allow it to marinade for 20 minutes.","In the meantime, make the barbecue sauce. Peel the onion and garlic and chop both finely. Put the rapeseed oil in a pan and sauté the onion, garlic and the fennel seeds until soft and golden. Then add all the other ingredients for the barbecue sauce apart from the bourbon. Simmer the sauce over a low heat for about 15 minutes. Finely add the bourbon and season if necessary with salt and pepper. If you would like to add a smoky flavour to the barbecue sauce – smoke the sauce on the barbecue (see below).","— AT THE BARBECUE","Prepare the barbecue for indirect heat, approx. 200°C. Pour the barbecue sauce into a container that can stand the heat from the barbecue. Add smoke chips to the briquettes or in the smoker box and place the sauce over indirect heat, close the lid and smoke the sauce for 10 minutes. Remove it from the barbecue and let it cool off.","Fasten the basket to the rotisserie. Drain the pieces of sausage and put them in the basket together with the par-boiled new potatoes. Close the basket and place the spit in the rotisserie motor. Turn it on and grill the sausage mix for about 20 minutes until the potatoes and sausages are brown. Serve with the homemade barbecue sauce."],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Sausage Platter","legacyDocLink":""},{"id":"ultimate-meatloaf","name":"Ultimate Meatloaf","category":"Meat (Red)","servings":8,"slowCooker":false,"inSeason":true,"ingredients":[{"ingredientName":"Eggs (whole)","quantity":2},{"ingredientName":"Soy sauce","quantity":20,"displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Mustard: Dijon","quantity":20,"displayQty":"1","displayUnit":"TBsp"},{"ingredientName":"Chilli sauce","quantity":5,"displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Milk","quantity":84,"displayQty":"⅓","displayUnit":"cup"},{"ingredientName":"Oranges","quantity":1},{"ingredientName":"Bread crumbs (fresh)","quantity":375,"displayQty":"1 ½","displayUnit":"cup"},{"ingredientName":"Basil","quantity":40,"displayQty":"2","displayUnit":"TBsp"},{"ingredientName":"Oregano","quantity":10,"displayQty":"2","displayUnit":"tsp"},{"ingredientName":"Garlic Powder","quantity":5,"displayQty":"1","displayUnit":"tsp"},{"ingredientName":"Salt","quantity":3,"displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Thyme","quantity":3,"displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Cumin (ground)","quantity":3,"displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Pepper","quantity":3,"displayQty":"½","displayUnit":"tsp"},{"ingredientName":"Cinnamon (ground)","quantity":2,"displayQty":"¼","displayUnit":"tsp"},{"ingredientName":"Nutmeg","quantity":2,"displayQty":"¼","displayUnit":"tsp"},{"ingredientName":"Onion","quantity":1},{"ingredientName":"Capsicum (red)","quantity":0.5},{"ingredientName":"Sun dried capsicum","quantity":125,"displayQty":"½","displayUnit":"cup"},{"ingredientName":"Mince: beef","quantity":1},{"ingredientName":"Mince: Pork","quantity":1},{"ingredientName":"Bacon","quantity":250}],"method":["Prep. In a big bowl, mix the wet stuff thoroughly.","In a small bowl, mix the dry stuff thoroughly.","Set aside 1/2 cup of the dry stuff for the crust. Add the remaining 1 cup of the dry stuff to the wet stuff and stir it together. Let it soak for a minute or two.","Add the veggies and the meat. Resist the temptation to overwork the mass and pack it tight. We don't need no stinkin' meat bricks. If it doesn't mix thoroughly, that's OK: bursts of flavor are fun. Form it into a cylinder about 3\" in diameter. Yes, I know this sounds weird, but this tube shape will insure that it cooks evenly on all sides and it makes it easier to roll around on the grill to brown on all sides.","Pour the remaining 1/2 cup of the dry stuff on a flat surface such as a cutting board and set the loaf on it so the bottom gets coated. Sprinkle the rest of the crust over the rest of the surface and roll it around so the loaf is coated on all sides.","Place the meatloaf in the refrigerator to firm up while you prepare the grill.","Fire up. Set up your grill for 2-zone cooking. Preheat the indirect side to about 325°F. That's a good temp for browning things without squeezing out too much moisture. Start a pot of water boiling for the potatoes.","Cook. Place the loaf on the grate on the indirect side. If you like, throw some wood on the fire to add a bit of smoke, but not too much. Roast until the temp in the center of the loaf is 160°F, which is the temp at which the eggs are thoroughly cooked and safe.","Serve. Remove the meatloaf from the grill, slice and serve with mashed potatoes and/or your favorite side dishes.","Now tell us, what do you do with your leftovers?"],"notes":"","images":[],"source":"access_db+wiki","wikiTitle":"Ultimate Meatloaf","legacyDocLink":""}],"ingredients":[{"id":1,"name":"Pepper","shoppingCategory":"Pantry","shoppingUnit":"g","servingSize":1,"kjPerServe":50,"needed":true,"aisle":"Spices"},{"id":2,"name":"Butter","shoppingCategory":"Cold","shoppingUnit":"g","servingSize":5,"kjPerServe":150,"needed":true,"aisle":"Deli"},{"id":3,"name":"Cheese: Cheddar","shoppingCategory":"Cold","shoppingUnit":"g","servingSize":30,"kjPerServe":500,"needed":true,"aisle":"Deli"},{"id":4,"name":"Chillies","shoppingCategory":"Fruit and Vegetables","shoppingUnit":"qty","servingSize":1,"kjPerServe":30,"needed":true,"aisle":"Vegetables"},{"id":5,"name":"Chutney","shoppingCategory":"Pantry","shoppingUnit":"g","servingSize":25,"kjPerServe":105,"needed":true,"aisle":"Sauces"},{"id":6,"name":"Cornflour","shoppingCategory":"Pantry","shoppingUnit":"g","servingSize":30,"kjPerServe":470,"needed":true,"aisle":"Baking"},{"id":7,"name":"Flour (Plain)","shoppingCategory":"Pantry","shoppingUnit":"g","servingSize":25,"kjPerServe":380,"needed":true,"aisle":"Baking"},{"id":8,"name":"Garlic","shoppingCategory":"Pantry","sho "use strict";

// Storage shim. Safari throws SecurityError on localStorage for file:// pages,
// and any browser can throw QuotaExceededError once storage is full. Either used
// to kill startup outright. This probes storage once and falls back to an
// in-memory store so the app still runs — the user is told plainly that nothing
// is being saved.
let storageBlockedReason = '';
const localStorage = (function(){
  try{
    const probe = '__fridgelist_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return window.localStorage;
  }catch(e){
    storageBlockedReason = (e && e.name === 'SecurityError')
      ? 'This browser blocks saving for files opened straight from disk. Nothing you change will be kept.'
      : ('Local saving is unavailable (' + ((e && e.message) || e) + '). Nothing you change will be kept.');
    const mem = Object.create(null);
    return {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function(k, v){ mem[k] = String(v); },
      removeItem: function(k){ delete mem[k]; },
      clear: function(){ Object.keys(mem).forEach(function(k){ delete mem[k]; }); }
    };
  }
})();

const LS_UI_STATE = 'fma_ui_state_v1';
const VALID_TABS = ['recipes','start','review','needed','menu','settings'];

function saveUiState(){

    localStorage.setItem(LS_UI_STATE, JSON.stringify({
      tab: currentTab, hideTicked: hideTickedItems, keepAwake: shopKeepAwake
    }));
  }catch(e){ /* non-essential: losing this only costs a scroll position */ }
}

function loadUiState(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_UI_STATE) || '{}');
    if(VALID_TABS.indexOf(s.tab) !== -1) currentTab = s.tab;
    hideTickedItems = !!s.hideTicked;
    shopKeepAwake = !!s.keepAwake;
  }catch(e){ /* fall back to the defaults already set */ }
}

   "Shopping is done", and it lapses on its own six hours after the last tick so a trip
   nobody closed cannot freeze next week. */
function shoppingInProgress(){
  return tripIsLive(shoppingData);

function deviceId(){
  let id = localStorage.getItem(LS_DEVICE_ID);

    try{ localStorage.setItem(LS_DEVICE_ID, id); }catch(e){}

}

   lastWriteError is set by the two write paths so autoSaveToOneDrive can turn an
   HTTP status into something a person can act on. syncPendingSince is set on every
   local change and cleared only by a successful OneDrive write, which is what makes
   a silent stall visible even when no error code ever comes back. */
let lastWriteError = null;          // { status, name } from the most recent failed PUT
let syncPendingSince = null;        // ms timestamp of the oldest unsaved local change
let lastSyncOkAt = null;            // ms timestamp of the last successful write
let syncAlertTimer = null;
const SYNC_STALE_MS = 5*60*1000;    // unsaved for this long with no error = amber warning
/* How long to let startup settle before accusing a device of being disconnected.
   tryReconnectFolder() and initMsal() are both async, so a phone that is a second away
   from connecting must not be told it is on its own. */
const SYNC_UNLINKED_GRACE_MS = 12000;
let appStartedAt = Date.now();
let syncAlertMuted = null;          // "Not now", for this session only — never persisted

/* ---- v20 trolley-screen state ---- */
let hideTickedItems = false;
let shopKeepAwake = false;

let recipesData = null;   // { recipes:[...], ingredients:[...], meta }
let imagesData = {};      // { filename: {type, base64} }
let shoppingData = null;  // { weekPlan:{selections:[]}, shoppingList:[], neededList:[], lastUpdated }

let dirHandle = null;     // FileSystemDirectoryHandle (Chrome/Edge only)
let msalInstance = null;
let msalAccount = null;
let oneDriveFolderRef = null; // {driveId, itemId} for the resolved "FridgeList" folder
let oneDrivePollTimer = null;
// One gate for every path that merges remote state in. Both pollers and the folder
// reload share it so two merges can never interleave on shoppingData.
let syncInFlight = false;
let oneDriveLastModified = {}; // { 'recipes-data.json': isoString, 'shopping-list.json': isoString }
/* v21.8: the newest shared shopping state this device has actually read. Not the
   same as shoppingData.lastUpdated, which our own local saves move forward — this
   only advances when we have genuinely seen someone else's copy, which is what
   makes it a usable measure of how caught-up this device was. */
let shoppingSeenRemoteAt = null;

/* ---- v23.7: is this phone looking at the family's list, or at a copy of it? ----

   The shared file is the list. Every phone holds a cache, and nothing on screen has ever
   said whether that cache is current — so "am I looking at the list?" had no answer, which
   is the same gap the two-trip fork came through.

   These are MODIFIED TIMES from the folder, compared against each other. shoppingSeenRemoteAt
   is a stamp from INSIDE the file and is not comparable with a file's mtime: mixing the two
   would invent staleness that is not there. */
let shoppingRemoteModifiedSeen = null;    // mtime of the copy this device has merged
let shoppingRemoteModifiedLatest = null;  // newest mtime any metadata poll has seen
let shoppingBehindSince = null;           // ms when those two first disagreed
let shoppingLastCheckedAt = null;         // ms of the last successful metadata read
let shoppingCheckFailures = 0;            // consecutive FAILED metadata reads — see below

/* One place that moves all four, so a poll cannot advance one and forget another.
   `checked` alone (no mtime) records that a read succeeded — which is what separates
   "in step" from "this may not be the latest, nobody has managed to look". */
function noteRemoteShoppingStamp(modified, merged){
  shoppingLastCheckedAt = Date.now();
  shoppingCheckFailures = 0;
  if(modified) shoppingRemoteModifiedLatest = modified;
  if(merged) shoppingRemoteModifiedSeen = merged;
  const behind = !!(shoppingRemoteModifiedLatest
                    && shoppingRemoteModifiedLatest !== shoppingRemoteModifiedSeen);
  if(behind){ if(!shoppingBehindSince) shoppingBehindSince = Date.now(); }
  else shoppingBehindSince = null;
}

/* v23.8: a poll that was ATTEMPTED and failed. The guard returns above every call site —
   hidden tab, wrong tab, no account, a poll already in flight — are not failures and must
   never come through here. That distinction is the whole point. v23.7 measured time since
   the last success instead, and pollShoppingNow returns early while the screen is off, so
   a phone in a pocket between aisles was indistinguishable from one that could not reach
   the folder: it flashed a warning every time somebody picked their phone up. A warning
   follows a failed attempt, never a missing one. */
function noteRemoteCheckFailed(){
  shoppingCheckFailures++;
}
let currentTab = 'recipes';
let editingRecipeId = null; // null = not editing, 'new' = creating

/* ---------------- bootstrapping / persistence ---------------- */

function loadSeed(){
  const rEl = document.getElementById('seed-recipes');
  const iEl = document.getElementById('seed-images');
  const seedRecipes = JSON.parse(rEl.textContent);
  const seedImages = JSON.parse(iEl.textContent);
  return {seedRecipes, seedImages};
}

function defaultShoppingData(){
  return { weekPlan: { selections: [], generatedAt: null, tripId: null }, shoppingList: [], neededList: [],
           lastUpdated: null, updatedBy: '', seenRemoteAt: null };
}

// Refreshes the ingredient master's category/aisle/unit data from the bundled seed
// whenever the seed carries a newer version than the saved data. This is how fixes
// to shopping-list grouping reach people who already have data saved locally or in
// a shared folder — without touching their own recipes, additions, or edits.
function defaultSettings(){
  return { recipeHistoryEnabled: true, notCookedRecentlyDays: 60,
           // Feature switchboard: every optional capability ships OFF by default and its
           // UI is entirely absent until switched on (Settings -> Features). Synced with
           // the family's data so all devices behave the same. recipeFinder defaults ON
           // because it was already in live use before the switchboard existed.
           features: { staples: false, pantryAtHome: false, recipeFinder: true },
           staples: [],
           /* How much of each staple to buy, keyed by the staple's canonical name:
              { "Milk": 2000, "Eggs (whole)": 12 }. Deliberately held OUTSIDE the staples
              array so the array stays a plain list of strings — a device still on v21.2
              reads this file, and turning its entries into objects would break its
              settings screen and its list generation outright. An older device just
              ignores this map and behaves exactly as it does today.
              v21.4: a plain NUMBER in that ingredient's own shopping unit, so a staple
              amount adds into the recipe total for the same ingredient and the list
              shows one figure. v21.3 held free text here, which could only ever sit
              alongside the recipe amount as "125 mL + 2 L". */
           stapleQty: {},
           /* v22.0: ingredient names that start a new list in the "at home already" group,
              built up from the shops where somebody said so every time. A plain array of
              names, like `staples` and for the same reason — an older device reads this
              file and must not meet a shape it cannot parse. */
           alwaysAtHome: [],
           // Shopping-list side only: what the servings box is pre-filled with when a
           // recipe is ticked for the week. 'recipe' = that recipe's own servings;
           // 'fixed' = always shoppingServingsCount. Recipe display is never scaled.
           shoppingServingsMode: 'recipe', shoppingServingsCount: 4 };
}

function defaultShoppingServings(recipe){
  const s = recipesData.settings || {};
  if(s.shoppingServingsMode === 'fixed'){
    const n = parseInt(s.shoppingServingsCount, 10);
    if(n && n > 0) return n;
  }
  return recipe.servings || 4;
}

// Fills in any settings missing from a loaded/imported recipesData without touching
// ones the user has already changed — called from every load path via migrateIngredientsIfStale.
function ensureSettings(data){
  const d = defaultSettings();
  data.settings = Object.assign({}, d, data.settings || {});
  // nested objects need their own merge, or an older saved settings blob would
  // silently drop feature flags added in later versions
  data.settings.features = Object.assign({}, d.features, data.settings.features || {});
  if(!Array.isArray(data.settings.staples)) data.settings.staples = [];
  if(!Array.isArray(data.settings.alwaysAtHome)) data.settings.alwaysAtHome = [];
  const q = data.settings.stapleQty;
  if(!q || typeof q !== 'object' || Array.isArray(q)) data.settings.stapleQty = {};
  else migrateStapleQty(data);
  return data;
}

/* v21.3 stored staple amounts as free text ("2 L", "1 loaf"); v21.4 stores a number in
   the ingredient's own shopping unit so it can be added to the recipe total. Convert
   what has a defensible numeric reading and drop what does not — "1 loaf" has no
   meaning in grams, and inventing one would put a wrong number on the shopping list.
   Takes `data` rather than reading the global, because this runs during startup before
   recipesData is assigned. */
function migrateStapleQty(data){
  const map = data.settings.stapleQty;
  const byName = {};
  (data.ingredients || []).forEach(i => { byName[(i.name||'').trim().toLowerCase()] = i; });
  Object.keys(map).forEach(name=>{
    const v = map[name];
    if(typeof v === 'number'){ if(!(v > 0)) delete map[name]; return; }
    const meta = byName[(name||'').trim().toLowerCase()];
    const n = stapleQtyToShopping(v, meta && meta.shoppingUnit);
    if(n === null) delete map[name]; else map[name] = n;
  });
}

/* Read a typed staple amount as a number in `unit`. A bare number is already in that
   unit; the everyday larger units convert; anything else has no numeric reading. */
function stapleQtyToShopping(raw, unit){
  const s = String(raw == null ? '' : raw).trim();
  if(!s) return null;
  const m = s.match(/^([0-9.,/½¼¾⅓⅔⅛\s]+?)\s*([a-zA-Z]*)$/);
  if(!m) return null;
  const n = parseQty(m[1].replace(/,/g, '').trim());
  if(n === null || !(n > 0)) return null;
  const suffix = (m[2] || '').toLowerCase();
  if(!suffix) return n;                                   // already in the shopping unit
  if(unit === 'mL'){
    if(suffix === 'ml') return n;
    if(suffix === 'l')  return n * 1000;
    if(MEASURE_ML[m[2]]) return n * MEASURE_ML[m[2]];     // cup / TBsp / tsp
  }
  if(unit === 'g'){
    if(suffix === 'g')  return n;
    if(suffix === 'kg') return n * 1000;
  }
  return null;
}

// Quantity for a staple as a number in its shopping unit, or null if none is set.
// Matched case-insensitively so a rename in the ingredient master (or a
// differently-cased entry from another device) doesn't lose it.
function stapleQtyFor(name){
  const map = (recipesData.settings && recipesData.settings.stapleQty) || {};
  let v = map[name];
  if(v === undefined){
    const norm = (name||'').trim().toLowerCase();
    const hit = Object.keys(map).find(k => k.trim().toLowerCase() === norm);
    if(hit !== undefined) v = map[hit];
  }
  if(typeof v === 'number') return v > 0 ? v : null;
  // Not migrated yet: a phone still on v21.3 writes free text into this map and syncs
  // it across. Read it the same way the migration would rather than depending on
  // having been through it.
  const meta = findIngredientMeta(name);
  return stapleQtyToShopping(v, meta && meta.shoppingUnit);
}

// `qty` is whatever was typed; it is stored as a number in the ingredient's shopping
// unit, or cleared when blank or unreadable.
function setStapleQty(name, qty){
  if(!recipesData.settings.stapleQty) recipesData.settings.stapleQty = {};
  const map = recipesData.settings.stapleQty;
  const norm = (name||'').trim().toLowerCase();
  Object.keys(map).forEach(k => { if(k.trim().toLowerCase() === norm) delete map[k]; });
  const meta = findIngredientMeta(name);
  const n = stapleQtyToShopping(qty, meta && meta.shoppingUnit);
  if(n !== null) map[name] = n;
}

/* v23.4: the shopping units the app can actually work with, and the only ones it will
   offer. A kitchen measure (cup/TBsp/tsp) must NEVER become an ingredient's shopping
   unit — it hard-locks the recipe editor's unit box to that measure forever after, which
   is why saveRecipeFromForm converts such lines to mL instead. The stored values are
   exactly the three the seed already uses, so this adds no new shape to the file. */
const SHOPPING_UNIT_OPTIONS = [
  { value: '', label: '\u2014 unit \u2014' },
  { value: 'g', label: 'Weight (g)' },
  { value: 'mL', label: 'Volume (mL)' },
  { value: 'qty', label: 'Counted (each)' }
];

/* What a shopping unit is CALLED, as against what is stored. 'qty' is the stored value
   for 120 of the seeded ingredients and means "each"; displayUnit already blanks it for
   the shopping list, and a unit that was never set has always been treated as counted.
   One rule, so the picker, the recipe editor and the staples row cannot drift apart —
   they used to be three separate opinions, and one of them didn't exist. */
function unitLabel(u){
  const v = (u || '').trim();
  return v === '' ? 'each' : (displayUnit(v) || 'each');
}

// What to label the amount box with in Settings. 'qty' means "each", which reads
// better than the raw token beside a number someone is about to type.
function stapleUnitLabel(name){
  const meta = findIngredientMeta(name);
  return unitLabel(meta && meta.shoppingUnit);
}

function featureOn(name){
  return !!(recipesData && recipesData.settings && recipesData.settings.features && recipesData.settings.features[name]);
}

function isUnsetCategory(v){ return !v || v === 'Other'; }
function isUnsetAisle(v){ return !v || v === 'Uncategorised'; }

function migrateIngredientsIfStale(data, seed){
  const seedVersion = (seed.meta && seed.meta.version) || 1;
  const dataVersion = (data.meta && data.meta.version) || 0;
  // The fill-unset pass below now runs on EVERY load (it only ever fills fields that
  // are blank/default, so deliberate edits are never overwritten). Restores things
  // like shopping units — which drive the cup/TBsp/tsp measure options — if a stale
  // overwrite from another device ever stripped them. Adding brand-new seed
  // ingredients stays version-gated, so deliberately deleted ingredients don't
  // resurrect on every page load.
  const isVersionBump = dataVersion < seedVersion;
  // Repair pass: any master ingredient that ended up with a kitchen measure as its
  // shopping unit (a pre-17.3 bug when adding new ingredients) is switched to mL,
  // which unlocks the cup/TBsp/tsp dropdown for it again.
  (data.ingredients || []).forEach(mi => {
    if(kitchenMeasureCanon(mi.shoppingUnit)) mi.shoppingUnit = 'mL';
  });
  const seedByName = {};
  seed.ingredients.forEach(si => { seedByName[si.name.trim().toLowerCase()] = si; });
  const seenNames = new Set();
  data.ingredients = (data.ingredients || []).map(existing => {
    const match = seedByName[(existing.name||'').trim().toLowerCase()];
    seenNames.add((existing.name||'').trim().toLowerCase());
    if(!match) return existing;
    // Only pull in the seed's category/aisle/unit where the existing entry is still
    // unset (default "Other"/"Uncategorised"/blank). A category someone has deliberately
    // set — whether that was us shipping a fix earlier, or the user editing it by hand
    // in the ingredient list — is never silently overwritten by a later version bump.
    const patch = {};
    if(isUnsetCategory(existing.shoppingCategory)) patch.shoppingCategory = match.shoppingCategory;
    if(isUnsetAisle(existing.aisle)) patch.aisle = match.aisle;
    if(!existing.shoppingUnit) patch.shoppingUnit = match.shoppingUnit;
    if(existing.servingSize == null) patch.servingSize = match.servingSize;
    if(existing.kjPerServe == null) patch.kjPerServe = match.kjPerServe;
    if(existing.needed == null) patch.needed = match.needed;
    return Object.assign({}, existing, patch);
  });
  if(isVersionBump){
    seed.ingredients.forEach(si => {
      const key = si.name.trim().toLowerCase();
      if(!seenNames.has(key)){ data.ingredients.push(Object.assign({}, si)); seenNames.add(key); }
    });
    data.meta = Object.assign({}, data.meta, { version: seedVersion });
  }
  migrateCookedStamps(data);
  return ensureSettings(data);
}

/* Every lastCooked written before v22.0 was set by generateShoppingList, so what it
   actually recorded was "this went on a list" — a plan, not a meal. Copy those stamps
   across to lastPlanned, where they are true, and leave lastCooked alone so nothing a
   family can already see on screen changes on the day they update. From here on the two
   fields diverge honestly: only the Menu tab's tick writes lastCooked.
   Runs once — the marker is on data.meta, not on each recipe, so it costs one field. */
function migrateCookedStamps(data){
  if(!data || !Array.isArray(data.recipes)) return data;
  if(data.meta && data.meta.cookedStampsSplit) return data;
  data.recipes.forEach(r=>{
    if(r.lastCooked && !r.lastPlanned) r.lastPlanned = r.lastCooked;
  });
  data.meta = Object.assign({}, data.meta, { cookedStampsSplit: true });
  return data;
}

function init(){
  const {seedRecipes, seedImages} = loadSeed();
  window.__fmaSeedRecipes = seedRecipes; // kept for later migrations (e.g. after folder load)
  const lsR = localStorage.getItem(LS_RECIPES);
  const lsS = localStorage.getItem(LS_SHOPPING);
  recipesData = lsR ? JSON.parse(lsR) : seedRecipes;
  recipesData = migrateIngredientsIfStale(recipesData, seedRecipes);
  imagesData = seedImages || {};
  shoppingData = lsS ? JSON.parse(lsS) : defaultShoppingData();
  backfillAuthoredStamps(shoppingData);   // freeze legacy creation times before anything saves
  // Pick the horizon back up from the saved copy — this is the point of persisting it.
  shoppingSeenRemoteAt = shoppingData.seenRemoteAt || null;
  saveRecipesLocal();
  if(!lsS){ saveShoppingLocal(); }
  loadUiState(); // restore the tab/toggles before the first render
  bindNav();
  bindHeaderButtons();
  // If OneDrive sync is active, it is the ONLY sync source. Running the old desktop
  // folder link at the same time creates a startup race (two async loads, last one
  // wins) that can silently push stale folder data up into the shared OneDrive copy.
  if(localStorage.getItem(LS_ONEDRIVE_FLAG) === '1'){
    initMsal();
  } else {
    tryReconnectFolder();
    initMsal();
  }
  render();
  /* "Working from this device's local copy" was said in green whether or not the device
     had anywhere to sync to. On a connected phone OneDrive overwrites it seconds later;
     on an unconnected one it just sits there looking like good news. Same sentence, two
     opposite meanings, told apart only by waiting. */
  const backend = syncBackend();
  setStatus('Loaded ' + recipesData.recipes.length + ' recipes (app ' + APP_VERSION + '). '
    + (backend ? 'Checking the family folder…'
              : 'Not connected — anything you add stays on this phone.'),
    backend ? 'ok' : 'warn');
  renderSyncAlert();
  // One shot once startup has had its chance, so an unconnected phone is told without
  // having to wait for the 60-second sweep.
  setTimeout(renderSyncAlert, SYNC_UNLINKED_GRACE_MS + 500);
}

// A failed local save must never abort whatever the user was doing. Report it
// and carry on — OneDrive/folder sync may still be working.
function saveRecipesLocal(){
  try{ localStorage.setItem(LS_RECIPES, JSON.stringify(recipesData)); }
  catch(e){ storageBlockedReason = 'Could not save locally (' + ((e && e.message) || e) + ').'; setStatus(storageBlockedReason, 'warn'); }
}
function saveShoppingLocal(){
  shoppingData.lastUpdated = new Date().toISOString();
  /* v23.0: the knowledge horizon travels WITH the copy. This is how far into the shared
     folder's history this device had read when it wrote this file, and it is the only
     thing that lets a merge tell "you added that while I was away" from "I deleted it
     while you were away". It lived in memory until now and was lost on every reload,
     which is why every release since v21.8 had to invent another tiebreaker to guess
     around it. Additive: an older build ignores the field and is read as having seen
     nothing, which keeps its items rather than dropping them. */
  shoppingData.seenRemoteAt = shoppingSeenRemoteAt || shoppingData.seenRemoteAt || null;
  try{ localStorage.setItem(LS_SHOPPING, JSON.stringify(shoppingData)); }
  catch(e){ storageBlockedReason = 'Could not save locally (' + ((e && e.message) || e) + ').'; setStatus(storageBlockedReason, 'warn'); }
}

/* `which` is 'recipes', 'shopping', or omitted for both. v21.2 threads it all the way
   through to the remote writers. Until now every save pushed BOTH files, so each tick
   in the trolley re-uploaded the entire ~1MB recipe database over mobile data — slow,
   expensive, and it widened every sync race by keeping a long write in flight. */
function persist(which){
  if(which !== 'shopping') saveRecipesLocal();
  if(which !== 'recipes') saveShoppingLocal();
  if(localStorage.getItem(LS_ONEDRIVE_FLAG) !== '1') autoSaveToFolder(which);
  if(localStorage.getItem(LS_ONEDRIVE_FLAG) === '1') markSyncPending();
  autoSaveToOneDrive(which);
}

function setStatus(msg, cls){
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar' + (cls ? ' ' + cls : '');
}

/* ---- v20: sticky sync-failure banner ----
   Deliberately NOT cleared by a successful read. When the owning OneDrive account is
   full, every GET still returns 200 and only the PUTs bounce, so clearing on reads is
   exactly how a dead sync goes on looking healthy. */
function writeErrorMessage(status, name){
  switch(status){
    case 507: return ['The OneDrive account holding the FridgeList folder is full.',
                      'Nothing is being saved. Free up space on that account (start with its recycle bin — deleted files count against the quota for 30 days), then try again.'];
    case 403: return ['This account cannot write to the shared FridgeList folder.',
                      'The folder is shared read-only, or the share was changed. The owner needs to re-share it with edit permission.'];
    case 401: return ['OneDrive sign-in has expired.',
                      'Open Sync options and sign in again.'];
    case 404: return ['The FridgeList folder or ' + (name||'a data file') + ' could not be found.',
                      'It may have been moved or renamed in OneDrive. Check Sync options.'];
    case 412: return ['Another device changed ' + (name||'this file') + ' at the same time.',
                      'Nothing was overwritten. Your copy is safe on this device — reopen the app once the other device has finished, or make the change there instead.'];
    case 429:
    case 503:
    case 509: return ['OneDrive is busy and refused the save.',
                      'This usually clears by itself — the app will keep retrying.'];
    default:  return ['Could not save to OneDrive (HTTP ' + status + ').',
                      'Your changes are safe on this device but are not reaching the other devices.'];
  }
}

/* What this device is CONFIGURED to sync through — not the same question as whether it
   has managed to reach it. A folder handle resolves asynchronously at startup, so the
   stored flag is what separates "never set up" from "still connecting". */
function syncBackend(){
  if(localStorage.getItem(LS_ONEDRIVE_FLAG) === '1') return 'onedrive';
  if(dirHandle || localStorage.getItem(LS_HANDLE_FLAG) === '1') return 'folder';
  return null;
}

/* Pure. Reads only what it is handed, so the wording — which is the entire feature here —
   can be asserted without a browser.

   v22.2. Until now this banner had two cases, a failed write and changes pending too
   long, and the pending one runs off syncPendingSince, which persist() sets only when
   the OneDrive flag is on. So a phone that had never signed in never set the flag, never
   marked anything pending, and got no warning at all — ever. The one device that most
   needed telling was the only one that could not be told, which is how two people spent
   an evening picking a week that reached nobody. */
function syncAlertState(s){
  const now = s.now || Date.now();
  if(s.lastWriteError) return { kind: 'error', writeError: s.lastWriteError };

  /* v23.6. Above every other case except a failed write, and on every tab, because this
     is the one thing the app knows that the family cannot possibly work out for
     themselves: somebody's list is being discarded right now. It was previously said once
     in a status line that scrolls away — see mergeReport — which is not the same as being
     told. A device that is not connected at all cannot have this, so the ordering costs
     the cases below nothing. */
  if(s.tripConflict){
    return { kind: 'conflict',
             head: 'Two phones have different shopping lists.',
             hint: s.tripConflict.iWon
               ? 'This phone\u2019s list won, so the other one \u2014 which has work on it \u2014 '
                 + 'is being dropped everywhere. Decide which one the family is using.'
               : 'The other phone\u2019s list won, so the one you had \u2014 with your work on it \u2014 '
                 + 'has been replaced. It is kept until this page is closed.',
             action: 'Sort this out',
             actionKind: 'review' };
  }

  // Don't accuse a device that is still starting up.
  const settled = (now - (s.startedAt || 0)) > (s.graceMs || SYNC_UNLINKED_GRACE_MS);
  const consequence = 'Anything you add here stays on this phone. Nobody else will see it, '
                    + 'and what they add will not reach you.';
  if(settled && !s.backend){
    return { kind: 'unlinked',
             head: 'This phone is not connected to the family’s list.',
             hint: consequence,
             last: lastContactText(s.seenRemoteAt, now),
             action: 'Connect this phone' };
  }
  if(settled && s.backend === 'onedrive' && !s.signedIn){
    return { kind: 'signedout',
             head: 'OneDrive sign-in has expired on this phone.',
             hint: consequence,
             last: lastContactText(s.seenRemoteAt, now),
             action: 'Sign in again' };
  }
  if(s.pendingSince && (now - s.pendingSince) > (s.staleMs || SYNC_STALE_MS)){
    const mins = Math.round((now - s.pendingSince)/60000);
    return { kind: 'pending',
             head: 'Changes have not reached OneDrive for ' + mins + ' minutes.',
             hint: 'They are saved on this device. Other devices will not see them yet.' };
  }
  return null;
}

/* ---- v23.7: where this list stands, in one sentence ----

   The shared file is the list; a phone holds a cache. There are four ways that cache can
   be wrong and they used to be scattered — two of them in cards on the Review tab, one in
   the sync banner, one nowhere at all — so nobody could look in a single place and know.
   This decides between them in priority order and hands back one sentence and at most one
   button.

   `behind` outranks the rest because acting on anything else from a stale base is exactly
   how the two-trip fork happened: rebuilding a list from picks you have not caught up on
   is what mints a rival trip.

   Pure, like syncAlertState, and for the same reason — the wording IS the feature here,
   so it has to be assertable without a browser. */
const FRESHNESS_GRACE_MS = 45*1000;      // under this the 5s poll fixes it; a warning would be noise
const FRESHNESS_UNREACHABLE_MS = 2*60*1000; // ...and nothing has got through for this long
const FRESHNESS_MIN_FAILURES = 3;         // consecutive failed reads before saying so

function listFreshness(s){
  const now = s.now || Date.now();
  const grace = s.graceMs || FRESHNESS_GRACE_MS;
  const unreachableMs = s.unreachableMs || FRESHNESS_UNREACHABLE_MS;
  const minFailures = s.minFailures || FRESHNESS_MIN_FAILURES;
  const shared = !!s.backend && s.signedIn !== false;

  if(shared && s.behindSince && (now - s.behindSince) > grace){
    return { kind: 'behind',
             head: 'This is not the family’s latest list.',
             hint: 'The shared copy changed ' + agoText(now - s.behindSince)
                   + ' and this phone has not read it yet. Catch up before changing anything, '
                   + 'or you may end up building a second list.',
             action: 'Catch up now' };
  }
  /* Both conditions, deliberately. The failure count rules out a single blip; the elapsed
     time rules out three fast retries inside one bad second. Neither alone is enough to
     put red in front of somebody in a shop. */
  if(shared && (s.checkFailures || 0) >= minFailures
     && s.lastCheckedAt && (now - s.lastCheckedAt) > unreachableMs){
    return { kind: 'unreachable',
             head: 'Can’t reach the family’s list.',
             hint: 'This phone last managed it ' + agoText(now - s.lastCheckedAt)
                   + '. Anything anyone else has added or ticked off since then is not on '
                   + 'here, and nothing you tick is reaching them.',
             action: 'Try again' };
  }
  if(s.shopLive && s.picksChanged && !s.keepsTicks){
    return { kind: 'frozen',
             head: 'The week’s recipes were changed somewhere else.',
             hint: 'This list is left exactly as it is while you are shopping from it. Tap '
                   + '“Shopping is done” when you have finished, and the new recipes will '
                   + 'be used for the next list.' };
  }
  if(s.picksChanged){
    return { kind: 'picks',
             head: s.recipesChanged
               ? 'The week’s recipes have changed since this list was made.'
               : 'There is something new to add to this list.',
             hint: s.keepsTicks
               ? (s.recipesChanged
                   ? 'Updating adds what the new recipes need and keeps everything already ticked off.'
                   : 'A staple amount has changed. Updating brings it onto this list and '
                     + 'keeps everything already ticked off.')
