        shoppingData.weekPlan.selections = shoppingData.weekPlan.selections.filter(x=>x.recipeId!==sel.recipeId);
        shoppingData.weekPlan.selectionsRemoved = noteRemoved(

      });

    grid.innerHTML='';
    const q = searchInput.value.trim().toLowerCase();
    const cat = catSelect.value;
    const list = recipesData.recipes.filter(r=>{
      if(cat && r.category !== cat) return false;
      if(q && !r.name.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=>a.name.localeCompare(b.name));
    list.forEach(r=>{
      const card = el('div',{class:'recipe-card'});
      card.style.cursor='default';
      const selected = isSelected(r.id);
      const sel = shoppingData.weekPlan.selections.find(s=>s.recipeId===r.id);
      const cb = el('input',{type:'checkbox'});
      cb.checked = selected;
      cb.disabled = shopping;
      const servInput = el('input',{type:'number', class:'qty-input', min:'1', value: (sel?sel.servings:defaultShoppingServings(r))||4, style:'width:60px;margin-left:8px;'});
      servInput.disabled = shopping || !selected;
      cb.addEventListener('change', ()=>{
        if(cb.checked){
          shoppingData.weekPlan.selections.push(newSelection(r.id, parseInt(servInput.value,10)||defaultShoppingServings(r)));
        } else {
          shoppingData.weekPlan.selections = shoppingData.weekPlan.selections.filter(s=>s.recipeId!==r.id);
          shoppingData.weekPlan.selectionsRemoved = noteRemoved(
            shoppingData.weekPlan.selectionsRemoved, [r.id], new Date().toISOString());
        }
        persist('shopping');
        servInput.disabled = shopping || !cb.checked;
        updateCountLabel();
        drawPicked();
      });
      servInput.addEventListener('change', ()=>{
        const s = shoppingData.weekPlan.selections.find(s=>s.recipeId===r.id);
        if(s){ s.servings = parseInt(servInput.value,10)||r.servings||4; s.changedAt = new Date().toISOString(); persist('shopping'); drawPicked(); }
      });
      const top = el('div',{class:'row'},[cb, el('span',{},['serves']), servInput]);
      card.appendChild(el('h3',{},[r.name]));
      card.appendChild(el('div',{class:'muted'},[r.category||'Uncategorised']));
      card.appendChild(top);
      grid.appendChild(card);
    });
  }
  searchInput.addEventListener('input', draw);
  catSelect.addEventListener('change', draw);
  draw();
  drawPicked();

  const footer = el('div',{class:'row', style:'margin-top:16px;'});
  // (The old "Generate shopping list" button lived here — removed as redundant, since
  // the Review Shopping List tab generates/refreshes the list automatically on entry.)
  countLabelEl = el('div',{class:'muted'},[shoppingData.weekPlan.selections.length + ' recipe(s) selected']);
  footer.appendChild(countLabelEl);
  container.appendChild(footer);
  return container;
}

/* ---- Review Shopping List tab ---- */

/* v21.3: show each ingredient in the unit it's ordinarily called by.
   'qty' is the ingredient master's way of recording "each" — 120 of the 446
   ingredients use it — and printing it literally gave "1 qty Banana", "12 qty Eggs".
   Nobody says that; the ordinary way to say it is just the number. Real units (g, mL)
   ARE how those ingredients are ordinarily called, so they print exactly as before.
   This only affects how a quantity is displayed — nothing is stored or converted, so
   the ingredient master and the recipe editor are untouched. */
const COUNT_UNITS = ['qty', 'each', 'ea', 'count', 'pc', 'pcs'];
function displayUnit(unit){
  const u = (unit || '').trim();
  return COUNT_UNITS.indexOf(u.toLowerCase()) === -1 ? u : '';
}

/* v21.4: once an amount reaches a kilo or a litre, show it in the larger unit —
   "2.125 L" reads better on a list than "2125 mL". Exact by instruction: no rounding,
   so 1250 g is 1.25 kg and 1001 g is 1.001 kg, not "1 kg". */
const UNIT_ROLLUP = { g: { to: 'kg', per: 1000 }, ml: { to: 'L', per: 1000 } };

function rollUpQty(n, unit){
  const r = UNIT_ROLLUP[(unit || '').trim().toLowerCase()];
  if(!r || !(n >= r.per)) return null;
  return { qty: n / r.per, unit: r.to };
}

/* Exact decimal with trailing zeros trimmed. The toFixed only clears floating-point
   noise from the division — a millionth of a kilo is a milligram — it is not a rounding
   step at any scale a shopping list can see. fmtQty is NOT used here: it rounds to two
   decimals, which would turn 1001 g into "1 kg". */
function fmtExactQty(n){
  return Number(n.toFixed(6)).toString();
}

// The quantity column for one shopping line: the summed recipe amount, plus any
// free-text amounts (staple quantities, non-numeric recipe quantities) after a "+".
function lineQtyText(line){
  let t = '';
  if(line.hasNumeric){
    const rolled = rollUpQty(line.totalQty, line.unit);
    if(rolled){
      t = fmtExactQty(rolled.qty) + ' ' + rolled.unit;
    } else {
      const u = displayUnit(line.unit);
      t = fmtQty(line.totalQty) + (u ? ' ' + u : '');
    }
  }
  if(line.textQtyParts && line.textQtyParts.length) t += (t ? ' + ' : '') + line.textQtyParts.join(', ');
  return t;
}

function ingredientLabelText(line){
  const qtyText = lineQtyText(line);
  const countBadge = (line.sources && line.sources.length) ? ' (' + line.sources.length + ')' : '';
  const fridgeBadge = line.fromFridgeList ? ' (Wait list)' : '';
  const stapleBadge = line.fromStaples ? ' (Staple)' : '';
  return (qtyText?qtyText+' ':'') + line.ingredientName + countBadge + fridgeBadge + stapleBadge;
}

function generateNowButton(label){
  const btn = el('button',{class:'btn'},[label || 'Generate shopping list now']);
  btn.addEventListener('click', ()=>{ generateShoppingList(); render(); });
  return btn;
}

/* The strip itself. The resting case is one muted line; anything wrong is a notice card
   with the one button that fixes it. Kept in a fixed container so the 5s poll can rewrite
   the text without repainting the tab — the same reason updateShopProgress exists. */
function freshnessNow(picks){
  return listFreshness({
    backend: syncBackend(),
    signedIn: syncBackend() === 'onedrive' ? !!msalAccount : true,
    behindSince: shoppingBehindSince,
    lastCheckedAt: shoppingLastCheckedAt,
    checkFailures: shoppingCheckFailures,
    picksChanged: !!(picks && picks.picksChanged),
    keepsTicks: !!(picks && picks.keepsTicks),
    recipesChanged: !!(picks && picks.recipesChanged),
    shopLive: shoppingInProgress(),
    now: Date.now()
  });
}

/* v23.8: returns null when there is nothing wrong, and the caller appends nothing at all.
   The two sync cases get red, the two picks cases amber — see .alert-card. */
function renderListFreshness(picks){
  const st = freshnessNow(picks);
  if(!st) return null;
  const isSync = st.kind === 'behind' || st.kind === 'unreachable';
  const box = el('div',{id:'listFreshness', class:'card ' + (isSync ? 'alert-card' : 'notice-card')});
  box.dataset.kind = st.kind;
  box.appendChild(el('p',{style:'margin-top:0;'},[el('strong',{},[st.head])]));
  box.appendChild(el('p',{class:'muted', style: st.action ? '' : 'margin-bottom:0;'},[st.hint]));
  if(isSync){
    const btn = el('button',{class:'btn'},[st.action]);
    // force: the unchanged-stamp shortcut is exactly what a person tapping this wants past.
    btn.addEventListener('click', ()=>{ pollShoppingNow(true); });
    box.appendChild(btn);
  } else if(st.action){
    box.appendChild(generateNowButton(st.action));
  }
  return box;
}

/* Called by the 5s poll. v23.7 kept a resting line's text fresh in place; there is no
   resting line now, so all this has to notice is one of the two SYNC strips appearing or
   disappearing. Kinds are sticky, so it repaints once on a transition rather than every
   five seconds — through repaintWhenSafe, because swapping a button out from under a
   thumb is the class of bug that function exists to prevent.

   Deliberately blind to the picks cases: those cannot change without something else having
   already caused a render, and a picks card on screen is not this function's to remove. */
function updateListFreshness(){
  const box = document.getElementById('listFreshness');
  const syncKind = k => k === 'behind' || k === 'unreachable';
  const st = freshnessNow(null);
  const showing = box && syncKind(box.dataset.kind) ? box.dataset.kind : null;
  const wanted = st && syncKind(st.kind) ? st.kind : null;
  if(showing !== wanted) repaintWhenSafe();
}

// Updates the counter and bar in place after a tick, so the progress display stays
// honest without paying for a full re-render.
function updateShopProgress(){
  const bar = document.querySelector('.shop-toolbar');
  if(!bar || !shoppingData) return;
  const active = shoppingData.shoppingList.filter(l=>!l.removed && !l.atHome);
  const done = active.filter(l=>l.checked).length;
  const strong = bar.querySelector('.shop-progress strong');
  const fill = bar.querySelector('.progress-fill');
  if(strong) strong.textContent = done + ' of ' + active.length + ' in the trolley';
  if(fill) fill.style.width = (active.length ? Math.round(done/active.length*100) : 0) + '%';
}

function renderReviewTab(){
  const container = el('div',{class:'no-print'});
  if(shoppingData.weekPlan.selections.length===0){
    container.appendChild(el('div',{class:'empty-state'},['No recipes picked yet. Go to "Start New Shopping List" first.']));
    return container;
  }
  /* The two lists, and the choice between them.

     v21.8 kept the displaced list so it could be put back. v23.6 keeps whichever list
     lost — including when it is the OTHER phone's and this one won, which until now was
     invisible here — and turns the card into the place a disagreement gets settled rather
     than merely noticed.

     v21.9 removed a prompt like this because "asked to choose between two lists, nobody
     knew which was which". That was true, and it is the reason this card describes each
     list by what is actually ON it — when it was made, how much is ticked, how much was
     pruned — instead of asking people to tell two identical things apart. Both buttons
     now WRITE: keeping a list is as deliberate as putting one back, and a decision that
     does not supersede the other trip is not a decision, it is a pause. */
  if(replacedTrip && tripIdOf(shoppingData) !== replacedTrip.tripId){
    const iWon = !!(tripDisagreement && tripDisagreement.iWon);
    const card = el('div',{class:'card notice-card'});
    card.appendChild(el('p',{style:'margin-top:0;'},[ el('strong',{},[ iWon
      ? 'Another phone has a different shopping list.'
      : 'The list you had been working on was replaced.' ])]));
    card.appendChild(el('p',{class:'muted', style:'margin-top:0;'},[ iWon
      ? 'This phone\u2019s list is the one on screen and is the one being used. The other '
        + 'one is kept until this page is closed \u2014 ' + lowerFirst(replacedTripSummary(replacedTrip)) + '.'
      : replacedTripSummary(replacedTrip) + ', and is kept until this page is closed \u2014 whether it was replaced here or from another phone.'
    ]));
    const backBtn = el('button',{class:'btn'},[ iWon
      ? 'Use the other phone\u2019s list instead' : 'Put back the list that was replaced' ]);
    backBtn.addEventListener('click', putBackReplacedList);
    card.appendChild(backBtn);
    const keepBtn = el('button',{class:'btn secondary', style:'margin-left:8px;'},['Keep this one']);
    keepBtn.addEventListener('click', keepThisList);
    card.appendChild(keepBtn);
    container.appendChild(card);
  }
  /* v23.6: opening this tab no longer builds anything. This block sits AFTER the card
     above on purpose — it can return early, and the one path that most needs the undo on
     screen (an import that landed on an empty list) is exactly the path that returns.

     The auto-refresh dated from v21.8 and had been fenced twice — once for a live trip,
     once for a device that had not read the folder yet — and both fences were patches on
     the same mistake. Opening a tab is not asking for a new list, and a list minted
     because somebody opened a tab is how two phones ended up holding two trips for what
     everyone thought was one shop. generateShoppingList now has exactly ONE caller,
     generateNowButton, and that is a tap. Do not add a second.

     What the tab does instead is say which state the list is in and what the button would
     cost, using the same sameTripRebuild() the rebuild itself will use, so the sentence
     and the outcome cannot disagree. */
  let listIsStale = shoppingListIsStale();
  let keepsTicks = sameTripRebuild();
  let recipesChanged =
    shoppingData.weekPlan.lastGeneratedRecipeSignature !== recipeSelectionsSignature();

  /* v23.7: the ONE exception, and the second and last caller of generateShoppingList.

     v23.6 removed the auto-refresh and took "grab shampoo too" with it — somebody at home
     adding to the Wait List no longer reached the person already in the aisle. That is
     the single automatic rebuild worth having, and it is the only one that is safe by
     construction rather than by a fence: every condition below has to hold, and together
     they mean the rebuild CANNOT mint a trip and CANNOT drop a tick.

       - the list is stale, so there is something to do at all
       - sameTripRebuild(), so the trip and every tick survive (also false once a shop is
         marked done, which is why a finished shop is not quietly restarted)
       - the recipe signature is unchanged, so this is not a week's picks arriving by the
         back door
       - a Wait List entry is genuinely missing from the list

     The general auto-refresh failed because it could do anything the button could do,
     including mint a trip on a phone that had not caught up. This can do exactly one
     thing. Do not widen it — a staple amount is edited by the person who then walks to
     this tab, and a tap costs them nothing. */
  const arrivedFromWaitList = (listIsStale && keepsTicks && !recipesChanged)
    ? pendingWaitListLines(shoppingData).map(n=> n.text)
    : [];
  if(arrivedFromWaitList.length){
    generateShoppingList();
    listIsStale = shoppingListIsStale();
    keepsTicks = sameTripRebuild();
    recipesChanged =
      shoppingData.weekPlan.lastGeneratedRecipeSignature !== recipeSelectionsSignature();
    /* Say what arrived. Something appearing on a list under a shopper's thumb with no
       explanation is the v21.5 failure wearing a different coat. */
    const note = el('div',{class:'card'});
    note.appendChild(el('p',{class:'muted', style:'margin:0;'},[
      'Added from the Wait List: ' + arrivedFromWaitList.join(', ') + '.'
    ]));
    container.appendChild(note);
  }

  /* v23.7: one strip, all four ways this list can be wrong. Until now "you are behind the
     shared copy" was said nowhere, "the picks changed" and "the week is frozen" were two
     separate cards here, and "this phone is not sharing at all" was only in the banner —
     so there was no single place to look to know where you stood. listFreshness ranks
     them; this renders whichever won. */
  /* An empty list is "stale" by shoppingListIsStale's reckoning, but the card below says
     it better and carries the same button. Two buttons offering the same thing in
     different words is the v21.8 confusion in miniature, so the strip stays quiet about
     the picks here and reports only how current this phone's copy is. */
  const noListYet = !(shoppingData.shoppingList || []).length
                    && !shoppingData.weekPlan.shoppingDoneAt;
  const freshness = renderListFreshness({
    picksChanged: listIsStale && !noListYet, keepsTicks: keepsTicks, recipesChanged: recipesChanged
  });
  if(freshness) container.appendChild(freshness);

  if(noListYet){
    const card = el('div',{class:'card'});
    card.appendChild(el('h4',{style:'margin-top:0;'},['No shopping list yet']));
    card.appendChild(el('p',{class:'muted'},[
      'The week’s recipes are picked. Nothing is built until you ask — so two phones '
      + 'cannot quietly end up with a list each.'
    ]));
    card.appendChild(generateNowButton('Make the shopping list'));
    container.appendChild(card);
    return container;
  }

  // Print just the shopping list, straight from here. The printable layout is rendered
  // hidden alongside the screen list; printSection('shopping') reveals only it.
  const printRow = el('div',{class:'row', style:'margin-bottom:12px;'});
  const printBtn = el('button',{class:'btn'},['Print shopping list']);
  printBtn.addEventListener('click', ()=> printSection('shopping'));
  printRow.appendChild(printBtn);
  if(shoppingData.shoppingList && shoppingData.shoppingList.length){
    const doneBtn = el('button',{class:'btn secondary'},['Shopping is done']);
    doneBtn.addEventListener('click', finishShopping);
    printRow.appendChild(doneBtn);
  }
  container.appendChild(printRow);

  /* ---- v20 trolley toolbar: progress, hide-ticked, keep-screen-on ----
     Sticky, so it stays reachable partway down a long list. */
  (function(){
    const allActive = shoppingData.shoppingList.filter(l=>!l.removed && !l.atHome);
    const doneCount = allActive.filter(l=>l.checked).length;
    const bar = el('div',{class:'card shop-toolbar'});
    const head = el('div',{class:'shop-progress'});
    head.appendChild(el('strong',{},[doneCount + ' of ' + allActive.length + ' in the trolley']));
    const track = el('div',{class:'progress-track'});
    const fill = el('div',{class:'progress-fill'});
    fill.style.width = (allActive.length ? Math.round(doneCount/allActive.length*100) : 0) + '%';
    track.appendChild(fill);
    head.appendChild(track);
    bar.appendChild(head);

    const opts = el('div',{class:'row shop-toggles'});
    const hideWrap = el('label',{class:'toggle'});
    const hideCb = el('input',{type:'checkbox'});
    hideCb.checked = hideTickedItems;
    hideCb.addEventListener('change', ()=>{ hideTickedItems = hideCb.checked; saveUiState(); rerenderPreservingScroll(); });
    hideWrap.appendChild(hideCb);
    hideWrap.appendChild(document.createTextNode('Hide ticked'));
    opts.appendChild(hideWrap);

    // The shopping list is the screen you stare at for 45 minutes; until now the wake
    // lock was only offered inside the recipe viewer.
    if('wakeLock' in navigator){
      const wakeWrap = el('label',{class:'toggle'});
      const wakeCb = el('input',{type:'checkbox'});
      wakeCb.checked = shopKeepAwake;
      wakeCb.addEventListener('change', async ()=>{
        shopKeepAwake = wakeCb.checked;
        if(shopKeepAwake){
          wakeLockWanted = true;
          const ok = await acquireWakeLock();
          if(!ok){ shopKeepAwake = false; wakeCb.checked = false; wakeLockWanted = false; }
        } else {
          releaseWakeLock();
        }
        saveUiState();
      });
      wakeWrap.appendChild(wakeCb);
      wakeWrap.appendChild(document.createTextNode('Keep screen on'));
      opts.appendChild(wakeWrap);
    }
    bar.appendChild(opts);
    container.appendChild(bar);
  })();
  // closeModal() releases the lock, so re-assert it whenever this tab redraws.
  if(shopKeepAwake && !screenWakeLock){ wakeLockWanted = true; acquireWakeLock(); }

  // Completed trip: the list is empty by design until a new one is generated.
  if(shoppingData.weekPlan.shoppingDoneAt && (!shoppingData.shoppingList || !shoppingData.shoppingList.length)){
    const when = new Date(shoppingData.weekPlan.shoppingDoneAt);
    const card = el('div',{class:'card'});
    card.appendChild(el('h4',{style:'margin-top:0;'},['Shopping done — ' + when.toLocaleDateString() + ' ' + when.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})]));
    card.appendChild(el('p',{},['The list has been cleared. Your menu list and recipe picks are untouched, along with any Wait List item you did not tick off.']));
    card.appendChild(generateNowButton('Start a new shopping list from the current picks'));
    container.appendChild(card);
    const outerDone = el('div',{});
    outerDone.appendChild(container);
    return outerDone;
  }

  container.appendChild(el('div',{class:'card'},[
    el('p',{},['Tick items off as you put them in the trolley — they’ll show struck through. The bracketed number is how many recipes this week call for that ingredient, as a steer on quantity. Use ✕ to drop something you don’t need at all; add a one-off extra below.'])
  ]));

  const addRow = el('div',{class:'row', style:'margin-bottom:14px;'});
  const addInput = el('input',{type:'text', placeholder:'Add an extra item to this week’s list…'});
  const addBtn = el('button',{class:'btn secondary'},['Add']);
  addBtn.addEventListener('click', ()=>{
    const v = addInput.value.trim();
    if(!v) return;
    // Stamped on creation so the union merge keeps it: an extra added by one shopper
    // used to be dropped if the other phone's save happened to land second.
    shoppingData.shoppingList.push({key:'manual-'+Date.now(), ingredientName:v, unit:'', aisle:'Other', shoppingCategory:'Other', totalQty:0, hasNumeric:false, textQtyParts:[], sources:[], removed:false, checked:false, source:'manual', changedAt:new Date().toISOString(), changedBy:deviceId()});
    addInput.value='';
    persist('shopping'); rerenderPreservingScroll();
  });
  addRow.appendChild(addInput); addRow.appendChild(addBtn);
  container.appendChild(addRow);

  const visibleLines = shoppingData.shoppingList.filter(l=>!l.removed && !l.atHome);
  const removedLines = shoppingData.shoppingList.filter(l=>l.removed);
  const atHomeLines = shoppingData.shoppingList.filter(l=>l.atHome && !l.removed);

  // v20: "Hide ticked" only affects what is drawn — nothing is mutated, so unticking
  // from the print view or another device still brings the line straight back.
  const shownLines = hideTickedItems ? visibleLines.filter(l=>!l.checked) : visibleLines;
  const groups = {};
  shownLines.forEach(line=>{ (groups[line.aisle||'Other'] = groups[line.aisle||'Other']||[]).push(line); });
  const aisleCategory = {};
  shownLines.forEach(line=>{ aisleCategory[line.aisle||'Other'] = line.shoppingCategory || 'Other'; });
  Object.keys(groups).sort((a,b)=>
    catSortIndex(aisleCategory[a]) - catSortIndex(aisleCategory[b]) || a.localeCompare(b)
  ).forEach(aisle=>{
    const g = el('div',{class:'aisle-group card'});
    g.appendChild(el('h4',{},[aisle]));
    groups[aisle].forEach(line=>{
      /* v20 row layout. The whole name area is one ~52px tap target that toggles the
         tick; the destructive controls sit past the label so a mis-tap lands on text.
         Ticking still mutates in place — no re-render, no scroll jump.
         v21: resolve the line by its merge key at tap time. A sync landing between the
         draw and the tap replaces the object this row was built from, and mutating that
         stale copy is exactly how a tick used to vanish. */
      const lineKey = lineMergeKey(line);
      const row = el('div',{class:'shop-row' + (line.checked?' ticked':'')});
      const tap = el('label',{class:'shop-tap'});
      const cb = el('input',{type:'checkbox'});
      cb.checked = !!line.checked;
      cb.addEventListener('change', ()=>{
        const live = findShoppingLine(lineKey);
        if(!live){ rerenderPreservingScroll(); return; }
        live.checked = cb.checked;
        stampLine(live, 'checked');
        syncNeededFromLine(live, cb.checked);
        persist('shopping');
        row.classList.toggle('ticked', live.checked);
        if(hideTickedItems && live.checked) rerenderPreservingScroll();
        else updateShopProgress();
      });
      const nameWrap = el('div',{});
      nameWrap.appendChild(el('span',{class:'shop-name'},[ingredientLabelText(line)]));
      if(line.sources && line.sources.length){
        nameWrap.appendChild(el('span',{class:'shop-sources'},['for ' + line.sources.join(', ')]));
      }
      tap.appendChild(cb);
      tap.appendChild(nameWrap);
      row.appendChild(tap);

      const acts = el('div',{class:'shop-acts'});
      if(featureOn('pantryAtHome')){
        const homeBtn = el('button',{class:'btn tap secondary', title:'Already have this at home'},['At home']);
        homeBtn.addEventListener('click', ()=>{
          const live = findShoppingLine(lineKey);
          if(live){ live.atHome = true; stampLine(live, 'atHome'); persist('shopping'); }
          rerenderPreservingScroll();
        });
        acts.appendChild(homeBtn);
      }
      const rm = el('button',{class:'btn tap danger', title:'Not needed this week'},['✕']);
      rm.addEventListener('click', ()=>{
        const live = findShoppingLine(lineKey);
        if(live){ live.removed = true; stampLine(live, 'removed'); persist('shopping'); }
        rerenderPreservingScroll();
      });
      acts.appendChild(rm);
      row.appendChild(acts);
      g.appendChild(row);
    });
    container.appendChild(g);
  });

  if(atHomeLines.length){
    const hcard = el('div',{class:'card'});
    hcard.appendChild(el('h4',{},['At home already (' + atHomeLines.length + ') — tap "Need it" if you\u2019re out']));
    atHomeLines.forEach(line=>{
      const row = el('div',{class:'checkbox-row'});
      row.appendChild(el('label',{class:'muted'},[ingredientLabelText(line)]));
      const needKey = lineMergeKey(line);
      const needBtn = el('button',{class:'btn tap'},['Need it']);
      needBtn.addEventListener('click', ()=>{
        const live = findShoppingLine(needKey);
        if(live){ live.atHome = false; stampLine(live, 'atHome'); persist('shopping'); }
        rerenderPreservingScroll();
      });
      row.appendChild(needBtn);
      hcard.appendChild(row);
    });
    container.appendChild(hcard);
  }

  if(removedLines.length){
    const rcard = el('div',{class:'card'});
    rcard.appendChild(el('h4',{},['Not needed this week (' + removedLines.length + ')']));
    removedLines.forEach(line=>{
      const row = el('div',{class:'checkbox-row'});
      row.appendChild(el('label',{class:'muted'},[line.ingredientName]));
      const restoreKey = lineMergeKey(line);
      const restore = el('button',{class:'btn tap secondary'},['Restore']);
      restore.addEventListener('click', ()=>{
        const live = findShoppingLine(restoreKey);
        if(live){ live.removed = false; stampLine(live, 'removed'); persist('shopping'); }
        rerenderPreservingScroll();
      });
      row.appendChild(restore);
      rcard.appendChild(row);
    });
    container.appendChild(rcard);
  }

  const outer = el('div',{});
  outer.appendChild(container);            // interactive content — hidden when printing
  outer.appendChild(buildShoppingPrintSection()); // print layout — hidden on screen
  return outer;
}

/* ---- Wait List tab ---- */
function knownRecipeCategories(){
  const seen = new Set();
  const cats = [];
  recipesData.recipes.forEach(r=>{
    const c = (r.category||'').trim();
    if(!c) return;
    const key = c.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    cats.push(c);
  });
  return cats.sort((a,b)=>a.localeCompare(b));
}

function knownIngredientAllNames(){
  const seen = new Set();
  const names = [];
  recipesData.ingredients.forEach(i=>{
    if(!i.name) return;
    const key = i.name.trim().toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    names.push(i.name);
  });
  return names.sort((a,b)=>a.localeCompare(b));
}

function knownIngredientNames(){
  const seen = new Set();
  const names = [];
  recipesData.ingredients.forEach(i=>{
    // only suggest ingredients with a real aisle/category — matching one of the
    // "Uncategorised (from wiki import)" entries wouldn't gain anything, since it
    // would land in the same fallback bucket as not matching at all.
    if(!i.name || !i.shoppingCategory || i.shoppingCategory === 'Other') return;
    const key = i.name.trim().toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    names.push(i.name);
  });
  return names.sort((a,b)=>a.localeCompare(b));
}

function renderNeededTab(){
  const container = el('div',{});
  container.appendChild(el('div',{class:'card'},[
    el('h3',{style:'margin-top:0;'},['The Wait List']),
    el('p',{},['The running list of things anyone in the house can pencil in the moment they notice you’re running low — just like writing it at the bottom of the menu sheet on the fridge. When you next generate a shopping list: anything here that matches a known ingredient (e.g. "onions") is folded into its normal aisle and tagged "(Wait list)"; anything that doesn’t match gets its own "Wait list" section at the end.'])
  ]));
  const addRow = el('div',{class:'row',style:'margin-bottom:4px;'});
  const datalistId = 'fridge-ingredient-suggestions';
  const datalist = el('datalist', {id: datalistId});
  knownIngredientNames().forEach(name=> datalist.appendChild(el('option',{value:name})));
  const input = el('input',{type:'text', placeholder:'Start typing — pick a suggestion, or add your own…', list: datalistId, autocomplete:'off'});
  const btn = el('button',{class:'btn'},['Add to wait list']);
  function add(){
    const v = input.value.trim();
    if(!v) return;
    shoppingData.neededList.push({id:'n'+Date.now()+Math.random().toString(36).slice(2,6), text:v, addedAt:new Date().toISOString(), done:false});
    input.value='';
    persist('shopping'); render();
  }
  btn.addEventListener('click', add);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') add(); });
  addRow.appendChild(input); addRow.appendChild(btn); addRow.appendChild(datalist);
  container.appendChild(addRow);
  container.appendChild(el('p',{class:'small-note', style:'margin-bottom:14px;'},['Suggestions are your known shopping-list ingredients, so picking one keeps it in its normal aisle. Typing something not on the list still adds it fine — it’ll get its own line at the end of the shopping list.']));

  const card = el('div',{class:'card'});
  if(shoppingData.neededList.length>0){
    const clearRow = el('div',{style:'margin-bottom:10px;'});
    const clearBtn = el('button',{class:'btn small danger'},['Clear wait list']);
    clearBtn.addEventListener('click', ()=>{
      if(!confirm('Clear the whole Wait List? This does not touch this week’s selected recipes.')) return;
      shoppingData.neededRemoved = noteRemoved(shoppingData.neededRemoved,
        shoppingData.neededList.map(n=> n.id), new Date().toISOString());
      shoppingData.neededList = [];
      persist('shopping'); render();
    });
    clearRow.appendChild(clearBtn);
    card.appendChild(clearRow);
  }
  const ul = el('ul',{class:'needed-list', style:'list-style:none;margin:0;padding:0;'});
  if(shoppingData.neededList.length===0) ul.appendChild(el('div',{class:'empty-state'},['Nothing on the list right now.']));
  shoppingData.neededList.slice().reverse().forEach(item=>{
    /* v23.5: shown as done only if it is done HERE. An entry ticked in the aisle on a
       phone whose trip lost the merge is not this device's shop, and striking it through
       was the visible half of the bug — see doneCountsHere. */
    const doneHere = doneCountsHere(item);
    const li = el('li',{class:doneHere?'done':''});
    const cb = el('input',{type:'checkbox'});
    cb.checked = doneHere;
    cb.addEventListener('change', ()=>{
      // Resolve by id at tap time — a sync may have replaced the entry object.
      const live = shoppingData.neededList.find(n=> n.id === item.id);
      if(live){
        live.done = cb.checked;
        live.changedAt = new Date().toISOString();
        // Ticking here is a decision about the week, not a trolley tick, so it is not
        // scoped to a trip — and unticking clears any scope the aisle route had set.
        delete live.doneTripId;
        persist('shopping');
      }
      render();
    });
    const label = el('label',{},[item.text]);
    const rm = el('button',{class:'btn small danger'},['Remove']);
    rm.addEventListener('click', ()=>{
      shoppingData.neededRemoved = noteRemoved(shoppingData.neededRemoved, [item.id], new Date().toISOString());
      shoppingData.neededList = shoppingData.neededList.filter(n=>n.id!==item.id);
      persist('shopping'); render();
    });
    li.appendChild(cb); li.appendChild(label); li.appendChild(rm);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  container.appendChild(card);
  return container;
}

/* ---- Print tab ----
   v21.1: this printed a blank sheet in Safari. Both halves of the old four-liner were
   unsafe there:

   1. window.print() was called in the same tick as the class that reveals the printable
      section. Chrome flushes style and layout before printing; Safari can snapshot the
      page as it was *before* the class landed — so it captured a page where the
      print-only section was still display:none.
   2. The class was then removed on a fixed 500ms timer. window.print() blocks in Chrome
      until the dialog closes, so the timer only ran afterwards and all was well. In
      Safari — on iOS especially, where printing goes through the share sheet — print()
      returns immediately and the capture happens later. 500ms in, the class was gone:
      the print-only section reverted to display:none and everything else is .no-print
      (display:none !important when printing). A page with every element hidden is
      exactly the blank sheet being reported.

   So: let the style change take effect before printing, and undo it on the browser's
   own after-print signal rather than on a guess. The printing-* classes are referenced
   only inside @media print blocks, so if neither signal ever fires they have no effect
   on screen and the next printSection() call clears them anyway. */
function isPrinting(){
  return document.body.classList.contains('printing-shopping')
      || document.body.classList.contains('printing-menu');
}

function clearPrintMode(){
  if(!isPrinting()) return;
  document.body.classList.remove('printing-shopping','printing-menu');
  // A sync that landed while the print dialog was open had its repaint held back by
  // safeToRepaint so it couldn't rebuild the page mid-capture; run it now.
  flushDeferredRepaint();
}

function printSection(which){
  document.body.classList.remove('printing-shopping','printing-menu');
  document.body.classList.add(which==='shopping' ? 'printing-shopping' : 'printing-menu');
  // Force a style/layout flush, then hand Safari a frame to apply it before printing.
  void document.body.offsetHeight;
  requestAnimationFrame(()=> requestAnimationFrame(()=> window.print()));
}

// afterprint covers Chrome, Edge, Firefox and Safari 13+; the matchMedia('print')
// transition covers older Safari, which never fires afterprint at all.
window.addEventListener('afterprint', clearPrintMode);
if(window.matchMedia){
  const printMq = window.matchMedia('print');
  const onPrintChange = e => { if(!e.matches) clearPrintMode(); };
  if(printMq.addEventListener) printMq.addEventListener('change', onPrintChange);
  else if(printMq.addListener) printMq.addListener(onPrintChange);
}

function renderMenuTab(){
  const container = el('div',{});
  if(shoppingData.weekPlan.selections.length===0){
    container.appendChild(el('div',{class:'empty-state'},['Nothing planned yet — start a new shopping list first.']));
    return container;
  }

  // ---- on-screen interactive menu: tick meals off as they're cooked ----
  const screen = el('div',{class:'no-print'});
  const printBtnRow = el('div',{class:'row', style:'margin-bottom:12px;'});
  const menuPrintBtn = el('button',{class:'btn'},['Print weekly menu (for the fridge)']);
  menuPrintBtn.addEventListener('click', ()=> printSection('menu'));
  printBtnRow.appendChild(menuPrintBtn);
  screen.appendChild(printBtnRow);
  screen.appendChild(el('h2',{},['This week’s menu']));
  screen.appendChild(el('p',{class:'muted'},['Tick each meal as you cook it through the week. Ticks sync to the other devices like the shopping list does.']));
  const menuCard = el('div',{class:'card'});
  shoppingData.weekPlan.selections.forEach(sel=>{
    const r = recipesData.recipes.find(x=>x.id===sel.recipeId);
    if(!r) return;
    const row = el('div',{class:'checkbox-row' + (sel.cooked?' removed':'')});
    const cb = el('input',{type:'checkbox'});
    cb.checked = !!sel.cooked;
    // Resolve by recipeId at tap time — a merge replaces the selection objects, and
    // mutating the one this row was drawn from would write into a discarded graph.
    const selId = sel.recipeId;
    /* v22.0: this tick is the only place in the app where somebody states that a meal was
       actually cooked, so it is the only place that writes recipe.lastCooked. Unticking is
       a correction, not a new fact, so it puts back whatever the stamp was before —
       cookedPrev, remembered on the selection. If a merge ever loses cookedPrev the
       restore lands on null, which understates the history rather than inventing it.
       This persists BOTH files, so a cook tick re-uploads the recipe file. That is the
       thing v21.2 went out of its way to avoid for shopping ticks, and it is fine here:
       this tick happens a few times a week, at home, not forty times over mobile data in
       the middle of a shop. */
    cb.addEventListener('change', ()=>{
      const live = (shoppingData.weekPlan.selections || []).find(s=> s.recipeId === selId);
      if(!live){ render(); return; }
      const recipe = recipesData.recipes.find(x=> x.id === selId);
      const now = new Date().toISOString();
      live.cooked = cb.checked;
      live.cookedChangedAt = now;
      if(recipe){
        if(cb.checked){
          live.cookedPrev = recipe.lastCooked || null;
          recipe.lastCooked = now;
        } else {
          const prev = live.cookedPrev || null;
          if(prev) recipe.lastCooked = prev; else delete recipe.lastCooked;
          delete live.cookedPrev;
        }
      }
      persist();
      row.classList.toggle('removed', cb.checked);
    });
    const label = el('label',{},[r.name + ' — serves ' + sel.servings + (r.category?'  ('+r.category+')':'')]);
    label.addEventListener('click', ()=>{ openRecipeViewer(r.id); });
    label.style.cursor = 'pointer';
    row.appendChild(cb); row.appendChild(label);
    menuCard.appendChild(row);
  });
  screen.appendChild(menuCard);

  /* v22.0: the quietest number in the app. Ingredients for a meal nobody got round to
     were bought all the same, and until there was a history nothing could say so. */
  const rate = cookRateSummary(recentTrips(0), recipesData.recipes, 6);
  if(rate.shops >= 2 && rate.picked){
    const perPicked = rate.picked / rate.shops, perCooked = rate.cooked / rate.shops;
    const rateCard = el('div',{class:'card'});
    rateCard.appendChild(el('h4',{style:'margin-top:0;'},['How the last ' + rate.shops + ' shops went']));
    rateCard.appendChild(el('p',{style:'margin:0 0 4px;'},[
      rate.picked + ' meals planned, at least ' + rate.cooked + ' cooked'
      + ' — about ' + Math.round(perPicked) + ' picked a shop and at least ' + Math.round(perCooked) + ' cooked.'
    ]));
    if(perCooked <= perPicked - 1.5){
      rateCard.appendChild(el('p',{class:'muted', style:'margin:0;'},[
        'The ones that do not get cooked are shopped for all the same. Picking nearer '
        + Math.round(perCooked) + ' would be closer to what actually happens.'
      ]));
    }
    rateCard.appendChild(el('p',{class:'muted', style:'margin:6px 0 0;font-size:.8rem;'},[
      '"At least", because a recipe records only its most recent cook — one cooked twice in '
      + 'different weeks is counted once. Ticking meals off above as you cook them is what '
      + 'makes this accurate.'
    ]));
    screen.appendChild(rateCard);
  }

  container.appendChild(screen);

  // ---- printable fridge-door menu (hidden on screen) ----
  const menuSection = el('div',{class:'print-menu-section screen-hidden'});
  menuSection.appendChild(el('h2',{},['This week’s menu']));
  menuSection.appendChild(el('p',{class:'muted print-only'},['Tick off each one as you cook it through the week.']));
  const printCard = el('div',{class:'card'});
  shoppingData.weekPlan.selections.forEach(sel=>{
    const r = recipesData.recipes.find(x=>x.id===sel.recipeId);
    if(r) printCard.appendChild(el('div',{class:'checkbox-row'},[(sel.cooked?'☑ ':'☐ ') + r.name + ' — serves ' + sel.servings + (r.category?'  ('+r.category+')':'')]));
  });
  menuSection.appendChild(printCard);
  container.appendChild(menuSection);

  return container;
}

function openModal(bodyEl, wide){
  const root = document.getElementById('modalRoot');
  const backdrop = el('div',{class:'modal-backdrop'});
  const modal = el('div',{class: wide ? 'modal wide' : 'modal'});
  const closeBtn = el('button',{class:'close-x'},['×']);
  closeBtn.addEventListener('click', closeModal);
  modal.appendChild(closeBtn);
  modal.appendChild(bodyEl);
  backdrop.appendChild(modal);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
  root.innerHTML = '';
  root.appendChild(backdrop);
}
// Closing a modal is the other moment a held-back repaint becomes safe to run.
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; releaseWakeLock(); flushDeferredRepaint(); }

/* ---- keep the screen on while cooking (Wake Lock API) ----
   Available on Android Chrome and iOS Safari 16.4+ over HTTPS. The lock is
   auto-released by the OS when the tab is hidden; we re-acquire on return if
   the person still has the toggle on and the recipe is still open. */
let screenWakeLock = null;
let wakeLockWanted = false;

async function acquireWakeLock(){
  if(!('wakeLock' in navigator)) return false;
  try{
    screenWakeLock = await navigator.wakeLock.request('screen');
    screenWakeLock.addEventListener('release', ()=>{ screenWakeLock = null; });
    return true;
  }catch(e){ console.warn('wake lock refused', e); return false; }
}
function releaseWakeLock(){
  wakeLockWanted = false;
  if(screenWakeLock){ try{ screenWakeLock.release(); }catch(e){} screenWakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && wakeLockWanted && !screenWakeLock) acquireWakeLock();
});

/* ---- Settings tab: ingredient categorisation + preferences ---- */

function knownAisles(){
  const seen = new Set();
  const aisles = [];
  recipesData.ingredients.forEach(i=>{
    const a = (i.aisle||'').trim();
    if(!a || a === 'Uncategorised') return;
    const key = a.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    aisles.push(a);
  });
  return aisles.sort((a,b)=>a.localeCompare(b));
}

const INGREDIENT_CATEGORY_OPTIONS = CATEGORY_ORDER.concat(['Other']);
// Category -> permitted aisles, taken from the Access database hierarchy
const CATEGORY_AISLES = {"Pantry": ["Alcohol", "Bakery", "Baking", "Beverage", "Biscuits", "Breakfast", "International", "Rice/pasta", "Sauces", "Snacks", "Spices", "Tins - fruit", "Tins - veg"], "Cold": ["Dairy", "Deli", "Freezer"], "Fruit and Vegetables": ["Fruit", "Vegetables"], "Meat": ["Fish", "Meat"], "Toiletries": ["Toiletries"]};

/* ---------------- measuring units (cup / TBsp / tsp) ----------------
   Recipe entry may use kitchen measures; shopping stays in the master unit.
   Conversion basis agreed 17 Jul 2026: cup = 250 mL, TBsp = 20 mL, tsp = 5 mL,
   and 1 g = 1 mL for gram-shopped ingredients. */
const MEASURE_ML = { cup:250, TBsp:20, tsp:5 };
const MEASURE_FRACTIONS = { cup:[1/8,1/4,1/3,1/2,2/3,3/4], tsp:[1/8,1/4,1/2,3/4], TBsp:[1/2] };
const FRACTION_GLYPHS = [[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾']];
function parseMeasureQty(str){
  if(str===null||str===undefined) return null;
  let t = String(str).trim().replace(/⅛/g,' 1/8').replace(/¼/g,' 1/4').replace(/⅓/g,' 1/3').replace(/½/g,' 1/2').replace(/⅔/g,' 2/3').replace(/¾/g,' 3/4').trim();
  if(!t) return null;
  const m = t.match(/^(\d+)?\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const den=parseInt(m[3],10); if(!den) return null; return (m[1]?parseInt(m[1],10):0) + parseInt(m[2],10)/den; }
  const f = parseFloat(t.replace(',','.'));
  return isNaN(f) ? null : f;
}
function validMeasureQty(num, unit){
  if(num===null || num<=0) return false;
  const fr = MEASURE_FRACTIONS[unit]; if(!fr) return true;
  const rem = num - Math.floor(num);
  if(rem < 1e-9) return true;
  return fr.some(x=> Math.abs(rem-x) < 0.02);
}
function formatMeasureQty(num){
  const whole=Math.floor(num), rem=num-whole;
  if(rem<1e-9) return String(whole);
  for(const [v,g] of FRACTION_GLYPHS){ if(Math.abs(rem-v)<0.02) return (whole? whole+' ':'')+g; }
  return String(Math.round(num*100)/100);
}
function measureToShoppingQty(num, measureUnit){ return Math.round(num * MEASURE_ML[measureUnit]); }

function wireUnitControls(name, qty, unit, unitSel, hint, presetDisplayUnit){
  function showMeasureSelect(shopUnit, preferred){
    const cur = unitSel.getAttribute('data-shop')===shopUnit ? unitSel.value : null;
    unitSel.innerHTML='';
    [shopUnit,'cup','TBsp','tsp'].forEach(u=> unitSel.appendChild(el('option',{value:u},[u])));
    unitSel.setAttribute('data-shop', shopUnit);
    unitSel.value = preferred || cur || shopUnit;
    if(!unitSel.value) unitSel.value = shopUnit;
    unitSel.style.display=''; unit.style.display='none';
  }
  function showTextUnit(lockedValue){
    unitSel.style.display='none'; unit.style.display='';
    if(lockedValue !== undefined && lockedValue !== null && lockedValue !== false){
      /* v23.4: show what the unit is CALLED, keep what is STORED. collectRecipeIngredients
         reads this box back as the recipe line's unit, so putting "each" in `.value` would
         write "each" into every recipe that uses a counted ingredient. dataset.unit carries
         the truth and the save path prefers it. */
      unit.value = unitLabel(lockedValue);
      unit.dataset.unit = lockedValue;
      unit.readOnly = true; unit.classList.add('locked-unit');
      unit.title = 'Unit is set by the master ingredient list — change it via Settings › Ingredients if it\'s wrong for every recipe.';
    } else {
      delete unit.dataset.unit;   // or a locked truth leaks into a free-text line
      unit.readOnly = false; unit.classList.remove('locked-unit'); unit.title='';
    }
  }
  function conversionNote(meta){
    if(unitSel.style.display==='none' || !MEASURE_ML[unitSel.value]) return '';
    const n = parseMeasureQty(qty.value);
    if(n===null) return '';
    if(!validMeasureQty(n, unitSel.value)) return ' · that fraction isn\'t allowed for '+unitSel.value;
    return ' · = '+measureToShoppingQty(n, unitSel.value)+' '+meta.shoppingUnit+' for shopping';
  }
  function updateHint(preferredUnit){
    const meta = findIngredientMeta(name.value);
    if(!name.value.trim()){ hint.textContent=''; showTextUnit(); return; }
    if(meta){
      if(meta.shoppingUnit==='g'||meta.shoppingUnit==='mL'){ showMeasureSelect(meta.shoppingUnit, preferredUnit||null); }
      else if(meta.shoppingUnit){ showTextUnit(meta.shoppingUnit); }
      else showTextUnit();
      hint.textContent = '✓ known ingredient — aisle: ' + (meta.aisle || 'Uncategorised') + conversionNote(meta);
    } else {
      hint.textContent = 'new ingredient — will be added, uncategorised for now';
      showTextUnit();
    }
  }
  name.addEventListener('input', ()=>updateHint());
  name.addEventListener('change', ()=>updateHint());
  qty.addEventListener('input', ()=>updateHint());
  unitSel.addEventListener('change', ()=>updateHint());
  updateHint(presetDisplayUnit||null);
  return updateHint;
}

// ▲▼ buttons that move `unit` (a DIRECT child of the ingredient container — a heading
// row, or an ingredient row's wrapper div) one position up/down. Appended into `host`.
function addMoveArrows(host, unitProvider){
  const upBtn = el('button',{class:'btn small secondary', type:'button', title:'Move up'},['▲']);
  upBtn.addEventListener('click', ()=>{
    const unit = unitProvider();
    const p = unit.previousElementSibling;
    if(p) unit.parentElement.insertBefore(unit, p);
  });
  const downBtn = el('button',{class:'btn small secondary', type:'button', title:'Move down'},['▼']);
  downBtn.addEventListener('click', ()=>{
    const unit = unitProvider();
    const n = unit.nextElementSibling;
    if(n) unit.parentElement.insertBefore(unit, n.nextElementSibling); // null = end
  });
  host.appendChild(upBtn);
  host.appendChild(downBtn);
}

function normalizeMethodLines(text){
  return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean)
    .map(x=>{ const m = x.match(/^(?:—|–|--)\s*(.+)$/); return m ? '— '+m[1] : x; });
}
function collectIngredientRows(wrap){
  const out=[];
  let currentSection = '';
  for(const row of Array.from(wrap.querySelectorAll('.ingredient-editor-row, .ingredient-section-row'))){
    if(row.classList.contains('ingredient-section-row')){
      currentSection = row.querySelector('.section-name-input').value.trim();
      continue;
    }
    const nameV = row.querySelector('.ing-name-input').value.trim();
    if(!nameV) continue;
    const qtyStr = row.querySelector('.qty-input').value.trim();
    const descEl = row.querySelector('.desc-input');
    const descV = descEl ? descEl.value.trim() : '';
    const unitInput = row.querySelector('.unit-input');
    const unitSel = row.querySelector('.unit-select');
    const useSel = unitSel && unitSel.style.display !== 'none';
    // v23.4: a locked box displays the unit's LABEL, so the stored unit comes off the
    // dataset. Present-but-empty is a real value here, hence the undefined test.
    const unitVal = useSel ? unitSel.value
                  : (unitInput.dataset.unit !== undefined ? unitInput.dataset.unit
                                                          : unitInput.value.trim());
    if(useSel && MEASURE_ML[unitVal]){
      const num = parseMeasureQty(qtyStr);
      if(num===null || !validMeasureQty(num, unitVal)){
        const allowed = unitVal==='cup' ? 'whole numbers and ⅛ ¼ ⅓ ½ ⅔ ¾' : unitVal==='tsp' ? 'whole numbers and ⅛ ¼ ½ ¾' : 'whole numbers and ½';
        return {error:'"'+nameV+'": quantity "'+qtyStr+'" isn\'t valid for '+unitVal+'. Allowed: '+allowed+' (e.g. 1 ½).'};
      }
      const meta = findIngredientMeta(nameV);
      const entry = {ingredientName:nameV, quantity: measureToShoppingQty(num, unitVal),
                unit:(meta&&meta.shoppingUnit)||'', displayQty: formatMeasureQty(num), displayUnit: unitVal};
      if(currentSection) entry.section = currentSection;
      if(descV) entry.descriptor = descV;
      out.push(entry);
    } else {
      const entry = {quantity: qtyStr, unit: unitVal, ingredientName: nameV};
      if(currentSection) entry.section = currentSection;
      if(descV) entry.descriptor = descV;
      out.push(entry);
    }
  }
  return {ingredients: out};
}


// Reverse index: lowercased ingredient name -> recipes that reference it. Lets the
// ingredient-categorisation screen show *why* something is uncategorised — often it's
// not a genuinely new ingredient at all, just an import typo or near-duplicate that's
// better fixed in the recipe itself (e.g. "Onion, brown" vs "Onion").
function buildIngredientUsageIndex(){
  const idx = new Map();
  recipesData.recipes.forEach(r=>{
    (r.ingredients||[]).forEach(ing=>{
      const key = (ing.ingredientName||'').trim().toLowerCase();
      if(!key) return;
      if(!idx.has(key)) idx.set(key, []);
      const arr = idx.get(key);
      if(!arr.some(x=>x.id===r.id)) arr.push({id:r.id, name:r.name});
    });
  });
  return idx;
}

// Recipe finder (trial): categories optional (empty = all categories); ingredient
// terms match case-insensitively on partial names ('chicken' finds 'Chicken thigh').
// mode 'all' = recipe must contain every term; 'any' = at least one.
function findRecipesByCategoryAndIngredients(cats, terms, mode){
  const catSet = cats.map(c=>c.toLowerCase());
  const t = terms.map(x=>x.trim().toLowerCase()).filter(Boolean);
  return recipesData.recipes.filter(r=>{
    if(catSet.length && !catSet.includes((r.category||'').toLowerCase())) return false;
    if(t.length){
      const names = (r.ingredients||[]).map(i=>(i.ingredientName||'').toLowerCase());
      const has = term => names.some(n=>n.includes(term));
      if(mode === 'any' ? !t.some(has) : !t.every(has)) return false;
    }
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

  });
  bulkCard.appendChild(bulkToggle);

  (function(){
    const picked = {};                       // recipe id -> true
    const bar = el('div',{class:'searchbar'});
    const search = el('input',{type:'search', placeholder:'Search recipes…'});
    const catSel = el('select',{});
    catSel.appendChild(el('option',{value:''},['All categories']));
    Array.from(new Set(recipesData.recipes.map(r=>r.category).filter(Boolean))).sort()
      .forEach(c=> catSel.appendChild(el('option',{value:c},[c])));
    bar.appendChild(search); bar.appendChild(catSel);
    bulkWrap.appendChild(bar);

    const count = el('p',{class:'muted'},['']);
    bulkWrap.appendChild(count);
    const listWrap = el('div',{style:'max-height:340px;overflow:auto;'});
    bulkWrap.appendChild(listWrap);

    const actions = el('div',{class:'row', style:'margin-top:12px;'});
    const delBtn  = el('button',{class:'btn danger'},['Delete the ticked ones']);
    const keepBtn = el('button',{class:'btn danger'},['Keep ONLY the ticked ones']);
    actions.appendChild(delBtn); actions.appendChild(keepBtn);
    bulkWrap.appendChild(actions);

    function selectedIds(){ return Object.keys(picked).filter(id=> picked[id]); }

    function refreshCount(){
      const n = selectedIds().length;
      count.textContent = n + ' ticked of ' + recipesData.recipes.length + ' recipes.';
      // Guard 6: neither action means anything with nothing ticked, and "keep only
      // nothing" would wipe the lot on an empty selection.
      delBtn.disabled = n === 0;
      keepBtn.disabled = n === 0;
      delBtn.textContent  = n ? 'Delete the ' + n + ' ticked' : 'Delete the ticked ones';
      keepBtn.textContent = n ? 'Keep ONLY these ' + n + ' (delete ' + (recipesData.recipes.length - n) + ')'
                              : 'Keep ONLY the ticked ones';
    }

    function draw(){
      listWrap.innerHTML = '';
      const q = search.value.trim().toLowerCase();
      const cat = catSel.value;
      const list = recipesData.recipes.filter(r=>
        (!cat || r.category === cat) && (!q || (r.name||'').toLowerCase().includes(q))
      ).sort((a,b)=> a.name.localeCompare(b.name));
      if(!list.length) listWrap.appendChild(el('p',{class:'muted'},['Nothing matches.']));
      list.forEach(r=>{
        const row = el('div',{class:'checkbox-row'});
        const cb = el('input',{type:'checkbox'});
        cb.checked = !!picked[r.id];
        cb.addEventListener('change', ()=>{ picked[r.id] = cb.checked; refreshCount(); });
        row.appendChild(cb);
        row.appendChild(el('label',{},[r.name + (r.category ? '  (' + r.category + ')' : '')]));
        listWrap.appendChild(row);
      });
    }
    search.addEventListener('input', draw);
    catSel.addEventListener('change', draw);

    // Guard 4: a bulk delete racing an in-flight save is how one device's deletion
    // swallows another's unsynced additions. Make it wait the few hundred ms instead.
    function blockedBySave(){
      if(pendingSaveRecipes || pendingSaveShopping){
        alert('A save is still going out to OneDrive. Give it a few seconds and try again — '
            + 'deleting while a save is in flight risks losing someone else’s changes.');
        return true;
      }
      return false;
    }

    delBtn.addEventListener('click', ()=>{
      if(blockedBySave()) return;
      const ids = selectedIds();
      const doomed  = recipesData.recipes.filter(r=> ids.indexOf(r.id) !== -1);
      const keeping = recipesData.recipes.filter(r=> ids.indexOf(r.id) === -1);
      if(doomed.length) confirmBulkDelete(doomed, keeping);
    });
    keepBtn.addEventListener('click', ()=>{
      if(blockedBySave()) return;
      const ids = selectedIds();
      const keeping = recipesData.recipes.filter(r=> ids.indexOf(r.id) !== -1);
      const doomed  = recipesData.recipes.filter(r=> ids.indexOf(r.id) === -1);
      if(doomed.length) confirmBulkDelete(doomed, keeping);
    });

    refreshCount();
    draw();
  })();

  bulkCard.appendChild(bulkWrap);
  container.appendChild(bulkCard);

  /* -------- Ingredient list (master) -------- */
  container.appendChild(el('h3',{},['Ingredient list']));
  container.appendChild(el('p',{class:'muted', style:'margin-top:-6px;'},['The master list of every ingredient the app knows: its aisle, its shopping category, and its name — which is also where family preferences live: rename "Bread" to "Bread (Helga\u2019s wholemeal)" and that name flows through recipes, shopping lists and printouts. New ingredients typed into a recipe or the Wait List start out "Uncategorised" here.']));

  // Collapsed by default — nobody needs 400+ rows of ingredients on screen while
  // changing an unrelated preference. One tap shows or hides the whole list.
  const managerToggle = el('button',{class:'btn secondary', type:'button'},['Show ingredient list (' + recipesData.ingredients.length + ')']);
  container.appendChild(el('div',{class:'row', style:'margin-bottom:8px;'},[managerToggle]));
  const managerBody = el('div',{style:'display:none;'});
  let managerOpen = false;
  managerToggle.addEventListener('click', ()=>{
    managerOpen = !managerOpen;
    managerBody.style.display = managerOpen ? '' : 'none';
    managerToggle.textContent = (managerOpen ? 'Hide' : 'Show') + ' ingredient list (' + recipesData.ingredients.length + ')';
    if(managerOpen) drawList();
  });

  const searchbar = el('div',{class:'searchbar'});
  const searchInput = el('input',{type:'search', placeholder:'Search ingredients…'});
  const filterSelect = el('select',{});
  filterSelect.appendChild(el('option',{value:'all'},['Show: All ingredients']));
  filterSelect.appendChild(el('option',{value:'uncategorised'},['Show: needs an aisle, category or unit']));
  searchbar.appendChild(searchInput); searchbar.appendChild(filterSelect);
  managerBody.appendChild(searchbar);


  const ROW_CAP = 300;
  let showAllRows = false;
  const usageIndex = buildIngredientUsageIndex();
  const USED_IN_SHOW = 5;

  /* v23.4: a missing shopping unit counts too. It could not before, so an ingredient
     added by hand — which until v23.4 could never be given a unit at all — was invisible
     to the one filter whose whole purpose is "things worth fixing". */
  function isUncategorisedIngredient(i){
    return isUnsetCategory(i.shoppingCategory) || isUnsetAisle(i.aisle)
        || !((i.shoppingUnit || '').trim());
  }
  // The bulk "delete all unused ingredients" action was removed in v19.0. It was a
  // development convenience; with other people adding their own ingredients it
  // silently destroys work. Ingredients are still deletable one at a time below.

  const countNote = el('div',{class:'muted', style:'margin:8px 0;'},['']);
  managerBody.appendChild(countNote);

  const listWrap = el('div',{});
  managerBody.appendChild(listWrap);

  function drawList(){
    listWrap.innerHTML = '';
    const q = searchInput.value.trim().toLowerCase();
    const mode = filterSelect.value;
    const totalUncategorised = recipesData.ingredients.filter(isUncategorisedIngredient).length;
    let list = recipesData.ingredients.filter(i=>{
      if(mode === 'uncategorised' && !isUncategorisedIngredient(i)) return false;
      if(q && !(i.name||'').toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    const shownTotal = list.length;
    const capped = showAllRows ? list : list.slice(0, ROW_CAP);
    countNote.innerHTML = '';
    countNote.appendChild(el('span',{},[capped.length + ' of ' + shownTotal + ' shown · ' + totalUncategorised + ' needing an aisle, category or unit ']));
    if(!showAllRows && shownTotal > ROW_CAP){
      const showAllBtn = el('button',{class:'btn small secondary', type:'button'},['Show all ' + shownTotal]);
      showAllBtn.addEventListener('click', ()=>{ showAllRows = true; drawList(); });
      countNote.appendChild(showAllBtn);
    }

    if(capped.length === 0){
      listWrap.appendChild(el('div',{class:'empty-state'},['No ingredients match.']));
      return;
    }

    capped.forEach(ing=>{
      const wrapper = el('div',{style:'margin-bottom:10px;'});
      const row = el('div',{class:'ingredient-editor-row', style:'margin-bottom:2px;'});
      const nameInput = el('input',{type:'text', value: ing.name, class:'ing-master-name-input', style:'flex:1.4;font-weight:600;'});
      const catSelect = el('select',{style:'flex:1;'});
      catSelect.appendChild(el('option',{value:''},['— category —']));
      INGREDIENT_CATEGORY_OPTIONS.forEach(c=> catSelect.appendChild(el('option',{value:c},[c])));
      catSelect.value = isUnsetCategory(ing.shoppingCategory) ? '' : ing.shoppingCategory;
      const aisleSelect = el('select',{style:'flex:1;', title:'Only aisles belonging to the selected category (from the Access database)'});
      function aislesForCategory(cat){
        const list = CATEGORY_AISLES[cat];
        return (list && list.length) ? list.slice() : knownAisles();
      }
      function fillAisles(keepCurrent){
        const prev = keepCurrent ? aisleSelect.value : (isUnsetAisle(ing.aisle) ? '' : ing.aisle);
        aisleSelect.innerHTML = '';
        aisleSelect.appendChild(el('option',{value:''},['— aisle —']));
        let opts = aislesForCategory(catSelect.value);
        let matched = '';
        opts.forEach(a=>{ if(prev && a.toLowerCase()===prev.toLowerCase()) matched = a; });
        if(prev && !matched && !keepCurrent){ opts = opts.concat([prev + ' (current — off-list)']); matched = prev + ' (current — off-list)'; }
        opts.forEach(a=> aisleSelect.appendChild(el('option',{value:a},[a])));
        aisleSelect.value = matched;
      }
      fillAisles(false);
      /* v23.4: until now nothing in the app could set an ingredient's shopping unit. Every
         creation site wrote '' and this row offered name, category, aisle and delete — while
         the recipe editor's unit box told people to "change it via Settings › Ingredients",
         which is here, where no such control existed. */
      const unitSelect = el('select',{style:'flex:0 0 auto;min-width:120px;',
        title:'How this ingredient is bought — the unit the shopping list totals it in'});
      function fillUnits(){
        unitSelect.innerHTML = '';
        SHOPPING_UNIT_OPTIONS.forEach(o=> unitSelect.appendChild(el('option',{value:o.value},[o.label])));
        const cur = (ing.shoppingUnit || '').trim();
        /* Anything else got there from a recipe line, which is the one path that has ever
           captured a unit. Keep it selectable rather than silently rewriting it the next
           time somebody edits this row's aisle. */
        if(cur && !SHOPPING_UNIT_OPTIONS.some(o=> o.value === cur)){
          unitSelect.appendChild(el('option',{value:cur},[cur + ' (current — off-list)']));
        }
        unitSelect.value = cur;
      }
      fillUnits();
      const delBtn = el('button',{class:'btn small danger', type:'button', title:'Delete this ingredient from the master list'},['✕']);
      function saveMeta(){
        ing.aisle = (aisleSelect.value || 'Uncategorised').replace(' (current — off-list)','');
        ing.shoppingCategory = catSelect.value || 'Other';
        ing.shoppingUnit = unitSelect.value;
        persist('recipes');
        drawList();
      }
      /* Changing a unit that is already set is worth a word first: the amounts saved in
         recipes are not converted. Changing one that was never set is just filling a gap,
         and asking about that would be noise on exactly the ingredients this fixes. */
      function changeUnit(){
        const prev = (ing.shoppingUnit || '').trim();
        const usedIn = usageIndex.get(ing.name.trim().toLowerCase()) || [];
        if(prev && prev !== unitSelect.value && usedIn.length){
          const msg = 'Change the shopping unit for "' + ing.name + '" from '
            + unitLabel(prev) + ' to ' + unitLabel(unitSelect.value) + '?\n\n'
            + 'It is used in ' + usedIn.length + ' recipe(s). The amounts already saved in '
            + 'those recipes are NOT converted — they keep the numbers they have, and the '
            + 'shopping list will total them in the new unit.';
          if(!confirm(msg)){ fillUnits(); return; }
        }
        saveMeta();
      }
      function saveName(){
        const newName = nameInput.value.trim();
        if(!newName){ nameInput.value = ing.name; return; }
        if(!renameMasterIngredient(recipesData, ing, newName)) return;
        persist('recipes');
        drawList();
      }
      function confirmDelete(){
        const usedIn = usageIndex.get(ing.name.trim().toLowerCase()) || [];
        let msg;
        if(usedIn.length === 0){
          msg = 'Delete "' + ing.name + '" from the ingredient list? This can\'t be undone.';
        } else {
          const shown = usedIn.slice(0, USED_IN_SHOW).map(r=>r.name).join(', ');
          const more = usedIn.length > USED_IN_SHOW ? ', +' + (usedIn.length - USED_IN_SHOW) + ' more' : '';
          msg = '"' + ing.name + '" is still used in ' + usedIn.length + ' recipe(s) (' + shown + more + '). ' +
                'Deleting it here only clears its saved aisle/category/unit — it will reappear as ' +
                'Uncategorised next time you edit one of those recipes. Delete anyway?';
        }
        if(!confirm(msg)) return;
        deleteMasterIngredient(recipesData, ing);
        persist('recipes');
        drawList();
      }
      nameInput.addEventListener('change', saveName);
      aisleSelect.addEventListener('change', saveMeta);
      catSelect.addEventListener('change', ()=>{ fillAisles(true); saveMeta(); });
      unitSelect.addEventListener('change', changeUnit);
      delBtn.addEventListener('click', confirmDelete);
      row.appendChild(nameInput);
      row.appendChild(catSelect);
      row.appendChild(aisleSelect);
      row.appendChild(unitSelect);
      row.appendChild(delBtn);
      wrapper.appendChild(row);

      // Which recipe(s) this came from — often the fastest way to tell a genuinely new
      // ingredient apart from an import artefact (typo, near-duplicate) worth fixing
      // in the recipe itself instead.
      const usedIn = usageIndex.get(ing.name.trim().toLowerCase()) || [];
      const usedInLine = el('div',{class:'muted', style:'font-size:0.8em;padding-left:2px;'});
      if(usedIn.length === 0){
        usedInLine.appendChild(el('span',{},['Not used in any current recipe']));
      } else {
        usedInLine.appendChild(el('span',{},['Used in: ']));
        usedIn.slice(0, USED_IN_SHOW).forEach((ref, i)=>{
          if(i>0) usedInLine.appendChild(el('span',{},[', ']));
          const link = el('a',{href:'javascript:void(0)', style:'color:var(--accent-dark);text-decoration:underline;cursor:pointer;'},[ref.name]);
          link.addEventListener('click', ()=>{ closeModal(); openRecipeEditor(ref.id); });
          usedInLine.appendChild(link);
        });
        if(usedIn.length > USED_IN_SHOW){
          usedInLine.appendChild(el('span',{},[', +' + (usedIn.length - USED_IN_SHOW) + ' more']));
        }
      }
      wrapper.appendChild(usedInLine);
      listWrap.appendChild(wrapper);
    });
  }
  searchInput.addEventListener('input', drawList);
  filterSelect.addEventListener('change', drawList);

  // Direct add: for things bought occasionally but not tied to any recipe or staple —
  // gets a proper aisle/category so anyone can find it in the shop via Wait List.
  const addWrap = el('div',{class:'row', style:'align-items:center;gap:6px;margin:10px 0;'});
  const addNameInput = el('input',{type:'text', placeholder:'add a new ingredient…', style:'min-width:200px;'});
  // v23.4: ask for the unit at the point of creation — this is the flow that was reported,
  // where the app took the name and never asked how the thing is bought.
  const addUnitSelect = el('select',{style:'flex:0 0 auto;min-width:120px;',
    title:'How this ingredient is bought — you can change it in its row afterwards'});
  SHOPPING_UNIT_OPTIONS.forEach(o=> addUnitSelect.appendChild(el('option',{value:o.value},[o.label])));
  const addBtn2 = el('button',{class:'btn small', type:'button'},['Add ingredient']);
  function addMasterDirect(){
    const v = addNameInput.value.trim();
    if(!v) return;
    if(findIngredientMeta(v)){ alert('"' + v + '" is already in the ingredient list — search for it above to edit it.'); return; }
    recipesData.ingredients.push({name: v, shoppingUnit: addUnitSelect.value, aisle:'Uncategorised', shoppingCategory:'Other'});
    persist('recipes');
    addNameInput.value = '';
    addUnitSelect.value = '';
    searchInput.value = v; // jump straight to the new entry so its aisle/category get set now
    drawList();
  }
  addBtn2.addEventListener('click', addMasterDirect);
  addNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addMasterDirect(); } });
  addWrap.appendChild(addNameInput); addWrap.appendChild(addUnitSelect); addWrap.appendChild(addBtn2);
  managerBody.insertBefore(addWrap, listWrap);
  container.appendChild(managerBody);
  // list is drawn on first open — no point building 400+ rows nobody's looking at

  return container;
}

const GRAB_RECIPE_BOOKMARKLET = `javascript:(function(){function find(o){if(!o)return null;if(Array.isArray(o)){for(var i=0;i<o.length;i++){var r=find(o[i]);if(r)return r;}return null;}if(typeof o==='object'){var t=o['@type'];if(t==='Recipe'||(Array.isArray(t)&&t.indexOf('Recipe')>-1))return o;if(o['@graph'])return find(o['@graph']);}return null;}var rec=null,scripts=document.querySelectorAll('script[type=%22application/ld+json%22]');for(var i=0;i<scripts.length;i++){try{rec=find(JSON.parse(scripts[i].textContent));}catch(e){}if(rec)break;}if(!rec){alert('No structured recipe found on this page. Use Select All, Copy, and the paste box in The Fridge List instead.');return;}function clean(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent.replace(/\s+/g,' ').trim();}function steps(x){var out=[];(function w(v){if(!v)return;if(typeof v==='string'){var c=clean(v);if(c)out.push(c);}else if(Array.isArray(v)){v.forEach(w);}else if(typeof v==='object'){if(v.name&&v.itemListElement)out.push('— '+clean(v.name));if(v.text&&!v.itemListElement)out.push(clean(v.text));if(v.itemListElement)w(v.itemListElement);}})(x);return out;}var data={fridgeListImport:1,name:clean(String(rec.name||'')),servings:String(Array.isArray(rec.recipeYield)?rec.recipeYield[0]:(rec.recipeYield||'')),url:location.href,ingredients:(rec.recipeIngredient||rec.ingredients||[]).map(function(s){return clean(String(s));}),method:steps(rec.recipeInstructions)};var txt=JSON.stringify(data);navigator.clipboard.writeText(txt).then(function(){alert('Recipe %22'+data.name+'%22 copied ('+data.ingredients.length+' ingredients, '+data.method.length+' steps). Now paste it into The Fridge List import box.');},function(){prompt('Clipboard blocked - copy this manually, then paste into The Fridge List:',txt);});})();`;

function parseImportPaste(text){
  text = (text||'').trim();
  if(!text) return null;
  try{
    const j = JSON.parse(text);
    if(j && j.fridgeListImport){
      return {name:j.name||'', servings:String(j.servings||''), url:j.url||'', ingredients:j.ingredients||[], method:j.method||[]};
    }
  }catch(e){}
  const lines = text.split('\n').map(x=>x.trim());
  const lower = lines.map(x=>x.toLowerCase().replace(/[^a-z ]/g,'').trim());
  function findHead(words){ for(let i=0;i<lower.length;i++){ if(words.indexOf(lower[i])>-1) return i; } return -1; }
  const ingIdx = findHead(['ingredients','ingredient list']);
  const methIdx = findHead(['method','instructions','directions','steps','preparation']);
  let ingredients=[], method=[];
  if(ingIdx>-1){
    const end = (methIdx>ingIdx)?methIdx:lines.length;
    ingredients = lines.slice(ingIdx+1,end).filter(Boolean).filter(x=>x.length<120);
  }
  if(methIdx>-1){
    method = lines.slice(methIdx+1).filter(Boolean).filter(x=>x.length>3);
    const stop = method.findIndex(x=>/^(nutrition|notes|comments|reviews|you might also like|related recipes|rate this)/i.test(x));
    if(stop>-1) method = method.slice(0,stop);
  }
  let name='';
  for(const l of lines){ if(l && l.length>2 && l.length<90){ name=l; break; } }
  let servings='';
  const sm = text.match(/serv(?:es|ings?)[:\s]*([0-9]+)|([0-9]+)\s*servings?/i);
  if(sm) servings = sm[1]||sm[2]||'';
  const weak = !ingredients.length && !method.length;
  return {name, servings, url:'', ingredients, method, weak};
}

const IMPORT_STOPWORDS = new Set(('cup cups tsp tbsp tablespoon tablespoons teaspoon teaspoons gram grams kilogram '+
  'of a an the and or to into for with finely freshly roughly thinly chopped sliced diced grated minced crushed peeled '+
  'large small medium fresh ground extra plus more taste optional about approx can tin jar packet pkt bunch handful '+
  'pinch clove cloves sprig sprigs stick sticks piece pieces halved quartered trimmed drained rinsed cut serve serving').split(' '));
function suggestMasterMatches(line, max){
  const toks = String(line||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(t=>t.length>2 && !IMPORT_STOPWORDS.has(t));
  if(!toks.length) return [];
  const scored = [];
  recipesData.ingredients.forEach(ing=>{
    const nToks = ing.name.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(t=>t.length>2);
    if(!nToks.length) return;
    let hit=0;
    nToks.forEach(nt=>{ if(toks.some(t=> t===nt || (t.length>3 && nt.length>3 && (t.indexOf(nt)===0 || nt.indexOf(t)===0)))) hit++; });
    if(hit===0) return;
    scored.push({name:ing.name, score: hit/nToks.length + hit*0.1});
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, max||3).map(x=>x.name);
}

function openWebImport(){
  const body = el('div',{});

  body.appendChild(el('p',{class:'muted'},['On the recipe page, click your 🛒 Grab Recipe bookmark, then paste here. No Grab Recipe button, or the site doesn’t support it? Select the whole page (Ctrl+A), copy, and paste that instead.']));

    if(parsed.weak && !confirm('Could not find clear Ingredients/Method sections in that text. Open the import workbench anyway with what was found?')) return;
