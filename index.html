  const trips = loadTripHistoryLocal().trips;
  return (n && n > 0) ? trips.slice(Math.max(0, trips.length - n)) : trips.slice();
}

/* Called from finishShopping while shoppingList still exists. The local write is first
   and synchronous on purpose: finishShopping deletes the list, so a trip that did not
   reach localStorage is gone for good. The remote push is best-effort — a missing remote
   copy costs the other phones a little history, which is not the same kind of loss. */
function archiveFinishedTrip(){
  const rec = tripRecordFromShopping(shoppingData, deviceId());
  if(!rec) return false;
  tripHistory = mergeTripHistory(loadTripHistoryLocal(), { version: 1, trips: [rec] });
  saveTripHistoryLocal();
  syncTripHistory();   // fire and forget: fold in anything the others archived, then push
  return true;
}

async function syncTripHistory(){
  await fetchTripHistory();
  await pushTripHistory();
}

async function pushTripHistory(){
  if(!tripHistory) return false;
  pendingSaveTrips = true;
  const body = JSON.stringify(tripHistory);
  try{
    if(msalAccount && localStorage.getItem(LS_ONEDRIVE_FLAG) === '1'){
      if(!oneDriveFolderRef){
        const token = await getGraphToken();
        if(!token) return false;
        oneDriveFolderRef = await resolveFridgeListFolder(token);
        if(!oneDriveFolderRef) return false;
      }
      const ok = await writeOneDriveFile(oneDriveFolderRef.driveId, oneDriveFolderRef.itemId, TRIPS_FILE, body);
      if(ok) pendingSaveTrips = false;
      return ok;
    }
    if(dirHandle){ await writeFileToFolder(TRIPS_FILE, body); pendingSaveTrips = false; return true; }
  }catch(e){ console.warn('could not save the trip history', e); }
  return false;
}

/* Never on the startup path. Repaints through repaintWhenSafe(), never render(), because
   this can land while somebody is typing on the Wait List. */
async function fetchTripHistory(){
  try{
    let text = null;
    if(msalAccount && localStorage.getItem(LS_ONEDRIVE_FLAG) === '1'){
      const token = await getGraphToken();
      if(!token) return;
      if(!oneDriveFolderRef) oneDriveFolderRef = await resolveFridgeListFolder(token);
      if(!oneDriveFolderRef) return;
      text = await getOneDriveFileText(oneDriveFolderRef.driveId, oneDriveFolderRef.itemId, TRIPS_FILE, token);
    } else if(dirHandle){
      text = await getFileText(dirHandle, TRIPS_FILE);
    } else return;
    if(!text) return;
    const before = JSON.stringify(loadTripHistoryLocal());
    tripHistory = mergeTripHistory(tripHistory, JSON.parse(text));
    if(JSON.stringify(tripHistory) !== before){ saveTripHistoryLocal(); repaintWhenSafe(); }
  }catch(e){ console.warn('could not read the trip history', e); }
}

/* ---------------- manual export / import (works in every browser) ---------------- */

/* ---- v21.6: bulk recipe delete, and the safety net under it ----
   Deleting recipes one at a time is fine for pruning a few, and hopeless for the
   "I forked this and want my own twelve" case. But a bulk delete here is not a local
   action: recipes are last-save-wins and sync within seconds, so it reaches everyone's
   phone before anyone can object.
   A confirmation dialog does not make that safe — v19.0 removed the bulk ingredient
   delete for exactly that reason. What makes it safe is being able to undo it, so the
   work is in the recovery paths, not the warning text. There are three:
     1. an in-session Undo, for the immediate "oh no";
     2. a timestamped snapshot file written BEFORE anything is deleted, which the delete
        is conditional on — if the snapshot cannot be written, nothing is deleted;
     3. OneDrive's own version history on recipes-data.json, which has been there all
        along and is now documented in the setup guides.  */

let undoRecipes = null;     // deep copy of recipesData from before the last bulk delete

function snapshotName(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return 'recipes-backup-' + d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
}

/* Write a snapshot wherever this device syncs, and report honestly what happened.
   Returns { ok, where, name }. ok:false means the caller must not delete anything. */
async function writeRecipesSnapshot(){
  const name = snapshotName();
  const body = JSON.stringify(recipesData);
  if(msalAccount && localStorage.getItem(LS_ONEDRIVE_FLAG) === '1'){
    const token = await getGraphToken();
    if(!token) return { ok:false, where:'OneDrive', name, why:'not signed in' };
    if(!oneDriveFolderRef) oneDriveFolderRef = await resolveFridgeListFolder(token);
    if(!oneDriveFolderRef) return { ok:false, where:'OneDrive', name, why:'FridgeList folder not found' };
    const ok = await writeOneDriveFile(oneDriveFolderRef.driveId, oneDriveFolderRef.itemId, name, body);
    return ok ? { ok:true, where:'OneDrive', name }
              : { ok:false, where:'OneDrive', name, why:'the write was refused (is the drive full?)' };
  }
  if(dirHandle){
    try{
      const fh = await dirHandle.getFileHandle(name, {create:true});
      const w = await fh.createWritable();
      await w.write(body); await w.close();
      return { ok:true, where:'the shared folder', name };
    }catch(e){ return { ok:false, where:'the shared folder', name, why:(e && e.message) || 'write failed' }; }
  }
  // No sync configured: the best available snapshot is a file on this device. It cannot
  // be verified, so the dialog says plainly that this is the only copy.
  downloadFile(name, body);
  return { ok:true, where:'this device’s downloads', name, unverified:true };
}

function undoBulkDelete(){
  if(!undoRecipes) return;
  recipesData = undoRecipes;
  undoRecipes = null;
  persist('recipes');
  render();
  setStatus('Put back. Nothing was deleted.', 'ok');
}

/* The confirmation step. Shows what is actually going (names, not just a number),
   and asks for the count to be typed — a number specific to this action proves it was
   read, where typing DELETE becomes muscle memory after the second time. */
function confirmBulkDelete(doomed, keeping){
  const body = el('div',{});
  body.appendChild(el('h3',{style:'margin-top:0;'},['Delete ' + doomed.length + ' recipe' + (doomed.length===1?'':'s') + '?']));
  body.appendChild(el('p',{},[
    'This removes them for everyone in the household, on every device, within a few seconds. '
    + keeping.length + ' recipe' + (keeping.length===1?'':'s') + ' will be kept.'
  ]));

  const sample = doomed.slice(0, 10).map(r=> r.name);
  body.appendChild(el('p',{class:'muted', style:'margin-bottom:4px;'},['About to be deleted:']));
  const ul = el('ul',{style:'margin:0 0 12px 18px;'});
  sample.forEach(n=> ul.appendChild(el('li',{},[n])));
  if(doomed.length > sample.length){
    ul.appendChild(el('li',{class:'muted'},['…and ' + (doomed.length - sample.length) + ' more']));
  }
  body.appendChild(ul);

  body.appendChild(el('p',{},[
    'A snapshot of every recipe is saved first. If that snapshot cannot be written, nothing is deleted.'
  ]));

  body.appendChild(el('label',{style:'display:block;margin-bottom:6px;'},
    ['To confirm, type ' + doomed.length + ' below.']));
  const typed = el('input',{type:'text', inputmode:'numeric', autocomplete:'off',
                            'aria-label':'Type ' + doomed.length + ' to confirm',
                            style:'width:120px;text-align:center;'});
  body.appendChild(typed);

  const note = el('p',{class:'muted', style:'margin-top:10px;'},['']);
  body.appendChild(note);

  const row = el('div',{class:'row', style:'margin-top:16px;'});
  const go = el('button',{class:'btn danger'},['Save a snapshot, then delete']);
  go.disabled = true;
  typed.addEventListener('input', ()=>{ go.disabled = typed.value.trim() !== String(doomed.length); });

  go.addEventListener('click', async ()=>{
    go.disabled = true;
    note.textContent = 'Saving the snapshot…';
    const snap = await writeRecipesSnapshot();
    if(!snap.ok){
      // Guard 1, the one that matters: the delete is conditional on the backup.
      note.className = 'muted';
      note.textContent = 'Nothing has been deleted. The snapshot could not be saved to '
        + snap.where + (snap.why ? ' — ' + snap.why : '') + '. Fix that and try again.';
      go.disabled = false;
      return;
    }
    undoRecipes = JSON.parse(JSON.stringify(recipesData));
    const keepIds = {};
    keeping.forEach(r=> { keepIds[r.id] = true; });
    recipesData.recipes = recipesData.recipes.filter(r=> keepIds[r.id]);
    persist('recipes');
    closeModal();
    currentTab = 'recipes';
    render();
    setStatus('Deleted ' + doomed.length + ' recipe(s). Snapshot saved to ' + snap.where
      + ' as ' + snap.name + (snap.unverified ? ' — that download is the only copy, keep it somewhere safe.' : '.')
      + ' Use "Put back" in Settings to undo while this tab stays open.', 'ok');
  });

  const cancel = el('button',{class:'btn secondary'},['Cancel']);
  cancel.addEventListener('click', closeModal);
  row.appendChild(go); row.appendChild(cancel);
  body.appendChild(row);
  openModal(body);
}

function exportData(){
  downloadFile('recipes-data.json', JSON.stringify(recipesData, null, 0));
  downloadFile('shopping-list.json', JSON.stringify(shoppingData, null, 0));
  setStatus('Downloaded recipes-data.json and shopping-list.json. Move both into your shared OneDrive folder.', 'ok');
}
function downloadFile(name, text){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
/* An import replaces the week wholesale, which makes it the one place besides the merge
   that decides what shoppingData is — and until now it just assigned the parsed file
   straight over the top. Two things follow from that.

   It has to be a DELIBERATE replacement, with lineage, like every other one in the app.
   Without a trip id naming what it supersedes, the copy it replaced simply wins the next
   poll and the import quietly undoes itself — the same failure clearedWeekPlan was written
   for in v22.1.

   And it has to be recoverable. v21.6's rule is that destructive actions are recoverable
   rather than merely confirmed, and an import over a live trolley destroys ticks nobody
   can get back. Going through applyMergedShopping is what buys that: it stashes the
   displaced trip on the way past, so "Put back the list that was replaced" on the Review
   tab is there afterwards.

   Deliberately NOT blocked while a shop is live, unlike every control on the Start tab.
   Import is the recovery tool of last resort, and a family whose data has gone wrong
   mid-shop is exactly who needs it. The confirmation names what it will cost instead. */
function adoptImportedShopping(parsed){
  if(!parsed) return false;
  const progress = tripProgress(shoppingData);
  if(tripIsLive(shoppingData) && progress.ticks > 0
     && !confirm('Importing replaces this week, including the ' + progress.ticks
        + ' item(s) already ticked off on this device.\n\n'
        + 'The list being replaced is kept for this session — "Put back the list that was '
        + 'replaced" on the Review tab brings it back.\n\nImport anyway?')) return false;

  const now = new Date().toISOString();
  const imported = Object.assign({}, parsed);
  imported.weekPlan = Object.assign({ selections: [], generatedAt: null },
                                    parsed.weekPlan || {}, {
    tripId: 'trip:' + now + ':' + deviceId(),
    supersedes: tripIdOf(shoppingData),
    basedOn: shoppingSeenRemoteAt || shoppingData.lastUpdated || null,
    generatedAt: now
  });
  // The horizon is this device's, never the imported file's — same rule as the merge.
  imported.seenRemoteAt = shoppingSeenRemoteAt || null;
  applyMergedShopping(imported);   // the one sanctioned way shoppingData changes hands
  return true;
}

function importData(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json'; input.multiple = true;
  input.onchange = async ()=>{
    for(const f of input.files){
      const text = await f.text();
      try{
        const parsed = JSON.parse(text);
        if(f.name.includes('shopping') || (parsed.shoppingList && parsed.neededList)){
          if(!adoptImportedShopping(parsed)) continue;   // declined at the confirmation
        } else {
          recipesData = migrateIngredientsIfStale(parsed, window.__fmaSeedRecipes);
          saveRecipesLocal();
        }
      }catch(e){ alert('Could not read ' + f.name + ': ' + e.message); }
    }
    render();
    // Push the imported data out through the active sync too. Without this an import
    // only lived on this device — and a later "Sync now" would pull the remote copy
    // back OVER the import, silently discarding it.
    persist();
    setStatus('Imported data from file(s) — saving to sync…', 'ok');
  };
  input.click();
}

/* ---------------- sharing selected recipes ---------------- */

// A share file is deliberately NOT a backup: it carries only the chosen recipes
// plus the master records for the ingredients they use, so the receiving copy
// can offer to add any it doesn't know. It never carries settings, the week
// plan, the wait list, or cooking history.
const SHARE_MARKER = 'fridgeListRecipeShare';

function buildShareBundle(ids){
  const chosen = recipesData.recipes.filter(r=> ids.indexOf(r.id) !== -1);
  const names = new Set();
  chosen.forEach(r=> (r.ingredients||[]).forEach(i=>{
    const n = (i.ingredientName||'').trim().toLowerCase();
    if(n) names.add(n);
  }));
  const ings = recipesData.ingredients.filter(i=> names.has((i.name||'').trim().toLowerCase()));
  return {
    [SHARE_MARKER]: 1,
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    recipes: JSON.parse(JSON.stringify(chosen)),
    ingredients: JSON.parse(JSON.stringify(ings))
  };
}

function exportSelectedRecipes(ids){
  if(!ids.length){ alert('Pick at least one recipe to share.'); return; }
  const bundle = buildShareBundle(ids);
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  downloadFile('fridge-list-recipes-' + stamp + '.json', JSON.stringify(bundle, null, 0));
  setStatus('Exported ' + ids.length + ' recipe(s) to a share file — send that one file on.', 'ok');
}

/* ---------------- sharing one recipe on its own ----------------

   The batch export above is for handing over a slice of the book. This is the
   "can you send me that pie?" case: one recipe, from the screen you are already
   reading it on. Two ways out, because the person on the other end either has
   The Fridge List or — far more often — has never heard of it:

     • copied to the clipboard, formatted — headings, a bulleted ingredient
       list and numbered steps, so pasting into an email or a document arrives
       looking like a recipe rather than a wall of text. Plain text goes on the
       clipboard alongside it, so anywhere that cannot take formatting (a text
       message, a code editor) still gets something readable;
     • as a recipe file — the same one-file format "Import shared file" reads.

   Both carry that one recipe and nothing else: no other recipes, no shopping
   list, no settings, no cooking history. */

// The ingredient line exactly as the recipe screen shows it. Shared by the
// viewer and the share text so the two can never drift apart.
function ingredientLineText(i){
  const descSuffix = i.descriptor ? ', ' + i.descriptor : '';
  if(i.displayUnit && i.displayQty !== undefined && i.displayQty !== ''){
    return String(i.displayQty) + ' ' + i.displayUnit + ' ' + i.ingredientName + descSuffix;
  }
  const meta = findIngredientMeta(i.ingredientName);
  const unit = ((i.unit || (meta && meta.shoppingUnit) || '') + '').trim();
  let txt;
  if(i.quantity === null || i.quantity === undefined || i.quantity === ''){ txt = i.ingredientName; }
  else if(unit && unit.toLowerCase() !== 'qty'){ txt = String(i.quantity) + unit + ' ' + i.ingredientName; }
  else { txt = String(i.quantity) + ' ' + i.ingredientName; }
  return txt + descSuffix;
}

// One recipe as plain text — no markup, nothing to install at the other end.
// Section headings and the per-section numbering match what is on screen.
function recipeToPlainText(r){
  const lines = [r.name];
  const bits = [r.category || 'Uncategorised', 'serves ' + (r.servings || '?')];
  if(r.slowCooker) bits.push('slow cooker');
  lines.push(bits.join(' \u00b7 '));

  lines.push('', 'INGREDIENTS');
  let prevSec = '', written = 0;
  (r.ingredients||[]).forEach(i=>{
    const sec = i.section || '';
    if(sec && sec !== prevSec){
      if(written) lines.push('');
      lines.push(sec);
    }
    prevSec = sec;
    lines.push(ingredientLineText(i));
    written++;
  });
  if(!written) lines.push('(none listed)');

  lines.push('', 'METHOD');
  let n = 0, steps = 0;
  (r.method||[]).forEach(m=>{
    const h = String(m).match(/^\u2014\s*(.+)$/);
    if(h){ lines.push('', h[1]); n = 0; return; }   // a heading restarts the numbering, as on screen
    lines.push((++n) + '. ' + m);
    steps++;
  });
  if(!steps) lines.push('(no method written down yet)');

  if(r.sourceUrl) lines.push('', 'From: ' + r.sourceUrl);
  return lines.join('\n');
}

// The same recipe as HTML, for the formatted half of the clipboard. Deliberately
// plain markup — headings, a list, an ordered list — with no colours or fonts of
// its own, so it takes on the styling of whatever it is pasted into.
function recipeToHtml(r){
  const esc = t => String(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const out = ['<div>'];
  out.push('<h2>' + esc(r.name) + '</h2>');
  const bits = [r.category || 'Uncategorised', 'serves ' + (r.servings || '?')];
  if(r.slowCooker) bits.push('slow cooker');
  out.push('<p><em>' + esc(bits.join(' \u00b7 ')) + '</em></p>');

  out.push('<h3>Ingredients</h3>');
  let ul = null, written = 0, prevSec = '';
  (r.ingredients||[]).forEach(i=>{
    const sec = i.section || '';
    if(sec && sec !== prevSec){
      if(ul){ out.push('</ul>'); ul = null; }
      out.push('<p><strong>' + esc(sec) + '</strong></p>');
    }
    prevSec = sec;
    if(!ul){ out.push('<ul>'); ul = true; }
    out.push('<li>' + esc(ingredientLineText(i)) + '</li>');
    written++;
  });
  if(ul) out.push('</ul>');
  if(!written) out.push('<p><em>(none listed)</em></p>');

  out.push('<h3>Method</h3>');
  let ol = null, steps = 0;
  (r.method||[]).forEach(m=>{
    const h = String(m).match(/^\u2014\s*(.+)$/);
    if(h){                                   // a heading closes the list, so the
      if(ol){ out.push('</ol>'); ol = null; } // numbering restarts under it
      out.push('<p><strong>' + esc(h[1]) + '</strong></p>');
      return;
    }
    if(!ol){ out.push('<ol>'); ol = true; }
    out.push('<li>' + esc(m) + '</li>');
    steps++;
  });
  if(ol) out.push('</ol>');
  if(!steps) out.push('<p><em>(no method written down yet)</em></p>');

  if(r.sourceUrl) out.push('<p>From: <a href="' + esc(r.sourceUrl) + '">' + esc(r.sourceUrl) + '</a></p>');
  out.push('</div>');
  return out.join('');
}

// Formatted and plain go onto the clipboard together: the paste target picks the
// one it can use. Word, Outlook, Google Docs and Gmail take the HTML; a text
// message or a terminal takes the plain text.
function copyRecipeToClipboard(r){
  const text = recipeToPlainText(r);
  const html = recipeToHtml(r);
  const done = ()=> setStatus('\u201c' + r.name + '\u201d copied \u2014 paste it into an email or a document.', 'ok');
  if(navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem === 'function'){
    let item = null;
    try{
      item = new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([text], {type:'text/plain'})
      });
    }catch(e){ item = null; }
    if(item){
      navigator.clipboard.write([item]).then(done, ()=> copyRecipeFallback(r, html, text, done));
      return;
    }
  }
  copyRecipeFallback(r, html, text, done);
}

// Browsers without the async clipboard write (older Safari, Firefox with it turned
// off) can still copy formatting the old way: select a rendered copy of the recipe
// and let execCommand take it. Plain text only if even that is refused.
function copyRecipeFallback(r, html, text, done){
  if(copyHtmlBySelection(html)){ done(); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, ()=> showRecipeTextToCopy(r, text));
    return;
  }
  showRecipeTextToCopy(r, text);
}

function copyHtmlBySelection(html){
  const holder = el('div',{html: html, style:'position:fixed;left:-9999px;top:0;'});
  holder.setAttribute('contenteditable','true');
  document.body.appendChild(holder);
  let ok = false;
  try{
    const range = document.createRange();
    range.selectNodeContents(holder);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){ ok = false; }
  holder.remove();
  return ok;
}

// Last resort: clipboard access refused (an insecure origin, or a browser that
// wants a different gesture). Put the text on screen so it can be copied by hand
// rather than leaving the button looking broken.
function showRecipeTextToCopy(r, text){
  const body = el('div',{});
  body.appendChild(el('h2',{},['Share \u201c' + r.name + '\u201d']));
  body.appendChild(el('p',{class:'muted'},['This browser would not let the app reach the clipboard. Select all of the text below and copy it yourself \u2014 it will paste as plain text.']));
  const ta = el('textarea',{rows:'16', readonly:'readonly'});
  ta.value = text;
  body.appendChild(ta);
  const row = el('div',{class:'row', style:'margin-top:12px;'});
  const closeBtn = el('button',{class:'btn secondary'},['Close']);
  closeBtn.addEventListener('click', closeModal);
  row.appendChild(closeBtn);
  body.appendChild(row);
  openModal(body);
  ta.focus(); ta.select();
}

function shareRecipeAsFile(r){
  const json = JSON.stringify(buildShareBundle([r.id]), null, 0);
  const filename = 'fridge-list-' + (r.id || 'recipe') + '.json';
  const saveIt = ()=>{
    downloadFile(filename, json);
    setStatus('Saved ' + filename + ' \u2014 send that one file on. The other person opens it with "Import shared file".', 'ok');
  };
  // A phone can hand the file straight to a messaging app; a desktop browser
  // saves it and the sender attaches it themselves.
  try{
    if(navigator.canShare && typeof File === 'function'){
      const file = new File([json], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: r.name}).then(
          ()=> setStatus('Sent "' + r.name + '" as a recipe file.', 'ok'),
          err=>{ if(!err || err.name !== 'AbortError') saveIt(); }
        );
        return;
      }
    }
  }catch(e){ /* no file sharing here — save it instead */ }
  saveIt();
}

// The panel the Share button on a recipe opens. Hidden until asked for, so the
// reading screen stays a reading screen.
function buildRecipeSharePanel(r){
  const panel = el('div',{class:'card', style:'margin-top:12px;'});
  panel.hidden = true;
  panel.appendChild(el('p',{style:'margin-top:0;'},['Send this one recipe on its own. Nothing else goes with it \u2014 not your other recipes, not the shopping list, not your settings.']));
  const row = el('div',{class:'row'});
  const copyBtn = el('button',{class:'btn'},['Copy recipe']);
  copyBtn.addEventListener('click', ()=> copyRecipeToClipboard(r));
  const fileBtn = el('button',{class:'btn secondary'},['Send as a recipe file']);
  fileBtn.addEventListener('click', ()=> shareRecipeAsFile(r));
  row.appendChild(copyBtn); row.appendChild(fileBtn);
  panel.appendChild(row);
  panel.appendChild(el('p',{class:'muted', style:'margin-bottom:0;font-size:.85em;'},[
    'Copy puts the recipe on the clipboard laid out properly \u2014 paste it straight into an email, a message or a document. The recipe file is for someone else with The Fridge List \u2014 they add it with "Import shared file" on the All Recipes tab.'
  ]));
  return panel;
}

// Collision handling: prompt for a new name. Cancelling skips that one recipe
// and leaves the existing copy alone — an import never overwrites silently.
function resolveImportName(name){
  const taken = n => recipesData.recipes.some(r=> (r.name||'').trim().toLowerCase() === n.trim().toLowerCase());
  if(!taken(name)) return name;
  let suggestion = name + ' (imported)';
  let i = 2;
  while(taken(suggestion)){ suggestion = name + ' (imported ' + (i++) + ')'; }
  for(;;){
    const answer = prompt('You already have a recipe called "' + name + '".\n\nEnter a different name to import it under, or Cancel to skip this recipe.', suggestion);
    if(answer === null) return null;
    const trimmed = answer.trim();
    if(!trimmed){ alert('A name is required.'); continue; }
    if(taken(trimmed)){ alert('"' + trimmed + '" is also taken. Try another.'); continue; }
    return trimmed;
  }
}

function importSharedRecipes(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json'; input.multiple = true;
  input.onchange = async ()=>{
    let added = 0, skipped = 0;
    const newIngredientNames = [];
    for(const f of input.files){
      let parsed;
      try{ parsed = JSON.parse(await f.text()); }
      catch(e){ alert('Could not read ' + f.name + ': ' + e.message); continue; }
      if(!parsed || !Array.isArray(parsed.recipes)){
        alert(f.name + " doesn't contain any recipes."); continue;
      }
      if(!parsed[SHARE_MARKER]){
        if(!confirm(f.name + ' was not produced by "Export selected recipes". Import its recipes anyway?')) continue;
      }
      const sharedIngs = Array.isArray(parsed.ingredients) ? parsed.ingredients : [];
      for(const incoming of parsed.recipes){
        if(!incoming || !incoming.name) continue;
        const finalName = resolveImportName(incoming.name);
        if(finalName === null){ skipped++; continue; }
        const copy = JSON.parse(JSON.stringify(incoming));
        copy.name = finalName;
        copy.id = slugify(finalName);
        copy.lastCooked = null;   // their cooking history is not yours
        copy.source = 'shared_import';
        if(!Array.isArray(copy.images)) copy.images = [];
        recipesData.recipes.push(copy);
        added++;
        (copy.ingredients||[]).forEach(line=>{
          const nm = (line.ingredientName||'').trim();
          if(!nm) return;
          if(findIngredientMeta(nm)) return;
          if(newIngredientNames.some(x=> x.name.toLowerCase() === nm.toLowerCase())) return;
          const shared = sharedIngs.find(si=> (si.name||'').trim().toLowerCase() === nm.toLowerCase());
          newIngredientNames.push({name: nm, shared: shared || null});
        });
      }
    }
    if(newIngredientNames.length){
      const preview = newIngredientNames.slice(0,25).map(x=>'  • '+x.name).join('\n')
        + (newIngredientNames.length > 25 ? '\n  …and ' + (newIngredientNames.length-25) + ' more' : '');
      const addThem = confirm('These ' + newIngredientNames.length + ' ingredient(s) are not in your ingredient list yet:\n\n'
        + preview + '\n\nAdd them now? (Settings -> ingredient list is where you set their aisle and shopping category.)');
      if(addThem){
        newIngredientNames.forEach(x=>{
          recipesData.ingredients.push(x.shared ? Object.assign({}, x.shared) : {
            name: x.name, shoppingUnit: '', aisle: 'Uncategorised', shoppingCategory: 'Other'
          });
        });
      }
    }
    persist('recipes');
    currentTab = 'recipes';
    render();
    setStatus('Imported ' + added + ' recipe(s)' + (skipped ? ', skipped ' + skipped : '')
      + (newIngredientNames.length ? ', ' + newIngredientNames.length + ' new ingredient(s) flagged' : '') + '.', 'ok');
  };
  input.click();
}

/* ---------------- helpers: ingredient aisle lookup, quantity parsing ---------------- */

// "TBsp", "tbsp", "tablespoons", "cup", "tsp"… -> canonical measure name, or null
// if the text isn't a kitchen measure at all.
function kitchenMeasureCanon(u){
  if(!u) return null;
  const t = String(u).trim().toLowerCase();
  if(t === 'cup' || t === 'cups') return 'cup';
  if(t === 'tbsp' || t === 'tablespoon' || t === 'tablespoons') return 'TBsp';
  if(t === 'tsp' || t === 'teaspoon' || t === 'teaspoons') return 'tsp';
  return null;
}

function addNewMasterIngredients(ingredients){
  // Any ingredient name typed into a recipe that doesn't match the master list yet
  // gets added to it now — as "Uncategorised", same as the wiki-import ingredients —
  // rather than silently vanishing into an uncategorised bucket every time the
  // shopping list is generated with no master record to ever fix.
  ingredients.forEach(ing=>{
    if(findIngredientMeta(ing.ingredientName)) return;
    // A kitchen measure (cup/TBsp/tsp) must never become an ingredient's permanent
    // shopping unit — that hard-locks the unit box to it forever after. Shop such
    // ingredients in mL instead, and keep what was typed as the display measure, so
    // the editor offers the full mL/cup/TBsp/tsp dropdown from then on.
    const measure = kitchenMeasureCanon(ing.unit);
    if(measure){
      const n = parseMeasureQty(ing.quantity);
      if(n !== null && validMeasureQty(n, measure)){
        ing.displayQty = ing.quantity;
        ing.displayUnit = measure;
        ing.quantity = measureToShoppingQty(n, measure);
      }
      ing.unit = 'mL';
    }
    recipesData.ingredients.push({
      name: ing.ingredientName,
      shoppingUnit: ing.unit || '',
      aisle: 'Uncategorised',
      shoppingCategory: 'Other'
    });
  });
}

function findIngredientMeta(name){
  const norm = (name||'').trim().toLowerCase();
  return recipesData.ingredients.find(i => (i.name||'').trim().toLowerCase() === norm);
}

function deleteMasterIngredient(data, ing){
  data.ingredients = data.ingredients.filter(i=> i !== ing);
}

function renameMasterIngredient(data, ing, newName){
  const trimmed = (newName||'').trim();
  if(!trimmed || trimmed === ing.name) return false;
  const oldNameLower = ing.name.trim().toLowerCase();
  const newNameLower = trimmed.toLowerCase();
  // If another master entry already has this exact name, merge into it instead of
  // creating a duplicate — same "exact match only" conservative approach used when
  // the wiki-import ingredients were first cleaned up.
  const clash = data.ingredients.find(i => i !== ing && (i.name||'').trim().toLowerCase() === newNameLower);
  data.recipes.forEach(r=>{
    (r.ingredients||[]).forEach(line=>{
      if((line.ingredientName||'').trim().toLowerCase() === oldNameLower) line.ingredientName = trimmed;
    });
  });
  if(clash){
    data.ingredients = data.ingredients.filter(i=> i !== ing);
  } else {
    ing.name = trimmed;
  }
  return true;
}

function parseQty(q){
  if(q === null || q === undefined || q === '') return null;
  if(typeof q === 'number') return q;
  const s = String(q).trim();
  const fracMap = {'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅛':0.125};
  if(fracMap[s] !== undefined) return fracMap[s];
  const m = s.match(/^(\d+)\s*[½¼¾⅓⅔⅛]$/);
  if(m && fracMap[s.slice(-1)] !== undefined) return parseInt(m[1],10) + fracMap[s.slice(-1)];
  // Accept a leading or trailing decimal point too (".5", "1."). The old pattern
  // required a digit before the point, so a quantity written ".5" failed to parse and
  // fell through to the text branch below — it then showed on the list as a bare ".5"
  // instead of being added into that ingredient's total.
  if(/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return parseFloat(s);
  if(/^\d+\/\d+$/.test(s)){ const [a,b] = s.split('/'); return parseFloat(a)/parseFloat(b); }
  return null; // ranges, "to taste", etc: not summable, keep as text
}

function fmtQty(n){
  if(n === null) return '';
  if(Math.abs(n - Math.round(n)) < 0.01) return String(Math.round(n));
  return (Math.round(n*100)/100).toString();
}

// Shopping-category walking order — matches the physical path through the shop,
// per household instruction. Aisles within each category stay alphabetical (also
// matches the reference layout). 'Other' and 'Wait list' always sort last.
const CATEGORY_ORDER = ['Fruit and Vegetables','Meat','Cold','Pantry','Toiletries'];
function catSortIndex(c){
  if(c === 'Wait list') return CATEGORY_ORDER.length + 1;
  const i = CATEGORY_ORDER.indexOf(c);
  return i === -1 ? CATEGORY_ORDER.length : i;
}

/* ---------------- shopping list generation ---------------- */

// A cheap fingerprint of "which recipes + servings are picked right now", so Review
// and Print can tell whether the generated shoppingList still matches the current
// selections, and prompt to regenerate instead of silently showing a stale/empty list.
// Covers BOTH what would change the generated list: which recipes/servings are
// picked, and which Wait List items are currently active (not done). Adding or
// removing a wait list item changes this just as much as changing a recipe pick does,
// so either one needs to mark the list stale.
/* v21: the signature deliberately ignores each Wait List entry's `done` flag and
   keys off membership only. Ticking an item off in the aisle sets `done` (see
   syncNeededFromLine), so a signature that filtered on it changed the moment anyone
   started shopping — which made the list look "stale" and had renderReviewTab
   silently rebuild it, wiping every tick on the trip. Adding or removing a Wait
   List entry still counts as a real change; shopping from the list does not. */
function selectionsSignature(){
  return JSON.stringify({
    sel: shoppingData.weekPlan.selections
      .map(s=>({r:s.recipeId, s:s.servings}))
      .sort((a,b)=> a.r < b.r ? -1 : a.r > b.r ? 1 : 0),
    fridge: shoppingData.neededList
      .map(n=>n.id)
      .sort(),
    /* v21.3: staples and their quantities count as a real change too, so editing an
       amount actually reaches a list that has already been generated. This only ever
       triggers a SAME-trip refresh — trip identity comes from recipeSelectionsSignature,
       which staples are deliberately not part of — so the rebuild carries every tick
       across rather than resetting the trip. */
    staples: featureOn('staples')
      ? (recipesData.settings.staples || []).slice().sort()
          .map(n => { const q = stapleQtyFor(n); return n + ' ' + (q === null ? '' : q); })
      : []
  });
}

/* Would generating right now carry the current trip on, or start a new one? A
   same-trip rebuild reconciles and keeps every tick; a new trip throws the current
   list away. generateShoppingList and the Review tab both have to know which is about
   to happen, and they must never disagree about it. */
function sameTripRebuild(){
  const prevTripId = tripIdOf(shoppingData);
  if(!prevTripId || shoppingData.weekPlan.shoppingDoneAt) return false;
  if(shoppingData.weekPlan.lastGeneratedRecipeSignature === recipeSelectionsSignature()) return true;
  /* v23.3: adding a recipe is an addition to the same shop, exactly as a Wait List entry
     is — "we'll do a curry too" is not "throw that list away and start again". It used to
     mint a new trip, which discarded the trolley, undid every deselection, and had two
     phones minting rival trip ids for what everyone thought was one list. Taking a recipe
     back OFF, or changing servings, still starts a new trip: that is a different list. */
  return picksOnlyAdded(shoppingData.weekPlan.lastGeneratedRecipeSelections);
}

/* The picks a list was last generated from. The signature beside it is a hash and can
   only say "different"; this can say "different because something was ADDED". Optional
   and additive — a file from an older build has no such field, picksOnlyAdded says no,
   and the signature test alone decides, which is the pre-v23.3 behaviour. */
function recipeSelectionsList(){
  return shoppingData.weekPlan.selections
    .map(s=>({ r:s.recipeId, s:(s.servings === undefined ? null : s.servings) }))
    .sort((a,b)=> a.r < b.r ? -1 : a.r > b.r ? 1 : 0);
}

function picksOnlyAdded(prev){
  if(!Array.isArray(prev)) return false;
  const now = {};
  recipeSelectionsList().forEach(x=>{ now[x.r] = x.s; });
  // Every recipe the current list was built from must still be picked, at the same
  // servings. Anything else — a removal, a serving change — is a different list.
  return prev.every(x => Object.prototype.hasOwnProperty.call(now, x.r) && now[x.r] === x.s);
}

function generateShoppingList(){
  const lines = {}; // key -> {ingredientName, unit, aisle, totalQty, textQtyParts:[], sources:[]}
  const generatedNow = new Date().toISOString();
  /* v21: regeneration is a reconciliation, not a rebuild. It used to hand back a
     brand new set of lines with checked:false, so any refresh of this tab mid-trip
     threw away the shopper's progress. Snapshot what's on the list now, keyed the
     same way the sync merge keys it, and carry the per-line state back on below —
     but only when this is still the SAME trip. A genuine change to the week's
     recipe picks starts a new trip, where a clean unticked list is what's wanted. */
  const prevByKey = {};
  (shoppingData.shoppingList || []).forEach(l=>{ prevByKey[lineMergeKey(l)] = l; });
  const prevTripId = tripIdOf(shoppingData);
  const sameTrip = sameTripRebuild();
  // A new trip discards whatever the current one has had ticked. Keep it aside first.
  if(!sameTrip) stashReplacedTrip(shoppingData);
  shoppingData.weekPlan.selections.forEach(sel=>{
    const recipe = recipesData.recipes.find(r=>r.id===sel.recipeId);
    if(!recipe) return;
    /* v22.0: putting a recipe on a list only ever proved it was PLANNED, so that is what
       this stamp now says. It used to be written to lastCooked, which made "not cooked
       recently" really mean "not shopped for recently" — a recipe picked and never got
       round to looked exactly like one the family had eaten. lastCooked is now written
       only where somebody actually says so: the cooked tick on the Menu tab. */
    recipe.lastPlanned = generatedNow;
    const factor = (sel.servings || recipe.servings || 1) / (recipe.servings || 1);
    recipe.ingredients.forEach(ing=>{
      const meta = findIngredientMeta(ing.ingredientName);
      const key = (ing.ingredientName||'').trim().toLowerCase();
      if(!key) return;
      if(!lines[key]) lines[key] = {
        ingredientName: ing.ingredientName,
        unit: (meta && meta.shoppingUnit) || ing.unit || '',
        aisle: (meta && meta.aisle) || 'Uncategorised',
        shoppingCategory: (meta && meta.shoppingCategory) || 'Other',
        totalQty: 0, hasNumeric:false, textQtyParts: [], sources: [], neededIds: [], removed:false, checked:false, source:'recipe'
      };
      const qn = parseQty(ing.quantity);
      if(qn !== null){ lines[key].totalQty += qn * factor; lines[key].hasNumeric = true; }
      else if(ing.quantity){ lines[key].textQtyParts.push(String(ing.quantity)); }
      if(!lines[key].sources.includes(recipe.name)) lines[key].sources.push(recipe.name);
    });
  });
  // Wait List items: if the text matches a known master ingredient, fold it into
  // that ingredient's normal shopping-list line (proper aisle/category) and flag it —
  // that way "onions" restocking sits with the onions a recipe already needs, not off
  // in its own list. Anything that doesn't match a known ingredient falls back to its
  // own "Wait list" section at the end.
  /* A Wait List entry is dropped from the list once it's done — but ticking it off in
     the aisle is what sets `done`, so during a trip that would make the line vanish
     from under the shopper rather than show as ticked. Keep any entry that is already
     part of this trip's list; the carry-forward below then restores its tick. */
  const stillOnTrip = n => {
    if(!sameTrip) return false;
    const m = findIngredientMeta(n.text);
    return !!prevByKey[m ? ('ing:' + (m.name||'').trim().toLowerCase()) : ('needed:' + n.id)];
  };
  /* v23.5: which `done` entries this list is entitled to leave off. On a same-trip rebuild
     that is the ones done HERE — a tick stamped with this trip, or a Wait List decision.
     On a new trip only the decision counts: a tick belonged to the list being replaced, so
     the item goes back on the new one unbought. tripId is still the previous trip at this
     point, which is exactly the trip doneCountsHere should be judging against. */
  const doneForThisList = n => sameTrip ? doneCountsHere(n) : !!(n.done && !n.doneTripId);
  shoppingData.neededList.filter(n=> !doneForThisList(n) || stillOnTrip(n)).forEach(n=>{
    const meta = findIngredientMeta(n.text);
    if(meta){
      const key = meta.name.trim().toLowerCase();
      if(!lines[key]) lines[key] = {
        ingredientName: meta.name,
        unit: meta.shoppingUnit || '',
        aisle: meta.aisle || 'Uncategorised',
        shoppingCategory: meta.shoppingCategory || 'Other',
        totalQty: 0, hasNumeric:false, textQtyParts: [], sources: [], neededIds: [], removed:false, checked:false, source:'recipe'
      };
      lines[key].fromFridgeList = true;
      if(!lines[key].neededIds) lines[key].neededIds = [];
      lines[key].neededIds.push(n.id);
    } else {
      const key = 'needed:' + n.id;
      lines[key] = {
        ingredientName: n.text, unit:'', aisle:'Wait list', shoppingCategory:'Wait list', totalQty:0, hasNumeric:false,
        textQtyParts: [], sources: [], neededIds: [n.id], removed:false, checked:false, source:'needed', neededId: n.id, fromFridgeList: true
      };
    }
  });
  // Staples (feature-gated): always-buy regulars appended to every generated list.
  // If a recipe already needs the item this week, the existing line just gets flagged.
  if(featureOn('staples')){
    (recipesData.settings.staples || []).forEach(name=>{
      const meta = findIngredientMeta(name);
      const key = (meta ? meta.name : name).trim().toLowerCase();
      if(!key) return;
      /* v21.4: the staple amount is a number in this ingredient's shopping unit, so it
         adds straight into the running total the recipes contribute to. When a recipe
         needs the same ingredient you now get one figure — "2125 mL" — instead of the
         "125 mL + 2 L" the free-text version could only manage. */
      const qty = stapleQtyFor(meta ? meta.name : name);
      if(lines[key]){
        lines[key].fromStaples = true;
        if(qty !== null){ lines[key].totalQty += qty; lines[key].hasNumeric = true; }
        return;
      }
      lines[key] = {
        ingredientName: meta ? meta.name : name,
        unit: (meta && meta.shoppingUnit) || '',
        aisle: (meta && meta.aisle) || 'Uncategorised',
        shoppingCategory: (meta && meta.shoppingCategory) || 'Other',
        totalQty: qty === null ? 0 : qty, hasNumeric: qty !== null,
        textQtyParts: [], sources: [], removed:false, checked:false,
        source:'staple', fromStaples:true
      };
    });
  }
  const arr = Object.values(lines).sort((a,b)=> (a.aisle||'').localeCompare(b.aisle||'') || a.ingredientName.localeCompare(b.ingredientName));
  // Render bookkeeping only. The identity the MERGE and tap-time row lookup use is
  // lineMergeKey(line), which is content-based; this one is positional and changes
  // whenever the list is regenerated. Never use it to match lines across devices.
  arr.forEach((l,idx)=> l.key = 'line-' + idx);
  // Pantry-at-home (feature-gated): recipe-derived Pantry-category lines start in the
  // "at home" group — the usual case is you already have flour/oil/spices — with a
  // one-tap "Need it" to opt in. Wait List lines and staples are ALWAYS active: the
  // wait list exists precisely because someone noted it needs buying, and staples are
  // by definition always bought.
  if(featureOn('pantryAtHome')){
    arr.forEach(l=>{
      if(l.shoppingCategory === 'Pantry' && !l.fromFridgeList && !l.fromStaples && l.source !== 'needed'){
        l.atHome = true;
      }
    });
  }
  /* v22.0: the same effect, but earned rather than guessed — things the family has said
     "we have that" about every time they have come up. Not feature-gated, because the
     list is empty until somebody accepts a suggestion in Settings. Wait List lines and
     staples are excluded for exactly the reasons above: both exist because somebody
     asked for them to be bought. */
  const alwaysAtHome = (recipesData.settings && recipesData.settings.alwaysAtHome) || [];
  if(alwaysAtHome.length){
    const athSet = {};
    alwaysAtHome.forEach(n=>{ athSet[String(n).trim().toLowerCase()] = true; });
    arr.forEach(l=>{
      if(athSet[(l.ingredientName || '').trim().toLowerCase()]
         && !l.fromFridgeList && !l.fromStaples && l.source !== 'needed'){
        l.atHome = true;
      }
    });
  }
  // Carry the trip's progress across the rebuild (ticks, removals, and any explicit
  // "Need it"/"At home" choice) together with the stamps the sync merge resolves on.
  // Without the stamps a carried-over tick would look unstamped to the other device
  // and lose to its stale copy of the same line.
  /* v23.3: two kinds of work live on these lines and they do not have the same lifetime.
     A TICK means "in the trolley" — it belongs to the trip being shopped and must never
     leak into a different one (v21.8). A removal or an "at home" is a statement about the
     week and the cupboard — "we already have olive oil", "not chorizo this week" — and it
     is still true whichever generation of the list is on the screen. Both used to be
     carried only on a same-trip rebuild, so adding one recipe undid every deselection the
     family had made. Decisions now cross any rebuild; ticks still cross only their own
     trip. A finished shop carries nothing: finishShopping clears the list, and the guard
     below says so for any path that reaches here with one still marked done. */
  const shopFinished = !!shoppingData.weekPlan.shoppingDoneAt;
  arr.forEach(l=>{
    const p = prevByKey[lineMergeKey(l)];
    if(!p || shopFinished) return;
    l.removed = !!p.removed;
    l.removedAt = p.removedAt || (p.removed ? (p.changedAt || null) : null);
    if(p.atHomeAt){ l.atHome = !!p.atHome; l.atHomeAt = p.atHomeAt; }
    else if(p.atHome === false && l.atHome){ l.atHome = false; } // pre-v21 "Need it"
    if(p.changedAt) l.changedAt = p.changedAt;
    if(!sameTrip) return;
    l.checked = !!p.checked;
    l.checkedAt = p.checkedAt || (p.checked ? (p.changedAt || null) : null);
  });
  shoppingData.shoppingList = arr;
  shoppingData.weekPlan.generatedAt = generatedNow;
  /* The trip id is what lets the merge tell "the same list, edited by two people"
     apart from "a genuinely newer list". It must survive a same-trip rebuild, or
     each device would call its own rebuild a new trip and discard the other's work. */
  shoppingData.weekPlan.tripId = sameTrip ? prevTripId : ('trip:' + generatedNow + ':' + deviceId());
  if(!sameTrip){
    /* What this trip was built on top of, and how caught-up this device was when it
       built it. Together they let the merge tell a deliberate replacement from a list
       generated by a phone that had never seen the one it is about to overwrite —
       see chooseTripWinner. */
    shoppingData.weekPlan.supersedes = prevTripId || null;
    shoppingData.weekPlan.basedOn = shoppingSeenRemoteAt || shoppingData.lastUpdated || null;
  }
  shoppingData.weekPlan.shoppingDoneAt = null; // a fresh list is an unfinished list
  shoppingData.weekPlan.lastGeneratedRecipeSignature = recipeSelectionsSignature();
  shoppingData.weekPlan.lastGeneratedRecipeSelections = recipeSelectionsList();
  shoppingData.weekPlan.lastGeneratedSignature = selectionsSignature();
  persist('shopping');
  persist('recipes'); // saves the lastPlanned stamps set above — NOT lastCooked, which
                      // only the Menu tab's cooked tick writes
}

// The recipe picks alone, ignoring the Wait List — used to decide whether a
// completed shopping trip has been superseded by a genuinely new week's menu.
function recipeSelectionsSignature(){
  return JSON.stringify(shoppingData.weekPlan.selections
    .map(s=>({r:s.recipeId, s:s.servings}))
    .sort((a,b)=> a.r < b.r ? -1 : a.r > b.r ? 1 : 0));
}

/* v23.5: `done` was one flag doing two jobs with different lifetimes.

   Ticking a line in the aisle is a TICK — "it is in the trolley on this trip" — and the
   app's rule is that a tick does not outlive its trip. Ticking an entry on the Wait List
   tab is a DECISION about the week — "we do not need that" — and a decision does.

   Nothing recorded which was which, and because neededList is authored data it merges
   trip-independently while shoppingList does not. So when two phones ended up on
   different trip ids, one phone's aisle ticks were discarded wholesale with its list
   while the same ticks crossed the Wait List entries off everywhere — the family sees the
   Wait List items struck through and the recipe ingredients untouched. Worse,
   finishShopping deletes every done entry, so the shop ended by binning Wait List items
   nobody had bought.

   `doneTripId` is stamped by the aisle route only. Absent means a decision, which is also
   what every build before v23.5 wrote, so an old copy keeps behaving exactly as it did. */
function doneCountsHere(n, sd){
  if(!n || !n.done) return false;
  if(!n.doneTripId) return true;                 // a Wait List decision, or a pre-v23.5 copy
  return n.doneTripId === tripIdOf(sd || shoppingData);
}

/* v23.7: Wait List entries that are not on the shopping list yet.

   Membership is decided by the ENTRY'S ID appearing in a line's neededIds, not by the
   ingredient name being somewhere on the list. A Wait List "milk" added while a recipe
   already needs Milk folds onto that existing line — and until the line carries the
   entry's id, ticking it off in the aisle does not cross the entry off, because
   syncNeededFromLine has nothing to look the entry up by. Name-matching here would call
   that case satisfied and leave the two permanently out of step.

   Reads recipesData through findIngredientMeta, the same way the fold in
   generateShoppingList does, so the two agree about which line an entry belongs on. */
function pendingWaitListLines(sd){
  const byKey = {};
  ((sd && sd.shoppingList) || []).forEach(l=>{ byKey[lineMergeKey(l)] = l; });
  return ((sd && sd.neededList) || []).filter(n=>{
    if(!n || doneCountsHere(n, sd)) return false;
    const m = findIngredientMeta(n.text);
    const line = byKey[m ? ('ing:' + (m.name||'').trim().toLowerCase()) : ('needed:' + n.id)];
    return !line || ((line.neededIds || []).indexOf(n.id) === -1);
  });
}

// Marks the Wait List entries behind a shopping line as done / not done, so
// ticking something off in the aisle ticks it off the Wait List as well.
function syncNeededFromLine(line, done){
  const ids = (line.neededIds && line.neededIds.length) ? line.neededIds
            : (line.neededId ? [line.neededId] : []);
  if(!ids.length) return;
  const trip = tripIdOf(shoppingData);
  shoppingData.neededList.forEach(n=>{
    if(ids.indexOf(n.id) === -1) return;
    n.done = done;
    n.changedAt = new Date().toISOString();
    // Which trip's trolley this went into. Untick clears it: there is nothing to scope.
    if(done && trip) n.doneTripId = trip; else delete n.doneTripId;
  });
}

// Shopping trip finished: clear the shopping list, and drop the Wait List entries this
// trip is entitled to drop. Both routes set `done` — ticking the line in the aisle (via
// syncNeededFromLine: it was bought) and ticking the entry on the Wait List tab (not
// required, or already bought) — and either way the entry has served its purpose.
// v23.5: "this trip is entitled to" is doneCountsHere. A tick that arrived from a phone
// on a DIFFERENT trip is not this shop's, and deleting on it is how Wait List items
// nobody bought were silently binned.
function finishShopping(){
  const going = shoppingData.neededList.filter(n=> doneCountsHere(n));
  const names = going.slice(0,8).map(n=>'  \u2022 ' + n.text).join('\n')
    + (going.length > 8 ? '\n  \u2026and ' + (going.length-8) + ' more' : '');
  const msg = 'Mark this shopping as done?\n\nThe shopping list will be cleared — including on anyone else’s phone shopping from the same list.'
    + (going.length
        ? '\n\nThese ' + going.length + ' ticked Wait List item(s) will be removed:\n' + names
        : '\n\nNothing on the Wait List is ticked off, so the Wait List is left as it is.')
    + '\n\nYour menu list and recipe picks are not touched.';
  if(!confirm(msg)) return;
  shoppingData.neededRemoved = noteRemoved(shoppingData.neededRemoved,
    going.map(n=> n.id), new Date().toISOString());
  shoppingData.neededList = shoppingData.neededList.filter(n=> !doneCountsHere(n));
  shoppingData.weekPlan.shoppingDoneAt = new Date().toISOString();
  // Order matters: the trip goes into the archive while the list it is made of still
  // exists. The next line is where a week's worth of ticks used to vanish for good.
  archiveFinishedTrip();
  shoppingData.shoppingList = [];
  shoppingData.weekPlan.lastGeneratedRecipeSignature = recipeSelectionsSignature();
  shoppingData.weekPlan.lastGeneratedRecipeSelections = recipeSelectionsList();
  persist('shopping');
  render();
  setStatus('Shopping marked as done — list cleared, menu kept.', 'ok');
}

/* Pure. The weekPlan that deliberately replaces `sd`'s week with an empty one.

   v22.1. "Clear all selections" used to assign `{ selections: [], generatedAt: null }`,
   which threw away the whole weekPlan — tripId, supersedes, basedOn, generatedAt — and
   those are exactly the four fields chooseTripWinner decides on. So a cleared week
   reached the merge with no argument to make: it could not claim to supersede anything
   (tripIdOf returned null, since generatedAt was nulled too and that is the fallback),
   it was never live, its basedOn was 0 and its generatedAt was 0. Every rule tied or
   went the other way, so any surviving copy of the old week won outright and put the
   recipes straight back on the next poll. One phone with a healthy upload settled, which
   is why it survived four releases; a household with two did not.

   Clearing the week is the same act as replacing a list — a person deciding this week is
   finished with — so it is expressed the same way, exactly as putBackReplacedList does:
   a new trip that names the one it replaces. Rule 1 of chooseTripWinner then carries it
   on every device. Older phones honour it too: chooseTripWinner is unchanged since
   v21.8, and builds older than that took the later generatedAt, which this now sets to
   the newest possible value rather than null. */
function clearedWeekPlan(sd, now, byDevice, seenRemoteAt){
  const clearing = (((sd && sd.weekPlan && sd.weekPlan.selections) || [])).map(s=> s && s.recipeId);
  return {
    selections: [],
    // v23.2: what was cleared, and when. Without this the merge is left inferring the
    // deletion from timestamps, which is how a week nobody had touched kept coming back.
    selectionsRemoved: noteRemoved(sd && sd.weekPlan && sd.weekPlan.selectionsRemoved, clearing, now),
    generatedAt: now,
    tripId: 'trip:' + now + ':' + byDevice,
    supersedes: tripIdOf(sd),
    basedOn: seenRemoteAt || (sd && sd.lastUpdated) || null,
    shoppingDoneAt: null,
    // An empty week is not stale — shoppingListIsStale returns false with no selections —
    // so nothing regenerates off these, and the next real generate mints its own trip.
    lastGeneratedRecipeSignature: null,
    lastGeneratedRecipeSelections: null,
    lastGeneratedSignature: null
  };
}

/* What was on the list that got replaced, in the words that fit what was actually done
   to it. v23.3: before this, the card always said "N item(s) ticked", which read as "0
   item(s) ticked" for a list somebody had spent an evening pruning — the exact work this
   release exists to stop losing. */
// Joining one sentence onto another without shouting mid-line.
function lowerFirst(str){
  return str ? str.charAt(0).toLowerCase() + str.slice(1) : str;
}

function replacedTripSummary(t){
  const ticks = (t && t.ticks) || 0;
  const others = Math.max(0, ((t && t.decisions) || 0) - ticks);
  if(ticks && others) return 'It had ' + ticks + ' item(s) ticked and ' + others + ' marked at home or removed';
  if(ticks) return 'It had ' + ticks + ' item(s) ticked';
  if(others) return 'It had ' + others + ' item(s) marked at home or removed';
  return 'It was the list you had';
}

/* Undo for a superseded trip. The restored list has to WIN once it goes back, or the
   copy that displaced it simply arrives again on the next poll — so it goes back as a
   deliberate replacement of that copy: a new trip id, superseding the one on screen,
   carrying the old lines and their ticks. That is the same causal rule the merge uses
   for any other deliberate replacement, rather than a special case bolted beside it. */
function putBackReplacedList(){
  if(!replacedTrip) return;
  const msg = 'Put back the list that was replaced?\n\n'
    + replacedTripSummary(replacedTrip)
    + ', and it comes back along with the recipe picks that list was made from.'
    + '\n\nThe list that replaced it goes — on every phone, within a few seconds.';
  if(!confirm(msg)) return;
  const now = new Date().toISOString();
  shoppingData.weekPlan = Object.assign({}, replacedTrip.weekPlan, {
    tripId: 'trip:' + now + ':' + deviceId(),
    supersedes: tripIdOf(shoppingData),
    basedOn: shoppingSeenRemoteAt || shoppingData.lastUpdated || null,
    generatedAt: now,
    shoppingDoneAt: null
  });
  shoppingData.shoppingList = replacedTrip.shoppingList.map(l=> Object.assign({}, l));
  replacedTrip = null;
  tripDisagreement = null;
  persist('shopping');
  render();
  setStatus('Put the previous list back, ticks and all.', 'ok');
}

/* v23.6: the other half of putBackReplacedList, and the reason the pair exists.

   "Keep this one" used to just drop the local stash, which settles nothing — the phone
   holding the other list goes on offering it every poll until something supersedes it,
   and two phones can sit disagreeing indefinitely with each side believing it had
   decided. Keeping a list is as deliberate an act as putting one back, so it is expressed
   the same way: a new trip id naming the one it replaces, which wins outright everywhere
   by chooseTripWinner's first rule instead of arguing on.

   The lines and their ticks are untouched — only the trip's identity and lineage change,
   so lastGeneratedRecipeSignature still matches and the next rebuild is still a same-trip
   one. */
function keepThisList(){
  if(!replacedTrip) return;
  const now = new Date().toISOString();
  shoppingData.weekPlan = Object.assign({}, shoppingData.weekPlan, {
    tripId: 'trip:' + now + ':' + deviceId(),
    supersedes: replacedTrip.tripId,
    basedOn: shoppingSeenRemoteAt || shoppingData.lastUpdated || null,
    generatedAt: now
  });
  replacedTrip = null;
  tripDisagreement = null;
  persist('shopping');
  render();
  setStatus('Kept this list. The other one is replaced on every phone.', 'ok');
}

function shoppingListIsStale(){
  if(shoppingData.weekPlan.selections.length === 0) return false;
  // A completed trip leaves an empty list on purpose. Don't treat that as stale
  // and silently regenerate it the moment the tab is opened.
  // Wait List additions during the week must NOT undo that — only a genuine change
  // to the week's recipe picks starts a new list off its own bat.
  if(shoppingData.weekPlan.shoppingDoneAt
     && shoppingData.weekPlan.lastGeneratedRecipeSignature === recipeSelectionsSignature()) return false;
  if(!shoppingData.shoppingList || shoppingData.shoppingList.length === 0) return true;
  return shoppingData.weekPlan.lastGeneratedSignature !== selectionsSignature();
}

/* ---------------- rendering ---------------- */

/* v23.6: switching tab from somewhere other than the nav — the sync banner's "Sort this
   out" — has to move the nav highlight too, or the app says it is on one tab and shows
   another. One definition so the two routes cannot drift. */
function goToTab(name){
  currentTab = name;
  saveUiState();
  document.querySelectorAll('#mainNav button').forEach(b=>
    b.classList.toggle('active', b.dataset.tab === name));
  render();
}

function bindNav(){
  document.getElementById('mainNav').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    goToTab(btn.dataset.tab);
  });
}

function bindHeaderButtons(){
  document.getElementById('btnSync').addEventListener('click', showSyncModal);
}

function render(){
  const app = document.getElementById('app');
  // Keep the nav in step with currentTab — it can now be restored from a previous
  // session, so the markup's default "active" button is not necessarily right.
  document.querySelectorAll('#mainNav button').forEach(b=>
    b.classList.toggle('active', b.dataset.tab === currentTab));
  app.innerHTML = '';
  if(currentTab==='recipes') app.appendChild(renderRecipesTab());
  else if(currentTab==='start') app.appendChild(renderStartTab());
  else if(currentTab==='review') app.appendChild(renderReviewTab());
  else if(currentTab==='needed') app.appendChild(renderNeededTab());
  else if(currentTab==='menu') app.appendChild(renderMenuTab());
  else if(currentTab==='settings') app.appendChild(renderSettingsTab());
}

// A full render() rebuilds the tab and drops the user at the top of the page. That is
// merely annoying on a desktop and genuinely disruptive in aisle 7, so anything the
// shopper triggers mid-shop goes through this instead.
function rerenderPreservingScroll(){
  const y = window.scrollY;
  render();
  requestAnimationFrame(()=>window.scrollTo(0, y));
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

/* ---- All Recipes tab ---- */
function daysSinceStamp(stamp){
  if(!stamp) return null;
  const ms = Date.now() - new Date(stamp).getTime();
  return Math.max(0, Math.floor(ms / (1000*60*60*24)));
}
function daysSinceCooked(recipe){ return daysSinceStamp(recipe.lastCooked); }
function daysSincePlanned(recipe){ return daysSinceStamp(recipe.lastPlanned); }

/* v22.0: two different facts, and the difference is the whole point of the badge.
   "Cooked" means somebody ticked it on the Menu tab. "Planned" means it went on a
   shopping list and nobody ever said what happened next. Show the stronger claim when
   there is one, and never dress the weaker one up as the stronger. */
function recipeHistoryLabel(recipe){
  const threshold = (recipesData.settings && recipesData.settings.notCookedRecentlyDays) || 60;
  const cooked = daysSinceCooked(recipe);
  if(cooked !== null){
    if(cooked === 0) return {text:'Cooked today', stale:false};
    if(cooked === 1) return {text:'Cooked yesterday', stale:false};
    return {text:'Cooked ' + cooked + ' days ago', stale: cooked >= threshold};
  }
  const planned = daysSincePlanned(recipe);
  if(planned !== null){
    if(planned === 0) return {text:'Planned today', stale:false};
    if(planned === 1) return {text:'Planned yesterday', stale:false};
    return {text:'Planned ' + planned + ' days ago', stale: planned >= threshold};
  }
  return {text:'Never cooked', stale:true};
}

// What the "not cooked recently" sort orders by: the most recent thing known about this
// recipe, whether that is a cook or merely a plan. 0 means nothing is known, which sorts
// first — the same rule as before, now reading both stamps instead of one.
function recipeHistoryTime(recipe){
  const c = recipe.lastCooked ? new Date(recipe.lastCooked).getTime() : 0;
  const p = recipe.lastPlanned ? new Date(recipe.lastPlanned).getTime() : 0;
  return Math.max(c, p);
}

function renderRecipesTab(){
  const wrap = document.createDocumentFragment ? el('div',{}) : null;
  const container = el('div',{});
  const historyOn = !!(recipesData.settings && recipesData.settings.recipeHistoryEnabled);
  const searchbar = el('div',{class:'searchbar'});
  const searchInput = el('input',{type:'search', placeholder:'Search recipes…'});
  const catSelect = el('select',{});
  const cats = Array.from(new Set(recipesData.recipes.map(r=>r.category).filter(Boolean))).sort();
  catSelect.appendChild(el('option',{value:''},['All categories']));
  cats.forEach(c=> catSelect.appendChild(el('option',{value:c},[c])));
  const sortSelect = el('select',{});
  sortSelect.appendChild(el('option',{value:'name'},['Sort: Name (A–Z)']));
  if(historyOn) sortSelect.appendChild(el('option',{value:'history'},['Sort: Not cooked recently first']));
  const addBtn = el('button',{class:'btn'},['+ Add recipe']);
  addBtn.addEventListener('click', ()=> openRecipeEditor('new'));
  const importBtn = el('button',{class:'btn secondary'},['Import from website']);
  importBtn.addEventListener('click', openWebImport);
  const shareBtn = el('button',{class:'btn secondary'},['Share recipes']);
  const importShareBtn = el('button',{class:'btn secondary'},['Import shared file']);
  importShareBtn.addEventListener('click', importSharedRecipes);
  searchbar.appendChild(searchInput); searchbar.appendChild(catSelect);
  if(historyOn) searchbar.appendChild(sortSelect);
  searchbar.appendChild(addBtn); searchbar.appendChild(importBtn);
  searchbar.appendChild(shareBtn); searchbar.appendChild(importShareBtn);
  container.appendChild(searchbar);

  // Selection mode: cards get a tick box and stop opening the viewer, so a batch
  // can be picked and exported as one share file.
  let selectMode = false;
  const selected = new Set();
  const selectBar = el('div',{class:'card', style:'display:none;'});
  const selectCount = el('span',{class:'muted'},['']);
  const exportSelBtn = el('button',{class:'btn'},['Export selected']);
  const selectAllBtn = el('button',{class:'btn secondary small'},['Select all shown']);
  const clearSelBtn = el('button',{class:'btn secondary small'},['Clear']);
  const cancelSelBtn = el('button',{class:'btn secondary small'},['Cancel']);
  function updateSelectBar(){
    selectCount.textContent = selected.size + ' selected';
    exportSelBtn.disabled = selected.size === 0;
  }
  exportSelBtn.addEventListener('click', ()=> exportSelectedRecipes(Array.from(selected)));
  clearSelBtn.addEventListener('click', ()=>{ selected.clear(); draw(); });
  cancelSelBtn.addEventListener('click', ()=>{
    selectMode = false; selected.clear();
    selectBar.style.display = 'none';
    shareBtn.textContent = 'Share recipes';
    draw();
  });
  shareBtn.addEventListener('click', ()=>{
    selectMode = !selectMode;
    if(!selectMode) selected.clear();
    selectBar.style.display = selectMode ? '' : 'none';
    shareBtn.textContent = selectMode ? 'Stop selecting' : 'Share recipes';
    draw();
  });
  selectBar.appendChild(el('p',{style:'margin-top:0;'},['Tick the recipes you want to send, then export them as a single file. The file carries the recipes and the ingredients they use — nothing else.']));
  const selRow = el('div',{class:'row'});
  selRow.appendChild(exportSelBtn); selRow.appendChild(selectAllBtn);
  selRow.appendChild(clearSelBtn); selRow.appendChild(cancelSelBtn); selRow.appendChild(selectCount);
  selectBar.appendChild(selRow);
  container.appendChild(selectBar);

  const countNote = el('div',{class:'muted', style:'margin-bottom:10px;'},[recipesData.recipes.length + ' recipes in your book']);
  container.appendChild(countNote);

  const grid = el('div',{class:'recipe-grid'});
  container.appendChild(grid);

  function draw(){
    grid.innerHTML = '';
    const q = searchInput.value.trim().toLowerCase();
    const cat = catSelect.value;
    const sortMode = historyOn ? sortSelect.value : 'name';
    const list = recipesData.recipes.filter(r=>{
      if(cat && r.category !== cat) return false;
      if(q && !r.name.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=>{
      if(sortMode === 'history'){
        const da = recipeHistoryTime(a), db = recipeHistoryTime(b);
        if(da !== db) return da - db; // never-cooked (0) and oldest first
      }
      return a.name.localeCompare(b.name);
    });
    if(list.length===0){ grid.appendChild(el('div',{class:'empty-state'},['No recipes match.'])); return; }
    list.forEach(r=>{
      const card = el('div',{class:'recipe-card'});
      if(r.images && r.images[0] && imagesData[r.images[0]]){
        const img = el('img',{src:'data:'+imagesData[r.images[0]].type+';base64,'+imagesData[r.images[0]].base64});
        card.appendChild(img);
      }
      card.appendChild(el('h3',{},[r.name]));
      const meta = el('div',{class:'muted'},[(r.category||'Uncategorised') + ' · serves ' + (r.servings||'?')]);
      card.appendChild(meta);
      const badges = el('div',{style:'margin-top:6px;'});
      if(r.source==='wiki_import') badges.appendChild(el('span',{class:'badge'},['from wiki, please check']));
      else if(r.source==='web_import') badges.appendChild(el('span',{class:'badge'},['from web — please check']));
      if(historyOn){
        const h = recipeHistoryLabel(r);
        badges.appendChild(el('span',{class:'badge' + (h.stale?' stale':'')},[h.text]));
      }
      card.appendChild(badges);
      if(selectMode){
        const cb = el('input',{type:'checkbox', style:'margin-top:8px;'});
        cb.checked = selected.has(r.id);
        cb.addEventListener('click', (e)=> e.stopPropagation());
        cb.addEventListener('change', ()=>{
          if(cb.checked) selected.add(r.id); else selected.delete(r.id);
          updateSelectBar();
        });
        card.appendChild(el('label',{class:'muted', style:'display:flex;align-items:center;gap:6px;font-size:.85rem;'},[cb,'Include in share']));
        card.addEventListener('click', ()=>{
          cb.checked = !cb.checked;
          if(cb.checked) selected.add(r.id); else selected.delete(r.id);
          updateSelectBar();
        });
      } else {
        card.addEventListener('click', ()=> openRecipeViewer(r.id));
      }
      grid.appendChild(card);
    });
    if(selectMode){
      selectAllBtn.onclick = ()=>{ list.forEach(r=> selected.add(r.id)); draw(); };
      updateSelectBar();
    }
  }
  searchInput.addEventListener('input', draw);
  catSelect.addEventListener('change', draw);
  sortSelect.addEventListener('change', draw);
  draw();
  return container;
}

function openRecipeViewer(id){
  const r = recipesData.recipes.find(x=>x.id===id);
  if(!r) return;
  const body = el('div',{});
  body.appendChild(el('h2',{},[r.name]));
  body.appendChild(el('div',{class:'muted'},[(r.category||'Uncategorised')+' · serves '+(r.servings||'?')+(r.slowCooker?' · slow cooker':'')]));
  if('wakeLock' in navigator){
    const wakeCb = el('input',{type:'checkbox'});
    const wakeRow = el('label',{class:'muted', style:'display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer;font-size:.85rem;'},[wakeCb, 'Keep screen on while this recipe is open']);
    wakeCb.addEventListener('change', async ()=>{
      if(wakeCb.checked){
        wakeLockWanted = true;
        const ok = await acquireWakeLock();
        if(!ok){ wakeCb.checked = false; wakeLockWanted = false; }
      } else {
        releaseWakeLock();
      }
    });
    body.appendChild(wakeRow);
  }
  if(r.sourceUrl){ body.appendChild(el('div',{class:'muted',style:'margin-top:2px;'},[el('a',{href:r.sourceUrl,target:'_blank',rel:'noopener'},['Source website ↗'])])); }
  if(r.images && r.images[0] && imagesData[r.images[0]]){

function slugify(name){
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  let slug = base, i = 2;
  while(recipesData.recipes.some(r=>r.id===slug)){ slug = base + '-' + (i++); }
  return slug;
}

/* Pure. How many of each shop's picks actually got cooked. Nothing is amended after the
   fact — the trip records what was bought, the recipe records when it was cooked (since
   v22.0, honestly), and the answer is the overlap: a cook stamp falling between this shop
   and the next one.
   It UNDERSTATES, and deliberately so. lastCooked is a single stamp, so a recipe cooked in
   two different weeks only counts for the later one. Reporting "at least N" is the honest
   way to say that, and erring downwards is the safe direction for a number whose whole
   purpose is to ask whether the week is being over-planned. */
function cookRateSummary(trips, recipes, n){
  const all = Array.isArray(trips) ? trips : [];
  const byId = {};
  (recipes || []).forEach(r=>{ if(r && r.id) byId[r.id] = r; });
  const window = (n && n > 0) ? all.slice(Math.max(0, all.length - n)) : all.slice();
  let picked = 0, cooked = 0;
  window.forEach(trip=>{
    const from = tsOf(trip && trip.doneAt);
    // The next shop in the WHOLE history, not just the window, or the oldest trip in view
    // would be handed an open-ended claim on every cook since.
    const idx = all.indexOf(trip);
    const until = (idx >= 0 && all[idx + 1]) ? tsOf(all[idx + 1].doneAt) : Infinity;
    (((trip && trip.selections) || [])).forEach(s=>{
      if(!s || !s.recipeId) return;
      picked++;
      if(s.cooked){ cooked++; return; }   // already ticked before the shop was closed
      const r = byId[s.recipeId];
      const t = (r && r.lastCooked) ? tsOf(r.lastCooked) : 0;
      if(t && t >= from && t < until) cooked++;
    });
  });
  return { shops: window.length, picked: picked, cooked: cooked };
}

/* Pure. Things waved past as "we already have this" every single time they have come up
   recently. Counted backwards from the most recent shop and stopped at the first time the
   answer was different: an item that was at home three times and then genuinely needed is
   not a pantry item, it is one you ran out of.
   Only DELIBERATE at-home taps count — atHomeAt is present only when somebody pressed the
   button, never when the pantry rule set the flag from a category. */
function atHomeStreaks(trips, minRun){
  const need = minRun || 3;
  const all = Array.isArray(trips) ? trips : [];
  const runs = {}, broken = {};
  for(let i = all.length - 1; i >= 0; i--){
    (((all[i] && all[i].lines) || [])).forEach(l=>{
      if(!l || !l.name || l.removed) return;
      if(broken[l.name]) return;
      if(l.atHome && l.atHomeAt) runs[l.name] = (runs[l.name] || 0) + 1;
      else broken[l.name] = true;
    });
  }
  return Object.keys(runs)
    .filter(k=> !broken[k] && runs[k] >= need)
    .sort((a,b)=> runs[b] - runs[a] || a.localeCompare(b))
    .map(k=>({ name: k, runs: runs[k] }));
}

/* v23.0: a pick is an AUTHORED item, so it carries the stamps the merge needs — when it
   came into existence, and when it was last edited. Without addedAt the merge cannot tell
   a recipe somebody just chose on a phone that was out of contact from one everybody has
   already seen and dropped, which is why the picks used to be taken wholesale from
   whichever file happened to be newer. Both fields are additive; an older build reads and
   writes the selection without them and simply loses this device's ability to be precise
   about it, never the pick itself. */
function newSelection(recipeId, servings, now){
  const at = now || new Date().toISOString();
  return { recipeId: recipeId, servings: servings, addedAt: at, changedAt: at };
}

/* ---- Start New Shopping List tab ---- */
function renderStartTab(){
  const container = el('div',{});

  /* v21.9: once a shop is under way the week's recipes are fixed, and this tab says so
     rather than letting somebody change them and then negotiating about whose list
     survives. Changing the picks mid-shop was the only ordinary way to end up with two
     lists at once, and asking people to choose between them — which is what the
     previous build did — confused everyone it was meant to protect. There is nothing
     to choose now: add to the Wait List instead, which reaches the shopper in seconds
     and keeps their ticks, and the picks are free again the moment the shop is
     finished. */
  const shopping = shoppingInProgress();
  if(shopping){
    const p = tripProgress(shoppingData);
    const card = el('div',{class:'card notice-card'});
    card.appendChild(el('p',{style:'margin-top:0;'},[
      el('strong',{},['A shop is under way — ' + p.ticks + ' item(s) already in the trolley.'])
    ]));
    card.appendChild(el('p',{class:'muted', style:'margin-bottom:0;'},[
      'This week’s recipes are fixed until it is finished, so nobody’s list changes while '
      + 'they are walking round the shop. Something else needed? Put it on the '
      + 'Wait List — it reaches the shopper straight away. When the shopping is done, tap '
      + '“Shopping is done” on the Review tab and the recipes can be changed again.'
    ]));
    container.appendChild(card);
  }

  container.appendChild(el('div',{class:'card'},[
    el('p',{},['Pick the recipes you want to cook this week. Starting a new list clears last week’s selections and the generated shopping list — your Wait List is untouched.']),
    (function(){
      const btn = el('button',{class:'btn secondary'},['Clear all selections']);
      btn.disabled = shopping;
      btn.addEventListener('click', ()=>{
        if(shoppingData.weekPlan.selections.length===0 && shoppingData.shoppingList.length===0) return;
        if(!confirm('Clear this week’s selected recipes and shopping list? Your Wait List will not be affected.')) return;
        // Stash first, while the list still exists: clearing a week somebody has ticked
        // is destructive, and v21.6's rule is that destructive actions are recoverable
        // rather than merely confirmed. No-ops unless the trip had progress, and the
        // Review tab's "Put back the list that was replaced" is then the way back.
        stashReplacedTrip(shoppingData);
        shoppingData.weekPlan = clearedWeekPlan(
          shoppingData, new Date().toISOString(), deviceId(), shoppingSeenRemoteAt);
        shoppingData.shoppingList = [];
        persist('shopping');
        render();
      });
      return btn;
    })()
  ]));

  /* ---- v20: pinned "picked" summary ----
     With 635 recipes, selections were scattered through the grid and the only feedback
     was a count in the footer, so "which ones did I pick?" meant scrolling the library.
     This card is the answer, and it is where the servings get adjusted. */
  const pickedCard = el('div',{class:'card picked-card'});
  container.appendChild(pickedCard);

  const searchbar = el('div',{class:'searchbar'});
  const searchInput = el('input',{type:'search', placeholder:'Search recipes to add…'});

    pickedCard.innerHTML = '';

      row.appendChild(nm);
      const serv = el('input',{type:'number', class:'qty-input', min:'1', value: sel.servings || 4});

        sel.servings = parseInt(serv.value,10) || (r && r.servings) || 4;
        sel.changedAt = new Date().toISOString();
        persist('shopping');

      });

      row.appendChild(serv);
