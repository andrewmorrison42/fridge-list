function openImportWorkbench(data){
  const body = el('div',{});
  body.appendChild(el('h2',{},['Review imported recipe']));
  if(data.url) body.appendChild(el('p',{class:'muted',style:'margin-top:-8px;'},['From: '+data.url]));

  const topRow = el('div',{class:'row'});
  const nameInput = el('input',{type:'text', value:data.name||'', style:'flex:2;min-width:220px;'});
  const servingsInput = el('input',{type:'number', min:'1', value:String(parseInt(String(data.servings||'').replace(/[^0-9]/g,''),10)||4), style:'width:80px;'});
  const catDlId = 'import-category-suggestions';
  const catDl = el('datalist',{id:catDlId});
  knownRecipeCategories().forEach(c=> catDl.appendChild(el('option',{value:c})));
  const catInput = el('input',{type:'text', placeholder:'Category…', list:catDlId, autocomplete:'off', style:'flex:1;min-width:140px;'});
  topRow.appendChild(el('span',{class:'muted'},['Name'])); topRow.appendChild(nameInput);
  topRow.appendChild(el('span',{class:'muted'},['Serves'])); topRow.appendChild(servingsInput);
  topRow.appendChild(catInput); topRow.appendChild(catDl);
  body.appendChild(topRow);

  const cols = el('div',{class:'import-cols', style:'margin-top:14px;'});

  /* column 1: method, editable */
  const methodCol = el('div',{});
  methodCol.appendChild(el('h4',{style:'margin-top:0;'},['Method — edit to suit']));
  const methodArea = el('textarea',{rows:'22', placeholder:'One step per line… Start a line with — or -- for a section heading (e.g. — Icing)'});
  methodArea.value = (data.method||[]).join('\n');
  methodCol.appendChild(methodArea);

  /* ingredients table: website line beside your entry, aligned row by row */
  const entryCol = el('div',{});
  entryCol.appendChild(el('h4',{style:'margin-top:0;'},['Ingredients']));
  entryCol.appendChild(el('p',{class:'muted',style:'margin-top:-6px;font-size:0.8em;'},['Left: exactly as on the website. Right: your version — tap a suggestion chip or start typing to match your master list, then set the quantity. New names are added uncategorised.']));
  const ingWrap = el('div',{});
  const dlId = 'import-ingredient-suggestions';
  const dl = el('datalist',{id:dlId});
  knownIngredientAllNames().forEach(n=> dl.appendChild(el('option',{value:n})));
  entryCol.appendChild(dl);
  const headRow = el('div',{class:'import-table-row import-table-head'});
  headRow.appendChild(el('div',{},['From the website']));
  headRow.appendChild(el('div',{},['Your ingredient · quantity · unit']));
  entryCol.appendChild(headRow);
  if(!(data.ingredients||[]).length){
    entryCol.appendChild(el('p',{class:'muted'},['No ingredient lines were captured — add rows below.']));
  }

  function addImportRow(scrapedLine){
    const wrapper = el('div',{class:'import-table-row'});
    const leftCell = el('div',{class:'scraped-cell'},[scrapedLine || '—']);
    const rightCell = el('div',{});
    const row = el('div',{class:'ingredient-editor-row', style:'margin-bottom:2px;'});
    const name = el('input',{type:'text', placeholder:'ingredient name', class:'ing-name-input', list:dlId, autocomplete:'off'});
    const qty = el('input',{type:'text', placeholder:'quantity', class:'qty-input'});
    const unit = el('input',{type:'text', placeholder:'unit', class:'unit-input'});
    const unitSel = el('select',{class:'unit-select', style:'display:none;'});
    const rm = el('button',{class:'btn small danger', type:'button'},['✕']);
    rm.addEventListener('click', ()=> wrapper.remove());
    const hint = el('div',{class:'muted', style:'font-size:0.8em;padding-left:2px;'},['']);
    const updateHint = wireUnitControls(name, qty, unit, unitSel, hint, null);
    if(scrapedLine){
      const chips = el('div',{class:'chip-row'});
      suggestMasterMatches(scrapedLine, 3).forEach(mName=>{
        const chip = el('button',{class:'chip', type:'button', title:'Use "'+mName+'"'},[mName]);
        chip.addEventListener('click', ()=>{ name.value = mName; updateHint(); qty.focus(); });
        chips.appendChild(chip);
      });
      if(chips.childNodes.length) rightCell.appendChild(chips);
    }
    row.appendChild(name); row.appendChild(qty); row.appendChild(unit); row.appendChild(unitSel); row.appendChild(rm);
    rightCell.appendChild(row);
    rightCell.appendChild(hint);
    wrapper.appendChild(leftCell); wrapper.appendChild(rightCell);
    ingWrap.appendChild(wrapper);
  }
  ((data.ingredients||[]).length ? data.ingredients : [null]).forEach(addImportRow);
  entryCol.appendChild(ingWrap);
  const addLineBtn = el('button',{class:'btn secondary small', type:'button', style:'margin-top:8px;'},['+ Add ingredient line']);
  addLineBtn.addEventListener('click', ()=> addImportRow(null));
  entryCol.appendChild(addLineBtn);
  const addSecBtn2 = el('button',{class:'btn secondary small', type:'button', style:'margin-top:8px;margin-left:6px;'},['+ Add section heading']);
  addSecBtn2.addEventListener('click', ()=> ingWrap.appendChild(buildSectionHeaderRow('')));
  entryCol.appendChild(addSecBtn2);

  cols.appendChild(methodCol); cols.appendChild(entryCol);
  body.appendChild(cols);

  const saveRow = el('div',{class:'row',style:'margin-top:16px;'});
  const saveBtn = el('button',{class:'btn'},['Save recipe']);
  saveBtn.addEventListener('click', ()=>{
    const name = nameInput.value.trim();
    if(!name){ alert('Please give the recipe a name.'); return; }
    const collected = collectIngredientRows(ingWrap);
    if(collected.error){ alert(collected.error); return; }
    const ingredients = collected.ingredients;
    if(!ingredients.length && !confirm('No ingredients entered in the right-hand column — save anyway?')) return;
    addNewMasterIngredients(ingredients);
    const method = normalizeMethodLines(methodArea.value);
    let id = slugify(name); const base=id; let k=2;
    while(recipesData.recipes.some(r=>r.id===id)){ id = base+'-'+k; k++; }
    recipesData.recipes.push({id, name, category:catInput.value.trim(), servings:parseInt(servingsInput.value,10)||4,
      slowCooker:false, inSeason:true, ingredients, method, images:[], notes:'',
      source:'web_import', sourceUrl:data.url||''});
    persist('recipes');
    closeModal(); currentTab='recipes'; render();
  });
  const cancelBtn = el('button',{class:'btn secondary'},['Cancel']);
  cancelBtn.addEventListener('click', ()=>{ if(confirm('Discard this import?')) closeModal(); });
  saveRow.appendChild(saveBtn); saveRow.appendChild(cancelBtn);
  body.appendChild(saveRow);
  openModal(body, true);
  document.querySelector('#modalRoot .modal').classList.add('xwide');
}

document.addEventListener('DOMContentLoaded', function(){
  try{
    init();
    if(storageBlockedReason){
      setStatus(storageBlockedReason + ' Open it from a web address, or use Sync options to save to OneDrive.', 'warn');
    }
  }catch(err){
    // Never fail silently on "Loading…" again — say what went wrong, on screen.
    const bar = document.getElementById('statusBar');
    if(bar){
      bar.className = 'status-bar warn';
      bar.textContent = 'Startup failed: ' + ((err && err.message) || err);
    }
    const app = document.getElementById('app');
    if(app){
      app.innerHTML = '<div class="card"><h3>The Fridge List could not start</h3>'
        + '<p>' + String((err && err.message) || err).replace(/[<>&]/g, '') + '</p>'
        + '<p class="muted">If this file was opened straight from disk, try opening it from a web address instead — some browsers block saving for local files.</p></div>';
    }
    throw err;
  }
});

/* Shared guard for both automatic reloads below. Never interrupt an edit in progress —
   and never reload mid-shop: a phone screen locks constantly in a supermarket, so the
   refocus reload fired all the time, and a reload throws away scroll position and any
   in-flight save for no benefit (the 5s poll already keeps the list current). */
/* Everything that makes a repaint rude makes a reload ruder, so this builds on that
   predicate rather than restating it. The two were copies of the same three checks, and a
   check added to one but not the other is how a reload starts throwing away what somebody
   is typing — the v21.5 bug, with a bigger hammer. */
function safeToReload(){
  if(!safeToRepaint()) return false;
  if(currentTab === 'review' && shoppingInProgress()) return false;
  if(pendingSaveRecipes || pendingSaveShopping) return false;
  return true;
}
// The service-worker registration lives in a separate <script> in <head> (it has to run
// before this IIFE), so it needs a way to ask whether reloading now would be rude.
window.__fridgeListSafeToReload = safeToReload;

/* ---- daily auto-reload: picks up changes other family members saved to the shared folder ---- */
const AUTO_RELOAD_MS = 24*60*60*1000; // 1 day
const pageLoadedAt = Date.now();
setInterval(()=>{
  if(Date.now() - pageLoadedAt < AUTO_RELOAD_MS) return;
  if(!safeToReload()) return;
  location.reload();
}, 10*60*1000); // checked every 10 minutes

/* ---- reload on returning to the tab: freshest data when you actually sit down to use it ---- */
const REFOCUS_MIN_HIDDEN_MS = 5*60*1000; // only if the tab was away at least 5 minutes
let hiddenAt = null;
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
  if(hiddenAt === null || Date.now() - hiddenAt < REFOCUS_MIN_HIDDEN_MS) return;
  hiddenAt = null;
  if(!safeToReload()) return;
  location.reload();
});
})();
</script>
